<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body><script src="firebase-config.js"></script>
<meta charset="utf-8">
<title>Paced Tasks</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;500;600&family=Figtree:wght@400;500;600;700&family=Schibsted+Grotesk:wght@600;700;800&display=swap">
<style>
/* Layout: one centered 600px column for the task list, with the day's timeline above it on phones and beside it on wide screens; sheets rise from the bottom on phones and float centered on wide screens; the working screen takes the whole screen */
:root {
  --bg: #F2F3EF;
  --surface: #FFFFFF;
  --surface-2: #E8EAE5;
  --ink: #191C1F;
  --muted: #5D645F;
  --line: #D9DDD6;
  --accent: #2E43C2;
  --accent-ink: #FFFFFF;
  --accent-soft: #E3E7FA;
  --zone: #1D7650;
  --zone-soft: #D8EFE3;
  --warn: #935700;
  --warn-soft: #FAEDD5;
  --stop: #B53A27;
  --stop-soft: #F8E1DB;
  --scrim: rgba(20, 24, 28, .4);
  --shadow: 0 1px 2px rgba(20, 24, 28, .06), 0 6px 20px rgba(20, 24, 28, .07);
  --font-display: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Azeret Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111315; --surface: #1A1D20; --surface-2: #25292D; --ink: #E8EBE9; --muted: #9BA29D; --line: #30353A;
    --accent: #8E9DFF; --accent-ink: #0E1333; --accent-soft: #222949;
    --zone: #5DCB98; --zone-soft: #163126; --warn: #E9AC4F; --warn-soft: #382A13; --stop: #F18A75; --stop-soft: #3B1E19;
    --scrim: rgba(0, 0, 0, .55); --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111315; --surface: #1A1D20; --surface-2: #25292D; --ink: #E8EBE9; --muted: #9BA29D; --line: #30353A;
  --accent: #8E9DFF; --accent-ink: #0E1333; --accent-soft: #222949;
  --zone: #5DCB98; --zone-soft: #163126; --warn: #E9AC4F; --warn-soft: #382A13; --stop: #F18A75; --stop-soft: #3B1E19;
  --scrim: rgba(0, 0, 0, .55); --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink);
  font: 400 16px/1.45 var(--font-body);
  -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body.locked { overflow: hidden; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .45; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); }

.app { max-width: 600px; margin: 0 auto; padding-block: 22px calc(150px + var(--day-lift, 0px)); }
.brand-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 40px; }
.brand { display: flex; align-items: center; gap: 7px; font: 700 13px/1 var(--font-display); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
h1 { font: 800 clamp(32px, 8vw, 42px)/1.05 var(--font-display); letter-spacing: -.02em; margin: 18px 0 6px; text-wrap: balance; }
.sub { margin: 0 0 22px; color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; }
.saved { text-align: center; color: var(--muted); font-size: 12px; margin-top: 28px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid transparent; border-radius: 999px; padding: 10px 18px; font-weight: 600; font-size: 15px; background: var(--surface-2); color: var(--ink); white-space: nowrap; }
.btn:hover:not(:disabled) { box-shadow: inset 0 0 0 999px rgba(127, 127, 127, .1); }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.soft { background: var(--accent-soft); color: var(--accent); }
.btn.ghost { background: transparent; border-color: var(--line); }
.btn.danger { background: transparent; border-color: var(--line); color: var(--stop); }
.btn.big { padding: 15px 26px; font-size: 17px; }
.btn.small { padding: 8px 14px; font-size: 14px; }
.count { font: 600 12px/1 var(--font-mono); background: var(--surface-2); border-radius: 999px; padding: 4px 7px; }
.icon-btn { width: 40px; height: 40px; flex: none; border-radius: 50%; display: grid; place-items: center; border: none; background: transparent; color: var(--muted); padding: 0; }
.icon-btn:hover:not(:disabled) { background: var(--surface-2); color: var(--ink); }
.link { background: none; border: none; color: var(--accent); font-weight: 600; padding: 4px 0; text-align: left; }
.link.small { font-size: 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row-actions { display: flex; align-items: center; gap: 2px; }
.due { font-weight: 600; }
.due.soon { color: var(--warn); }
.due.late { color: var(--stop); }

/* Task list */
.tasks { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.task { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 4px; background: var(--surface); border-radius: var(--r); padding: 6px 12px 6px 6px; box-shadow: var(--shadow); }
.check { width: 42px; height: 42px; flex: none; border: none; background: transparent; padding: 0; display: grid; place-items: center; color: transparent; }
.check > span { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; transition: border-color .15s, background .15s; }
button.check:hover > span { border-color: var(--zone); color: var(--zone); }
.check.on { color: var(--surface); }
.check.on > span { background: var(--zone); border-color: var(--zone); }
.check.sm { width: 38px; height: 38px; }
.check.sm > span { width: 22px; height: 22px; }
.task-body { min-width: 0; text-align: left; background: none; border: none; padding: 12px 6px; display: grid; gap: 4px; }
.task-title { font-weight: 600; font-size: 17px; line-height: 1.3; overflow-wrap: anywhere; }
.task-meta { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.badge { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; color: var(--accent); }
.badge .dot, .mini-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; animation: pulse 1.6s ease-in-out infinite; }
.bar { display: block; height: 4px; background: var(--surface-2); border-radius: 2px; overflow: hidden; margin-top: 4px; }
.bar i { display: block; height: 100%; background: var(--zone); border-radius: 2px; transition: width .3s; }
.bar i.over { background: var(--warn); }
.start { padding-left: 12px; }
.task.can-plan { grid-template-columns: auto auto minmax(0, 1fr) auto; padding-left: 0; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; cursor: grab; }
.grip { width: 22px; align-self: stretch; display: grid; place-items: center; color: var(--muted); opacity: .55; touch-action: none; }
.task.can-plan .task-body { cursor: inherit; }
.task-slot { grid-column: 1 / -1; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 2px -12px -6px 0; padding: 6px 14px; border-radius: 0 0 var(--r) var(--r); background: var(--zone-soft); color: var(--zone); font-size: 13px; font-variant-numeric: tabular-nums; }
.task-slot b { font-weight: 700; }
.task-slot.live { background: var(--accent-soft); color: var(--accent); }
.task-slot.guess { background: var(--warn-soft); color: var(--warn); }
.task-slot.late { background: var(--stop-soft); color: var(--stop); }
.task-slot.moved { animation: slot-moved 1.4s ease-out; }
@keyframes slot-moved { 0%, 40% { box-shadow: inset 0 0 0 2px currentColor; } 100% { box-shadow: inset 0 0 0 2px transparent; } }
.empty { background: var(--surface); border-radius: var(--r); padding: 26px 24px; box-shadow: var(--shadow); display: grid; gap: 12px; justify-items: start; }
.empty h2 { font: 700 22px/1.2 var(--font-display); margin: 0; }
.empty p { margin: 0; color: var(--muted); max-width: 52ch; }
.how-list { margin: 0 0 6px; padding-left: 22px; display: grid; gap: 6px; max-width: 52ch; }
.how-list li::marker { font-weight: 700; color: var(--accent); }
.loading { display: flex; align-items: center; gap: 10px; color: var(--muted); padding: 48px 0; }
.pulse { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); animation: pulse 1.2s ease-in-out infinite; flex: none; }
@keyframes pulse { 50% { opacity: .3; transform: scale(.7); } }

.fab {
  position: fixed; z-index: 20;
  right: max(calc(16px + env(safe-area-inset-right, 0px)), calc(50vw - 300px));
  bottom: calc(24px + var(--day-lift, 0px) + env(safe-area-inset-bottom, 0px));
  height: 56px; padding: 0 24px 0 18px; border-radius: 999px; border: none;
  background: var(--accent); color: var(--accent-ink);
  font-weight: 700; font-size: 16px;
  box-shadow: 0 8px 24px color-mix(in srgb, var(--accent) 35%, transparent);
  display: flex; align-items: center; gap: 8px; transition: transform .15s;
}
.fab:hover { transform: scale(1.04); }
body.has-mini .fab { bottom: calc(96px + var(--day-lift, 0px) + env(safe-area-inset-bottom, 0px)); }

/* The day's timeline: a thin strip in a panel of its own, over the bottom of the window */
.day { position: fixed; z-index: 21; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); width: min(1040px, calc(100vw - 24px)); padding: 7px 12px 10px; background: var(--surface); border-radius: 16px; box-shadow: 0 0 0 1px var(--line), 0 8px 28px rgba(20, 24, 28, .16); }
body.has-mini .day { bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
.day.shut { left: max(16px, calc(50vw - 300px)); transform: none; width: auto; padding: 0; background: none; box-shadow: none; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
body.has-mini .day.shut { bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
.day-pill { display: flex; align-items: center; gap: 8px; max-width: min(240px, calc(100vw - 180px)); height: 44px; padding: 0 16px 0 12px; border: none; border-radius: 999px; background: var(--surface); color: var(--ink); font-weight: 700; font-size: 14px; box-shadow: 0 0 0 1px var(--line), 0 6px 20px rgba(20, 24, 28, .12); }
.day-pill span { font-weight: 500; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.day-pill span.over { color: var(--stop); font-weight: 600; }
.day-head { display: flex; align-items: center; gap: 10px; min-height: 30px; flex-wrap: wrap; }
.day-head h2 { font: 700 16px/1 var(--font-display); margin: 0; }
.day-sum { flex: 1; min-width: 0; margin: 0; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.day-sum b { color: var(--stop); font-weight: 600; }
.day-tools { display: flex; align-items: center; gap: 12px; }
.day-tools .btn { padding: 4px 10px; font-size: 13px; cursor: grab; touch-action: none; }
.day-tools .link { padding: 4px 0; font-size: 13px; }
.day-tools .link:disabled { color: var(--muted); }
.day-filter { display: inline-flex; align-items: center; gap: 2px; font-size: 13px; color: var(--muted); }
.day-filter > span { margin-right: 4px; }
.day-filter button { border: 1px solid var(--line); background: none; padding: 3px 9px; font-size: 13px; font-weight: 600; color: var(--muted); }
.day-filter button:first-of-type { border-radius: 999px 0 0 999px; }
.day-filter button:last-of-type { border-radius: 0 999px 999px 0; margin-left: -1px; }
.day-filter button.on { position: relative; background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.day-toggle { width: 30px; height: 30px; }
.day-grip { position: absolute; top: 0; left: 50%; width: 72px; height: 12px; margin-left: -36px; padding: 0; border: none; background: none; cursor: ns-resize; touch-action: none; }
.day-grip::after { content: ""; position: absolute; top: 4px; left: 18px; right: 18px; height: 4px; border-radius: 2px; background: var(--line); transition: background .15s; }
.day-grip:hover::after, .day-grip:focus-visible::after { background: var(--accent); }
.rail-scroll { height: min(var(--rail-h, 60px), calc(100vh - 220px)); margin-top: 4px; overflow-x: auto; overflow-y: hidden; overscroll-behavior-x: contain; scrollbar-width: thin; touch-action: pan-x; }
.rail { position: relative; isolation: isolate; height: 100%; overflow: hidden; cursor: crosshair; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.tick { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--line); }
.tick span { position: absolute; left: 3px; top: 1px; font: 500 10px/1 var(--font-mono); color: var(--muted); white-space: nowrap; }
.win { position: absolute; top: 15px; bottom: 0; background: var(--zone-soft); border-radius: 6px; }
.win-edge { position: absolute; top: 0; bottom: 0; width: 14px; padding: 0; border: none; background: none; cursor: ew-resize; touch-action: none; z-index: 4; }
.win-edge.opens { left: -7px; }
.win-edge.closes { right: -7px; }
.win-edge::after { content: ""; position: absolute; top: 50%; left: 5px; width: 4px; height: 24px; margin-top: -12px; border-radius: 2px; background: var(--zone); opacity: .45; transition: opacity .15s; }
.win-edge:hover::after, .win-edge:focus-visible::after { opacity: 1; }
.spent { position: absolute; left: 0; top: 15px; bottom: 0; background: var(--surface); opacity: .6; z-index: 1; pointer-events: none; }
.now-line { position: absolute; top: 0; bottom: 0; border-left: 2px solid var(--stop); z-index: 3; pointer-events: none; }
.now-line span { position: absolute; left: -2px; top: 0; background: var(--stop); color: var(--surface); font: 600 10px/1 var(--font-mono); padding: 2px 3px; border-radius: 0 3px 3px 0; }
.rail-hint { position: absolute; top: 15px; bottom: 0; display: grid; place-items: center; color: var(--zone); font-size: 13px; font-weight: 600; pointer-events: none; z-index: 2; }
.tblock { position: absolute; top: 18px; bottom: 3px; display: flex; background: var(--surface); border-radius: 5px; box-shadow: 0 0 0 1px var(--line); overflow: hidden; cursor: grab; z-index: 2; touch-action: none; }
.tblock.cont { border-top-left-radius: 1px; border-bottom-left-radius: 1px; }
.tblock.cut { border-top-right-radius: 1px; border-bottom-right-radius: 1px; }
.tb-open { flex: 1; min-width: 0; display: grid; align-content: center; padding: 0 6px; border: none; background: none; color: inherit; text-align: left; font-size: 12px; line-height: 1.2; cursor: inherit; overflow: hidden; }
.tb-open b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-open span { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.tb-edge { position: absolute; top: 0; bottom: 0; right: 0; width: min(10px, 40%); padding: 0; border: none; background: none; cursor: ew-resize; touch-action: none; }
.tb-edge::after { content: ""; position: absolute; top: 50%; right: 2px; width: 3px; height: 16px; margin-top: -8px; border-radius: 2px; background: var(--muted); opacity: 0; transition: opacity .15s; }
.tblock:hover .tb-edge::after, .tb-edge:focus-visible::after, .tblock.lifted .tb-edge::after { opacity: .7; }
@media (pointer: coarse) { .tb-edge { width: min(18px, 40%); } .tb-edge::after { opacity: .7; } }
.tblock.live { background: var(--accent); color: var(--accent-ink); box-shadow: none; }
.tblock.live .tb-open span { color: inherit; opacity: .8; }
.tblock.late { background: var(--stop-soft); box-shadow: 0 0 0 1px var(--stop); }
.tblock.guess { box-shadow: none; outline: 1px dashed var(--muted); outline-offset: -1px; }
.tblock.brk { background: repeating-linear-gradient(135deg, var(--surface-2) 0 6px, var(--surface) 6px 12px); box-shadow: 0 0 0 1px var(--line); }
.tblock.brk.live { color: var(--ink); box-shadow: 0 0 0 1px var(--accent); }
.tblock.evt { background: var(--accent-soft); box-shadow: 0 0 0 1px var(--accent); cursor: pointer; }
.tblock.evt.done { opacity: .55; }
.tblock.ago { background: var(--surface-2); box-shadow: none; color: var(--muted); cursor: crosshair; }
.tblock.lifted, .tblock.picked { box-shadow: 0 0 0 2px var(--accent); z-index: 3; }
.tblock.dim { opacity: .35; }
.rail.for-breaks .tblock:not(.brk, .ago, .dim) { opacity: .6; cursor: crosshair; }
.marquee { position: absolute; top: 15px; bottom: 0; background: color-mix(in srgb, var(--accent) 16%, transparent); border-left: 1px solid var(--accent); border-right: 1px solid var(--accent); z-index: 3; pointer-events: none; }
.day-foot { margin: 6px 0 0; font-size: 12px; color: var(--muted); }
.day-menu { position: absolute; bottom: calc(100% + 8px); width: 300px; max-width: 100%; max-height: calc(100vh - 220px); overflow-y: auto; padding: 12px 14px; display: grid; gap: 8px; background: var(--surface); border-radius: 14px; box-shadow: 0 0 0 1px var(--line), 0 10px 32px rgba(20, 24, 28, .24); }
.dm-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.dm-head b { font-size: 15px; overflow-wrap: anywhere; }
.dm-head .icon-btn { width: 28px; height: 28px; margin: -4px -6px -4px 0; }
.dm-sub { margin: -6px 0 0; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.dm-label { margin: 2px 0 -2px; font-size: 12px; font-weight: 700; color: var(--muted); }
.dm-row { display: flex; flex-wrap: wrap; gap: 6px; }
.dm-row .btn { padding: 6px 12px; font-size: 13px; }
.dm-chip { min-width: 40px; padding: 5px 9px; border: 1px solid var(--line); border-radius: 8px; background: none; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.dm-chip:hover { border-color: var(--accent); color: var(--accent); }
.dm-chip.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.dm-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.dm-list button { width: 100%; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; background: none; text-align: left; font-size: 13px; font-weight: 600; }
.dm-list button:hover { border-color: var(--accent); }
.dm-list span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dm-list small { flex: none; font-size: 12px; font-weight: 500; color: var(--muted); }
.drag-ghost { position: fixed; left: 0; top: 0; z-index: 70; max-width: 240px; padding: 6px 12px; border-radius: 10px; background: var(--ink); color: var(--bg); font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; box-shadow: 0 8px 28px rgba(0, 0, 0, .25); pointer-events: none; }
body.dragging { cursor: grabbing; user-select: none; -webkit-user-select: none; }
body.dragging .tblock, body.dragging .task, body.dragging .rail { cursor: grabbing; }
.hours-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; flex-wrap: wrap; }
.hours-row .text-input { width: auto; }
@media (max-width: 760px) {
  .day-tools { order: 3; flex-basis: 100%; flex-wrap: wrap; justify-content: space-between; gap: 4px 8px; }
  .day-toggle { order: 2; }
  .day-filter > span { display: none; }
  .day-menu { left: 0 !important; right: 0; width: auto; }
}
@media (hover: none) {
  .win-edge::after { opacity: 1; }
}

/* Bar at the bottom while you're working or on a break */
.mini { position: fixed; left: 0; right: 0; bottom: 0; z-index: 19; padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.mini-in { max-width: 600px; margin: 0 auto; display: flex; align-items: center; gap: 12px; background: var(--ink); color: var(--bg); border-radius: 18px; padding: 10px 10px 10px 16px; box-shadow: 0 8px 28px rgba(0, 0, 0, .25); }
.mini-dot { color: var(--zone); }
.mini-dot.still { animation: none; color: var(--warn); }
.mini-title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; font-size: 14px; }
.mini-time { font: 500 14px var(--font-mono); font-variant-numeric: tabular-nums; }
.mini .btn { background: var(--bg); color: var(--ink); }
.mini.over .mini-in { background: var(--stop); color: var(--surface); }
.mini.over .mini-dot { color: var(--surface); }
.pip { margin: 0; height: 100vh; box-sizing: border-box; padding: 10px 12px; display: flex; flex-direction: column; justify-content: center; gap: 6px; overflow: hidden; background: var(--surface); color: var(--ink); }
.pip-top, .pip-row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.pip-time { flex: 1; font: 500 24px var(--font-mono); font-variant-numeric: tabular-nums; }

const state = {

const byDue = (a, b) => (a.due || '9999').localeCompare(b.due || '9999') || a.createdAt - b.createdAt;

const findStep = (tid, sid) => state.tasks.get(tid)?.steps.find(s => s.id === sid);
const elapsedSec = (a, now = Date.now()) => (a.carry || 0) + ((a.pausedAt || now) - a.startedAt - (a.pausedMs || 0)) / 1000;

const targetSec = (a, st) => a.target ?? (st && st.est ? st.est * 60 : null);

const OVER_ALERTS = [0, 5, 10, 20]; // minutes past the end of a step, or of the pause between steps
const BREAK_ALERTS = [0, 2, 5, 10]; // minutes past the end of a break
const AUTO_STOP_MIN = 30; // a step's timer stops this long past its end if nobody answers
const AWAY_MIN = 10; // a jump this long in the clock means Paced was closed or the device slept
const SNOOZE_MIN = 10; // how long "Not now" holds off a break
const BREAK_GIVE_UP_MIN = 60; // a break this far past its end counts as over
const IDLE_MIN = 5; // minutes without using the computer before a step pauses, unless you change it in Settings
const IDLE_RESUME_MIN = 60; // idle for longer than this and you've moved on, so the step stays paused
const CHECK_MIN = 15; // minutes between "Still working?" notifications, unless you change it in Settings
const CHECK_WAIT_MIN = 3; // how long a "Still working?" notification waits for an answer

function dueInfo(t) {
  if (!t.due) return null;
  const today = dateKey();
  if (!t.archived && t.due < today) return { text: `Overdue (was due ${fmtDayShort(t.due)})`, cls: 'late' };
  if (t.due === today) return { text: 'Due today', cls: 'soon' };
  if (t.due === addDays(today, 1)) return { text: 'Due tomorrow', cls: 'soon' };

}

/* Your real speed: how much longer your timed steps usually take than your guesses (1.2 = 20% longer).

let speedCache = null;

  samples.sort((a, b) => a[0] - b[0]);

// The step to do next: the first one left, passing over any you skipped this session.

const tightTask = () => activeTasks().find(t => t.due && t.due <= addDays(dateKey(), 1) && stepsLeft(t).length) || null;
// Another task to switch to instead of taking a full break. What's on today's timeline comes first.
const switchTarget = currentId => nextPlanned(currentId)?.task || activeTasks().find(t => t.id !== currentId && stepsLeft(t).length) || null;

/* Ways of working you can try. "work" is minutes of work before a break (or, for task rotation, a switch). */
const METHODS = [
  { id: 'paced', name: 'Break when you slow down', short: 'No set times. Paced tells you when your speed drops', work: null, brk: null },
  { id: 'pomodoro', name: 'Pomodoro', short: '25 min of work, then a 5-minute break. Every fourth break is 15 minutes', work: 25, brk: 5 },
  { id: 'long', name: 'Long focus', short: '50 min of work, then a 10-minute break', work: 50, brk: 10 },
  { id: 'rotate', name: 'Switch tasks', short: 'Every 25 min, change to another task instead of taking a break', work: 25, brk: 5 }

const methodById = id => METHODS.find(x => x.id === id) || METHODS[0];
const methodOf = s => methodById(s && s.method);

const sinceMark = (as, s) => Math.max(0, as.workMin - ((s && s.markAt) || 0));

function recordSession(s, now = Date.now()) {
  const steps = s.log.filter(l => l.est && l.actual >= 60);

    workMin: Math.round(assess(m, now).workMin - (s.priorMin || 0)),

/* Look and feel: accent color and light/dark, saved with your account. [light accent, text on it, soft tint] / same for dark. */

  teal: { name: 'Teal', light: ['#0D7373', '#FFFFFF', '#D8EFEE'], dark: ['#5FD0CC', '#052625', '#133433'] },

  pink: { name: 'Pink', light: ['#B5356F', '#FFFFFF', '#F8E1EC'], dark: ['#F28DB9', '#33101F', '#3A1C2B'] },
  orange: { name: 'Orange', light: ['#AD4E0C', '#FFFFFF', '#FBE7D6'], dark: ['#F4A261', '#2E1606', '#3A2514'] },

    .replace('aria-hidden="true">', `><style>path{fill:${c.light[0]}}@media (prefers-color-scheme:dark){path{fill:${c.dark[0]}}}</style>`);

/* ---------- storage: your account when available, this browser otherwise ---------- */
const Store = {
  mode: 'loading', col: null, unsub: null, queue: new Map(), localTimer: null,

  async init() {
    if (window.PACED_FIREBASE_CONFIG && await Account.init()) return;
    let db = null, user = null, uid = null;
    if (window.claude && typeof window.claude.use === 'function') {
      try { [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]); } catch (e) {}
      if (user) { try { uid = await user.id(); } catch (e) {} }
    }
    if (db && uid) {
      this.col = db.collection('data/users/' + uid);
      await this.connect();
      return;
    }
    this.mode = 'local';
    this.loadLocal();
  },

  // Follow the saved data in this.col, and wait for the first delivery.
  async connect() {
    this.connecting = true;
    try {
      this.mode = 'cloud';
      await new Promise(resolve => {
        let first = true;
        const done = () => { if (first) { first = false; resolve(); } };
        const timer = setTimeout(() => { if (first) { this.toLocal('Your account storage didn’t answer, so tasks are saved in this browser for now.', true); done(); } }, 15000);
        this.unsub = this.col.onSnapshot(snap => {
          if (this.mode !== 'cloud') return;
          this.applyDocs(snap.docs.filter(d => d.exists).map(d => [d.id, d.data()]));
          clearTimeout(timer);
          if (first) done(); else { clearStale(); render(); }
        }, () => { clearTimeout(timer); this.toLocal('Lost the connection to your account, so changes are saved in this browser for now.', first); done(); });
      });
    } catch (e) { this.toLocal(null, true); }
    this.connecting = false;
  },

  applyDocs(docs) {
    const tasks = new Map(), events = new Map(), records = new Map(); let meta = null;
    for (const [id, d] of docs) {
      if (id === 'meta') meta = d;
      else if (id.startsWith('t_')) tasks.set(id, normTask(id, d));
      else if (id.startsWith('e_')) events.set(id, clone(d));
      else if (id.startsWith('r_')) records.set(id, clone(d));
    }
    this.hadMeta = !!meta;
    // Docs with a write still on its way keep their local version.
    for (const id of this.queue.keys()) {
      if (id === 'meta') { meta = state.meta; continue; }
      if (id.startsWith('r_')) { const r = state.records.get(id); if (r) records.set(id, r); else records.delete(id); continue; }
      const loc = state.tasks.get(id);
      if (loc) tasks.set(id, loc); else tasks.delete(id);
    }
    state.tasks = tasks;
    state.events = events;
    state.records = records;
    state.meta = normMeta(meta);
    speedCache = null;
  },

  write(id, data) {
    if (this.mode !== 'cloud') { clearTimeout(this.localTimer); this.localTimer = setTimeout(() => this.saveLocal(), 60); return; }
    let q = this.queue.get(id);
    if (!q) { q = { busy: false, next: null }; this.queue.set(id, q); }
    q.next = data === null ? { del: true } : { data: clone(data) };
    if (!q.busy) this.flush(id, q);
  },

  async flush(id, q) {
    q.busy = true;
    while (q.next && this.mode === 'cloud') {
      const job = q.next; q.next = null;
      try {
        const ref = this.col.doc(id);
        if (job.del) await ref.delete(); else await ref.set(job.data);
      } catch (e) {
        const code = e && e.code;
        if (code === 'unavailable' && !job.retried) { job.retried = true; await sleep(400 + Math.random() * 600); if (!q.next) q.next = job; continue; }
        if (code === 'quota_exceeded') toast('Your storage is full. Delete some completed tasks to make room.');
        else if (['invalid_argument', 'not_granted', 'revoked', 'capability_disabled', 'capability_removed', 'transform_error'].includes(code)) { this.toLocal('Couldn’t save to your account, so changes are saved in this browser for now.'); break; }
        else toast('Couldn’t save that change. Check your connection and try again.');
      }
    }
    q.busy = false;
    if (this.queue.get(id) === q && !q.next) this.queue.delete(id);
  },

  toLocal(msg, quiet) {
    if (this.mode === 'local') return;
    this.mode = 'local';
    try { this.unsub && this.unsub(); } catch (e) {}
    this.queue.clear();
    if (state.ready && !this.connecting) this.saveLocal(); else this.loadLocal();
    if (msg) setTimeout(() => toast(msg), quiet ? 400 : 0);
    if (state.ready) render();
  },

  loadLocal() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return;
      const d = JSON.parse(raw);
      state.tasks = new Map((d.tasks || []).filter(t => t && t.id).map(t => [t.id, normTask(t.id, t)]));
      state.events = new Map((d.events || []).filter(e => e && e.id).map(e => [e.id, e]));
      state.records = new Map((d.records || []).filter(r => r && r.id).map(r => [r.id, r]));
      state.meta = normMeta(d.meta);
      speedCache = null;
    } catch (e) {}
  },

  saveLocal() {
    if (this.mode !== 'local') return;
    try { localStorage.setItem(KEY, JSON.stringify({ tasks: [...state.tasks.values()], events: [...state.events.values()], records: [...state.records.values()], meta: state.meta })); } catch (e) {}
  }
};
window.addEventListener('pagehide', () => { if (Store.mode === 'local') Store.saveLocal(); });

/* ---------- accounts (website only): sign-in and saving through Firebase ----------
   Firebase keeps you signed in on each browser until you sign out. */
const FIREBASE_SDK = 'https://www.gstatic.com/firebasejs/10.14.1';
const GUEST_KEY = 'paced:guest';
const Account = {
  fb: null, auth: null, db: null, user: null,

  async init() {
    try {
      const [app, auth, fs] = await Promise.all(['app', 'auth', 'firestore'].map(n => import(`${FIREBASE_SDK}/firebase-${n}.js`)));
      const fbApp = app.initializeApp(window.PACED_FIREBASE_CONFIG);
      this.fb = { ...auth, ...fs };
      this.auth = auth.getAuth(fbApp);
      this.db = fs.getFirestore(fbApp);
    } catch (e) { this.fb = null; return false; } // can't reach Firebase: fall back to this browser
    const user = await new Promise(resolve => { const off = this.fb.onAuthStateChanged(this.auth, u => { off(); resolve(u); }); });
    if (user) { await this.enter(user); return true; }
    let guest = false;
    try { guest = !!localStorage.getItem(GUEST_KEY); } catch (e) {}
    if (guest) { Store.mode = 'local'; Store.loadLocal(); } else Store.mode = 'signin';
    return true;
  },

  // Each person's tasks live at users/<their id>/docs, which the privacy rules keep to them alone.
  async enter(user) {
    this.user = user;
    const { collection, doc, setDoc, deleteDoc, onSnapshot } = this.fb;
    const col = collection(this.db, 'users', user.uid, 'docs');
    Store.col = {
      doc: id => ({ set: d => setDoc(doc(col, id), d), delete: () => deleteDoc(doc(col, id)) }),
      onSnapshot: (next, err) => onSnapshot(col, snap => {
        if (snap.empty && snap.metadata.fromCache) return; // offline: an empty list here isn't the real answer
        next({ docs: snap.docs.map(d => ({ id: d.id, exists: true, data: () => d.data() })) });
      }, err)
    };
    await Store.connect();
    if (Store.mode === 'cloud') this.moveLocalTasks();
  },

  // Tasks made in this browser before signing in move into the account, so nothing is left behind.
  moveLocalTasks() {
    let d = null;
    try { d = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
    if (!d) return;
    let moved = 0;
    for (const t of d.tasks || []) if (t && t.id && !state.tasks.has(t.id)) { saveTask(normTask(t.id, t)); moved++; }
    for (const e of d.events || []) if (e && e.id && !state.events.has(e.id)) { state.events.set(e.id, e); Store.write(e.id, e); }
    for (const r of d.records || []) if (r && r.id && !state.records.has(r.id)) saveRecord(r);
    if (d.meta && !Store.hadMeta) { state.meta = normMeta(d.meta); saveMeta(); }
    try { localStorage.removeItem(KEY); localStorage.removeItem(GUEST_KEY); } catch (e) {}
    if (moved) setTimeout(() => toast(`Moved ${moved} ${moved === 1 ? 'task' : 'tasks'} from this browser into your account.`), 400);
  },

  async submit(mode, email, password) {
    const f = this.fb, go = mode === 'signup' ? f.createUserWithEmailAndPassword : f.signInWithEmailAndPassword;
    const cred = await go(this.auth, email, password);
    await this.enter(cred.user);
  },

  resetPassword(email) { return this.fb.sendPasswordResetEmail(this.auth, email); },

  clearScreen() {
    state.tasks = new Map(); state.events = new Map(); state.records = new Map(); state.meta = defaultMeta(); speedCache = null;
    state.view = 'home'; state.layer = null; state.focusOpen = false; state.ask = null; state.fEdit = false;
    state.gt = null; Google.forget(); // the next person on this browser shouldn't get your Google tasks
  },

  async signOut() {
    for (let i = 0; i < 30 && Store.queue.size; i++) await sleep(100); // let saves finish first
    try { Store.unsub && Store.unsub(); } catch (e) {}
    await this.fb.signOut(this.auth);
    this.user = null; Store.col = null; Store.unsub = null; Store.queue.clear();
    Store.mode = 'signin';
    state.auth = { mode: 'signin', email: '' };
    this.clearScreen();
  },

  continueAsGuest() {
    try { localStorage.setItem(GUEST_KEY, '1'); } catch (e) {}
    Store.mode = 'local';
    Store.loadLocal();
  },

  showSignIn() {
    Store.saveLocal();
    Store.mode = 'signin';
    this.clearScreen();
  }
};

function authError(e) {
  return {
    'auth/invalid-credential': 'That email or password isn’t right.',
    'auth/wrong-password': 'That email or password isn’t right.',
    'auth/user-not-found': 'That email or password isn’t right.',
    'auth/email-already-in-use': 'There’s already an account with that email. Try signing in instead.',
    'auth/weak-password': 'Use a password with at least 6 characters.',
    'auth/invalid-email': 'That doesn’t look like an email address.',
    'auth/too-many-requests': 'Too many tries. Wait a few minutes, then try again.',
    'auth/network-request-failed': 'Couldn’t reach the sign-in service. Check your connection and try again.',
    'auth/operation-not-allowed': 'Email sign-in isn’t turned on yet.'
  }[e && e.code] || 'Something went wrong. Please try again.';
}

function saveTask(t) { state.tasks.set(t.id, t); speedCache = null; Store.write(t.id, t); }
function removeTask(id) { state.tasks.delete(id); speedCache = null; Store.write(id, null); }
function saveMeta() { Store.write('meta', state.meta); }

function clearStale() {
  dropFinishedStep();
  expireIdleSession();
}
// A step can be finished in another tab or on another device while this one still thinks it's running.
function dropFinishedStep() {
  const s = state.meta.session, a = s && s.active;
  if (!a) return;
  const t = state.tasks.get(a.taskId), st = findStep(a.taskId, a.stepId);
  if (st && !st.done && !t.archived) return;
  s.active = null; state.ask = null;
  saveMeta(); render();
}
// A session with no step running and nothing done for 30 minutes counts as stopped, so yesterday's
// hours don't carry into today. Left alone while you're looking at the working screen, unless forced.
// A break nobody came back from closes the same way.
function expireIdleSession(force) {
  const m = state.meta, s = m.session, now = Date.now();
  if (m.brk && now - m.brk.until >= BREAK_GIVE_UP_MIN * 60e3) {
    logSlip('break', BREAK_GIVE_UP_MIN * 60);
    logEvent('break', { at: m.brk.startedAt, end: m.brk.until, min: m.brk.min });
    m.lastBreakEnd = m.brk.until + BREAK_GIVE_UP_MIN * 60e3;
    m.brk = null;
    endRun();
    saveMeta();
    return true;
  }
  // Steps ticked off with no timer running make a record too, once they've stopped coming.
  if (m.run && !s && !m.brk && now - runEnd(m.run.events) >= 30 * 60e3) { endRun(); saveMeta(); return true; }
  if (!s || s.active || m.brk || (state.focusOpen && !force)) return false;
  const last = s.lastAt || s.startedAt || 0;
  if (now - last < 30 * 60e3) return false;
  closeGap(s, last + 30 * 60e3);
  m.lastStop = { at: last, workMin: Math.round(assess(m, last).workMin) };
  recordSession(s, last);
  m.session = null;
  endRun();
  if (state.ask && state.ask.type !== 'history') state.ask = null;
  saveMeta();
  return true;
}
function clearActiveIf(pred) {
  const s = state.meta.session;
  if (s && s.active && pred(s.active)) { s.active = null; state.ask = null; openGap(s); saveMeta(); }
}

/* ---------- speed model ----------
   pace = planned minutes / real minutes for a step (1.0 = exactly as planned).
   Starting speed = average pace of the first two steps after a break,
   or the median of past fresh starts when you began already tired.
   Efficiency = average pace of your last two steps / starting speed. Under 90% means it's break time. */
function assess(meta, now = Date.now()) {
  const s = meta.session || { log: [], priorMin: 0 };
  const counted = s.log.filter(l => l.pace != null && !l.excluded);
  const fresh = meta.fresh || [];
  let base = null;
  if (counted.length >= 2 && !(s.priorMin >= 30 && fresh.length >= 2)) base = (counted[0].pace + counted[1].pace) / 2;
  else if (fresh.length >= 2) base = median(fresh);
  let eff = null, from = null;
  if (base && counted.length) {
    const recent = counted.slice(-2);
    eff = recent.reduce((x, l) => x + l.pace, 0) / recent.length / base * 100;
    from = 'pace';
  }
  const paceReady = from === 'pace';
  const last = s.log[s.log.length - 1];
  const hard = !!(last && last.feel === 'struggling');
  if (hard) { eff = eff == null ? 82 : Math.min(eff, 85); from = from || 'feel'; }
  else if (eff == null && last && last.feel) { eff = last.feel === 'focused' ? 100 : 94; from = 'feel'; }
  if (eff != null) eff = Math.round(clamp(eff, 40, 130));

  const workSec = (s.priorMin || 0) * 60 + (s.partialSec || 0)
    + s.log.reduce((x, l) => x + (l.worked ?? l.actual ?? 0), 0)
    + (s.active ? elapsedSec(s.active, now) - (s.active.carry || 0) : 0);
  const workMin = workSec / 60;
  const slipping = counted.length >= 3 && counted[counted.length - 1].pace < counted[counted.length - 2].pace;
  const breakMin = clamp(Math.round(workMin * 0.2 / 5) * 5, 5, 20);

  let kind, why;
  if (eff != null && eff < 90 && (counted.length >= 2 || hard))
    [kind, why] = ['now', from === 'pace' ? `You’ve slowed down to ${eff}% of your starting speed.` : 'You said that step was hard.'];
  else if (workMin >= 90) [kind, why] = ['now', `You’ve been working for ${fmtMin(workMin)} without a break.`];
  else if (eff != null && eff < 95 && slipping) [kind, why] = ['soon', `You’re starting to slow down (${eff}% of your starting speed).`];
  else if (workMin >= 60) [kind, why] = ['soon', `You’ve been working for ${fmtMin(workMin)}.`];
  else if (eff == null) [kind, why] = ['learning', counted.length ? 'Finish one more step and Paced will start tracking how fast you’re going.' : 'Finish two steps and Paced will start tracking how fast you’re going.'];
  else if (from === 'feel') [kind, why] = ['go', 'Based on how you said that step went.'];
  else if (eff > 100) [kind, why] = ['go', `You’re working faster than when you started (${eff}%).`];
  else [kind, why] = ['go', `You’re working at ${eff}% of your starting speed. That’s right where you want to be.`];
  const title = { now: 'Time for a break', soon: 'Take a break soon', learning: 'Getting to know your speed', go: 'Keep going' }[kind];

  return { eff, from, paceReady, counted, workMin, breakMin, kind, title, why, steps: s.log.length };
}

/* ---------- the day's timeline ----------
   A day has stretches of time you can work (windows, in minutes after midnight) and a plan (items).
   Tasks have no fixed slot. They flow through the free time in order, never sooner than where you
   dropped them (item.at), so the plan moves whenever a task, your hours or the clock does.
   Breaks stay at the time you gave them and tasks flow around them. */
const DEFAULT_HOURS = [{ s: 9 * 60, e: 17 * 60 }];
const PLAN_SNAP = 5, HOURS_SNAP = 15; // minutes
const NO_EST_MIN = 15; // the room a step with no minutes takes up
const NO_STEPS_MIN = 30; // the room a task with no steps takes up
const PLAN_BREAK_MIN = 15; // the length of a break dragged onto the timeline
const BREAK_NEAR_MIN = 30; // a break you take this soon before a planned one counts as that one
const PLAN_ALERT_MIN = 15; // how late Paced will still tell you it's time to start
const MIN_PIECE = 15; // a task won't start in a slot shorter than this if it has to carry on later

const minuteNow = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60; };
const snapTo = (min, by) => Math.round(min / by) * by;
const clockAt = min => { const d = new Date(); d.setHours(0, Math.round(min), 0, 0); return fmtTime(+d); };
const hourName = h => { const d = new Date(); d.setHours(h, 0, 0, 0); return d.toLocaleTimeString([], { hour: 'numeric' }); };
const usualHours = () => state.meta.hours?.length ? state.meta.hours : DEFAULT_HOURS;
// Today's plan. A new day starts empty, with your usual hours.
function dayPlan() {
  const p = state.meta.plan;
  return p && p.date === dateKey() ? p : { date: dateKey(), windows: clone(usualHours()), items: [] };
}
function savePlan(p) { state.meta.plan = p; saveMeta(); }
// Windows in order, with any that touch joined and any with no length dropped.
function cleanWindows(list) {
  const out = [];
  for (const w of [...list].filter(w => w.e > w.s).sort((a, b) => a.s - b.s)) {
    const last = out[out.length - 1];
    if (last && w.s <= last.e) last.e = Math.max(last.e, w.e); else out.push({ ...w });
  }
  return out;
}
const sameHours = (a, b) => JSON.stringify(a) === JSON.stringify(b);

// The room a task takes: what's left of it, at the speed you really work rather than the speed you guess.
function taskRoom(t) {
  if (!t.steps.length) return { min: NO_STEPS_MIN, guess: true };
  const a = state.meta.session?.active, f = timeFactor();
  let min = 0, guess = false;
  for (const st of stepsLeft(t)) {
    if (a && a.stepId === st.id) { const el = elapsedSec(a); min += Math.max(0, (targetSec(a, st) ?? el) - el) / 60; }
    else if (st.est) min += Math.max(1, st.est * f - (st.spent || 0) / 60);
    else { min += NO_EST_MIN; guess = true; }
  }
  return { min: Math.max(1, Math.ceil(min)), guess };
}
// The room a task takes on the timeline, with any time you dragged on or off it. What's running goes by its timer.
function planRoom(item, t) {
  const room = taskRoom(t);
  return item.front ? room : { ...room, min: Math.max(PLAN_SNAP, room.min + (item.extra || 0)) };
}
const withExtra = (item, extra) => { const { extra: old, ...rest } = item; return extra ? { ...rest, extra } : rest; };
// A plan with this task taking up this many minutes today. Its steps and timers stay as they are.
const sizedPlan = (p, id, min) => ({ ...p, items: p.items.map(i => i.id === id ? withExtra(i, min - taskRoom(state.tasks.get(i.taskId)).min) : i) });
const onPlan = t => !!t && !t.archived && (!t.steps.length || stepsLeft(t).length > 0);

// Where everything lands right now. Blocks are the tasks, each in one or more pieces; stops are the breaks.
function layoutDay(p = dayPlan(), now = minuteNow()) {
  const m = state.meta, s = m.session;
  const stops = [];
  let cur = now;
  if (m.brk) { cur = now + Math.max(0, (m.brk.until - Date.now()) / 60e3); stops.push({ s: now, e: cur, live: true }); }
  // A break whose time has come waits at "now" until you take it or an hour has gone by.
  const breaks = p.items.filter(i => i.brk && i.at + i.brk + BREAK_GIVE_UP_MIN > now).sort((a, b) => a.at - b.at);
  const events = todayEvents();
  for (const item of breaks) {
    let start = Math.max(item.at, cur);
    for (const ev of events) if (ev.s < start + item.brk && ev.e > start) start = ev.e; // your calendar can't move, so the break waits
    stops.push({ item, s: start, e: start + item.brk });
    cur = start + item.brk;
  }
  stops.push(...events.map(ev => ({ ev, s: ev.s, e: ev.e })));
  stops.sort((a, b) => a.s - b.s);
  // If you're timing a step during an event, you're doing that instead, so the event doesn't push it along.
  const busy = stops.filter(b => !(b.ev && s?.active && b.s <= now && b.e > now));
  const free = [];
  for (const w of p.windows) {
    let from = w.s;
    for (const b of busy) {
      if (b.e <= from || b.s >= w.e) continue;
      if (b.s > from) free.push({ s: from, e: b.s });
      from = Math.max(from, b.e);
    }
    if (from < w.e) free.push({ s: from, e: w.e });
  }
  // What's happening right now goes first, planned or not.
  const liveId = m.brk ? m.brk.taskId : s && (s.active ? s.active.taskId : s.taskId);
  const tasks = p.items.filter(i => i.taskId && onPlan(state.tasks.get(i.taskId)) && i.taskId !== liveId);
  if (liveId && onPlan(state.tasks.get(liveId))) tasks.unshift({ ...(p.items.find(i => i.taskId === liveId) || { id: 'live', taskId: liveId }), at: null, front: true, live: !!s?.active });
  const blocks = [];
  let at = now;
  for (const item of tasks) {
    const t = state.tasks.get(item.taskId), { min, guess } = planRoom(item, t), pieces = [];
    if (item.at != null) at = Math.max(at, item.at);
    let need = min;
    while (need > 0) {
      const w = free.find(f => f.e > at);
      if (!w) {
        // Past the end of your hours there's nothing left but breaks to work around.
        const stop = busy.find(b => b.e > at && b.s < at + need);
        if (stop && stop.s <= at) { at = stop.e; continue; }
        const len = stop ? stop.s - at : need;
        pieces.push({ s: at, e: at + len, late: true });
        at += len;
        need -= len;
        continue;
      }
      const start = Math.max(at, w.s), len = Math.min(need, w.e - start);
      if (len < need && len < MIN_PIECE && !item.front) { at = w.e; continue; } // too short to be worth starting
      pieces.push({ s: start, e: start + len });
      at = start + len;
      need -= len;
    }
    blocks.push({ item, task: t, min, guess, pieces, start: pieces[0].s, end: at });
  }
  const sum = (list, f) => list.reduce((a, x) => a + f(x), 0);
  return {
    blocks, stops,
    freeMin: sum(free, f => Math.max(0, f.e - Math.max(f.s, now))),
    planMin: sum(blocks, b => b.min),
    lateMin: sum(blocks, b => sum(b.pieces, x => x.late ? x.e - x.s : 0))
  };
}

// The first task on the timeline after this one, and whether its time has come.
function nextPlanned(exceptId) {
  const b = layoutDay().blocks.find(x => x.task.id !== exceptId && stepsLeft(x.task).length);
  return b ? { task: b.task, waits: b.item.at != null && b.item.at > minuteNow() + PLAN_SNAP } : null;
}
const dueBreak = (now = minuteNow()) => dayPlan().items.find(i => i.brk && i.at <= now && i.at + i.brk + BREAK_GIVE_UP_MIN > now) || null;
const plannedBreakSoon = () => dayPlan().items.some(i => i.brk && i.at > minuteNow() && i.at <= minuteNow() + BREAK_NEAR_MIN);
// Taking a break uses up the planned one it stands in for, and keeps that one's length.
function usePlannedBreak(min) {
  const p = dayPlan(), i = p.items.findIndex(x => x.brk && x.at <= minuteNow() + BREAK_NEAR_MIN);
  if (i < 0) return min;
  const [used] = p.items.splice(i, 1);
  state.meta.plan = p;
  return used.brk;
}

// Where an item lands when dropped at a time: inside a block it goes before or after it, in free time it stays there.
function placeItem(p, item, time) {
  const rest = p.items.filter(i => i.id !== item.id), now = minuteNow();
  time = snapTo(time, PLAN_SNAP);
  if (item.brk) return { ...p, items: [...rest, { ...item, at: Math.max(time, Math.ceil(now / PLAN_SNAP) * PLAN_SNAP) }] };
  const blocks = layoutDay({ ...p, items: rest }, now).blocks;
  let i = 0;
  while (i < blocks.length && (blocks[i].item.front || time >= (blocks[i].start + blocks[i].end) / 2)) i++;
  const before = i ? blocks[i - 1].end : now, after = blocks[i] ? blocks[i].start : Infinity;
  const at = Math.min(time, after);
  const placed = { ...item, at: at > before ? at : null };
  const anchor = blocks[i] && rest.indexOf(blocks[i].item);
  const items = [...rest];
  items.splice(anchor != null && anchor >= 0 ? anchor : items.length, 0, placed);
  return { ...p, items };
}

/* ---------- main screen ---------- */
function render() {
  applyLook();
  renderMain();
  renderMini();
  renderFocus();
  renderDay();
  showPip();
  const fab = $('#fab');
  fab.hidden = !state.ready || Store.mode === 'signin' || state.view !== 'home' || !activeTasks().length;
  fab.innerHTML = ICON.plus + 'New task';
}

function renderMain() {
  const main = $('#main');
  if (!state.ready) { main.innerHTML = '<div class="loading"><span class="pulse"></span>Loading your tasks…</div>'; return; }
  if (Store.mode === 'signin') { main.innerHTML = authHTML(); return; }
  main.innerHTML = state.view === 'archive' ? archiveHTML() : state.view === 'history' ? historyPageHTML() : homeHTML();
}

function authHTML() {
  const a = state.auth, up = a.mode === 'signup';
  return `<div class="brand-row"><div class="brand">${ICON.mark}Paced</div></div>
  <h1>${up ? 'Create your account' : 'Sign in'}</h1>
  <p class="sub">See your tasks on any computer or phone.</p>
  <form class="panel auth-form" id="auth-form">
    <label class="label" for="auth-email">Email</label>
    <input id="auth-email" class="text-input" type="email" autocomplete="username" required value="${esc(a.email)}">
    <label class="label" for="auth-password">Password</label>
    <input id="auth-password" class="text-input" type="password" autocomplete="${up ? 'new-password' : 'current-password'}" required>
    ${up ? '<p class="help" style="margin:4px 0 0">Use at least 6 characters.</p>' : ''}
    <p class="err" id="auth-err" hidden></p>
    <p class="ok-note" id="auth-note" hidden></p>
    <button type="submit" class="btn primary big" id="auth-go">${up ? 'Create account' : 'Sign in'}</button>
    ${up ? '' : '<button type="button" class="link small auth-forgot" data-act="auth-forgot">Forgot password?</button>'}
  </form>
  <div class="auth-foot">
    <p>${up ? 'Already have an account?' : 'New to Paced?'} <button class="link" data-act="auth-switch">${up ? 'Sign in' : 'Create an account'}</button></p>
    <p class="muted">You’ll stay signed in on this device until you sign out.</p>
    <button class="link small" data-act="auth-guest">Continue without an account</button>
  </div>`;
}
function authStatus(err, note) {
  const e = $('#auth-err'), n = $('#auth-note');
  if (e) { e.textContent = err || ''; e.hidden = !err; }
  if (n) { n.textContent = note || ''; n.hidden = !note; }
}
async function submitAuth() {
  const a = state.auth, btn = $('#auth-go');
  a.email = $('#auth-email').value.trim();
  const password = $('#auth-password').value;
  authStatus();
  btn.disabled = true; btn.textContent = a.mode === 'signup' ? 'Creating your account…' : 'Signing in…';
  try {
    await Account.submit(a.mode, a.email, password);
    clearStale(); render();
  } catch (e) {
    authStatus(authError(e));
    btn.disabled = false; btn.textContent = a.mode === 'signup' ? 'Create account' : 'Sign in';
  }
}

const savedLine = () => `<p class="saved">${Store.mode === 'cloud' ? 'Saved to your account' : 'Saved in this browser'}${Account.fb && !Account.user ? ' · <button class="link small" data-act="auth-show">Sign in to use it on other devices</button>' : ''}</p>`;

/* ---------- Google (website only): your tasks and your calendar ----------
   Paced only reads from Google. Each sign-in lasts about an hour and stays in memory, so it's never saved. */
const GOOGLE_SCRIPT = 'https://accounts.google.com/gsi/client';
const GOOGLE_TASKS_API = 'https://tasks.googleapis.com/tasks/v1';
const GOOGLE_CAL_API = 'https://www.googleapis.com/calendar/v3';
const TASKS_SCOPE = 'https://www.googleapis.com/auth/tasks.readonly';
const CAL_SCOPE = 'https://www.googleapis.com/auth/calendar.readonly';
const Google = {
  access: {}, client: null, script: null, settle: null,

  available: () => !!window.PACED_GOOGLE_CLIENT_ID,
  signedIn(scope) { const a = this.access[scope]; return !!a && Date.now() < a.expires; },
  forget(scope) { if (scope) delete this.access[scope]; else this.access = {}; },
  loaded: () => !!window.google?.accounts?.oauth2,

  load() {
    if (this.loaded()) return Promise.resolve();
    return this.script || (this.script = new Promise((resolve, reject) => {
      const el = document.createElement('script');
      el.src = GOOGLE_SCRIPT;
      el.onload = resolve;
      el.onerror = () => { el.remove(); this.script = null; reject(new Error('blocked')); };
      document.head.appendChild(el);
    }));
  },

  // Call this straight from a click, or the browser blocks Google's popup.
  signIn(scope) {
    return new Promise((resolve, reject) => {
      const oauth = window.google.accounts.oauth2;
      this.settle = { scope, resolve, reject };
      this.client = this.client || oauth.initTokenClient({
        client_id: window.PACED_GOOGLE_CLIENT_ID,
        scope,
        callback: r => {
          const w = this.settle;
          if (r.error || !oauth.hasGrantedAllScopes(r, w.scope)) { w.reject(new Error('denied')); return; }
          this.access[w.scope] = { token: r.access_token, expires: Date.now() + (r.expires_in - 60) * 1000 };
          w.resolve();
        },
        error_callback: e => this.settle.reject(new Error(e.type === 'popup_closed' ? 'closed' : e.type === 'popup_failed_to_open' ? 'popup' : 'denied'))
      });
      this.client.requestAccessToken({ prompt: '', scope });
    });
  },

  async pages(scope, url, query) {
    const items = [];
    let pageToken = '';
    do {
      const q = new URLSearchParams({ maxResults: 100, ...query });
      if (pageToken) q.set('pageToken', pageToken);
      const res = await fetch(`${url}?${q}`, { headers: { Authorization: `Bearer ${this.access[scope]?.token}` } });
      if (!res.ok) throw Object.assign(new Error('google'), { status: res.status });
      const d = await res.json();
      items.push(...(d.items || []));
      pageToken = d.nextPageToken;
    } while (pageToken);
    return items;
  }
};

// Every list that has open tasks, with each task's subtasks folded into it.
async function gtLists() {
  const lists = await Google.pages(TASKS_SCOPE, `${GOOGLE_TASKS_API}/users/@me/lists`);
  const full = await Promise.all(lists.map(async l => ({
    id: l.id, title: String(l.title || 'Untitled list'),
    tasks: gtShape(await Google.pages(TASKS_SCOPE, `${GOOGLE_TASKS_API}/lists/${encodeURIComponent(l.id)}/tasks`, { showCompleted: false, showHidden: false }))
  })));
  return full.filter(l => l.tasks.length);
}

function gtShape(items) {
  const named = items.filter(i => String(i.title || '').trim());
  const ids = new Set(named.map(i => i.id));
  const byPosition = (a, b) => String(a.position || '').localeCompare(String(b.position || ''));
  // A subtask whose parent is finished has nothing to sit under, so it stands on its own.
  return named.filter(i => !ids.has(i.parent)).sort(byPosition).map(i => {
    const due = String(i.due || '').slice(0, 10); // Google keeps only the date here, written as midnight UTC, so it must not shift with your time zone
    return { id: i.id, title: i.title.trim(), due: isKey(due) ? due : null, subs: named.filter(s => s.parent === i.id).sort(byPosition).map(s => s.title.trim()) };
  });
}

/* ----- your calendar: time that's already taken -----
   Events stay apart from the day's plan, so Reset leaves your meetings alone and a new fetch can replace them all. */
const CAL_WARN_MIN = 5; // how long before an event Paced warns you
const calConnected = () => !!state.meta.calIds?.length;
const calStale = () => calConnected() && state.meta.cal?.date !== dateKey();
const todayEvents = () => {
  const c = state.meta.cal;
  return c?.date === dateKey() ? c.events.filter(e => !c.hidden.includes(e.id)) : [];
};

// Only timed events that really take up your time count, so all-day events, ones marked Free and ones you declined are left out.
function calEvent(i, day) {
  if (!i.start?.dateTime || i.status === 'cancelled' || i.transparency === 'transparent') return null;
  if (i.attendees?.find(a => a.self)?.responseStatus === 'declined') return null;
  const at = d => { const k = dateKey(d); return k < day ? 0 : k > day ? 1440 : d.getHours() * 60 + d.getMinutes(); };
  const s = at(new Date(i.start.dateTime)), e = at(new Date(i.end?.dateTime || i.start.dateTime));
  return { id: `${i.iCalUID || i.id}@${s}`, title: String(i.summary || 'Busy'), s, e: Math.max(e, s + PLAN_SNAP) };
}

async function calEvents(ids) {
  const day = dateKey(), from = keyDate(day), to = keyDate(addDays(day, 1)), found = new Map();
  const query = { timeMin: from.toISOString(), timeMax: to.toISOString(), singleEvents: true, orderBy: 'startTime' };
  const lists = await Promise.all(ids.map(id => Google.pages(CAL_SCOPE, `${GOOGLE_CAL_API}/calendars/${encodeURIComponent(id)}/events`, query)
    .catch(e => { if (e.status === 404) return []; throw e; }))); // a calendar you've since removed
  for (const item of lists.flat()) { const ev = calEvent(item, day); if (ev) found.set(ev.id, ev); } // the same meeting can be on two calendars
  return [...found.values()].sort((a, b) => a.s - b.s);
}

async function refreshCalendar(ids = state.meta.calIds) {
  const events = await calEvents(ids), old = state.meta.cal;
  state.meta.calIds = ids;
  state.meta.cal = { date: dateKey(), at: Date.now(), events, hidden: old?.date === dateKey() ? old.hidden : [] };
  saveMeta();
  render();
  const n = todayEvents().length;
  toast(n ? `${n} ${n === 1 ? 'event' : 'events'} on today’s timeline` : 'Nothing on your calendar today', 'Change calendars', () => openGoogle('gcal'));
}

function calFailed(e) {
  if (e.status === 401) Google.forget(CAL_SCOPE);
  const msg = e.status === 401 ? 'Your Google sign-in ran out. Press Calendar again.' : googleError(e.message, 'calendar') || (e.status ? googleError('load', 'calendar') : '');
  if (msg) toast(msg);
}

// Once your calendars are chosen, the button just gets today's events.
function openCalendar() {
  if (!calConnected()) { openGoogle('gcal'); return; }
  if (Google.signedIn(CAL_SCOPE)) { refreshCalendar().catch(calFailed); return; }
  if (!Google.loaded()) { openGoogle('gcal'); return; }
  Google.signIn(CAL_SCOPE).then(() => refreshCalendar()).catch(calFailed);
}

function turnOffCalendar() {
  state.meta.calIds = null;
  state.meta.cal = null;
  saveMeta();
  Google.forget(CAL_SCOPE);
  renderLayer(); render();
  toast('Google Calendar is turned off.');
}

function hideEvent(id) {
  const c = state.meta.cal, ev = c?.events.find(e => e.id === id);
  if (!ev) return;
  c.hidden.push(id);
  saveMeta();
  daySel = null;
  render();
  toast(`Hid “${ev.title}” for today`, 'Undo', () => {
    const now = state.meta.cal;
    if (now) { now.hidden = now.hidden.filter(x => x !== id); saveMeta(); render(); }
  });
}

const calWarned = new Set();
let calPreloaded = false;
function tickCalendar() {
  // Loading Google's script early lets the Calendar button open its popup on the first click.
  if (!calPreloaded && calConnected() && Google.available()) { calPreloaded = true; Google.load().catch(() => {}); }
  const now = minuteNow();
  for (const ev of todayEvents()) {
    if (ev.s <= now || ev.s > now + CAL_WARN_MIN || calWarned.has(ev.id)) continue;
    calWarned.add(ev.id);
    Alert.send(`${ev.title} at ${clockAt(ev.s)}`, 'Time to wrap up what you’re doing.');
  }
}

// One task for each line, without the bullets or numbers that lists come with.
function pasteLines(text) {

  return text.split(/\r?\n/).map(line => { while (mark.test(line)) line = line.replace(mark, ''); return line.trim(); })
    .filter(line => line && !seen.has(line.toLowerCase()) && seen.add(line.toLowerCase()));
}
