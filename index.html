function dayView() {
  const p = drag?.preview || dayPlan(), now = minuteNow(), lay = layoutDay(p, now), past = pastWork(now);
  const points = [now, ...p.windows.flatMap(w => [w.s, w.e])];
  const laneW = Math.min(1040, innerWidth - 24) - 24, wide = laneW >= 600;
  // The whole day is always there to scroll through. Your hours set the zoom and where it opens, so what's on it never changes the scale.
  let home = Math.max(0, Math.floor((Math.min(...points) - (wide ? 20 : 0)) / 60) * 60), last = Math.ceil((Math.max(...points) + (wide ? 20 : 0)) / 60) * 60;
  if (!wide) home = Math.max(home, Math.floor((now - 60) / 60) * 60); // on a phone, what's over doesn't get to squeeze what's left
  let end = Math.max(1440, ...lay.blocks.map(b => Math.ceil(b.end / 60) * 60)), pxPerMin = clamp((laneW - RAIL_PEEK) / (last - home), RAIL_ZOOM.min, RAIL_ZOOM.max);
  if (drag) ({ home, end, pxPerMin } = drag.frozen); // the timeline holds still under your finger
  return (railView = { p, now, lay, past, start: 0, end, home, pxPerMin });
}

// Scrolling replaces nothing on screen, so a redraw has to put the timeline back where it was.
function placeRail(v) {
  const s = $('.rail-scroll');
  s.scrollLeft = ((railAt ?? v.home) - v.start) * v.pxPerMin;
  railPx = s.scrollLeft;
}
function railScrolled(s) {
  if (!railView || Math.abs(s.scrollLeft - railPx) < 1) return; // that was us putting it back
  railPx = s.scrollLeft;
  railAt = railView.start + railPx / railView.pxPerMin;
  $('#day-now').hidden = false;
  const menu = $('.day-menu');
  if (menu) menu.style.left = menuLeft(railView, railView.menuAt);
}

// What you've really done today, from the session records.
function pastWork(now) {
  const m = state.meta, today = dateKey(), a = m.session?.active;
  const minOf = ms => { const d = new Date(ms); return d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60; };
  const events = [...[...state.records.values()].flatMap(r => r.events), ...(m.run?.events || [])]
    .filter(e => ['done', 'aside', 'break'].includes(e.type) && dateKey(new Date(e.at)) === today);
  if (a) events.push({ type: 'done', at: a.startedAt, end: Date.now(), task: state.tasks.get(a.taskId)?.title });
  if (m.brk) events.push({ type: 'break', at: m.brk.startedAt, end: Date.now() });
  const out = [];
  for (const e of events.sort((x, y) => x.at - y.at)) {
    const title = e.type === 'break' ? 'Break' : e.task, last = out[out.length - 1], s = minOf(e.at), end = Math.min(minOf(e.end), now);
    if (last && last.title === title && s - last.e <= 3) last.e = Math.max(last.e, end); else out.push({ title, s, e: end });
  }
  return out.filter(x => x.e - x.s >= 1);
}

const atPct = (v, min) => ((min - v.start) / (v.end - v.start) * 100).toFixed(2);
const spanStyle = (v, a, b) => `left:${atPct(v, a)}%;width:calc(${((b - a) / (v.end - v.start) * 100).toFixed(2)}% - 2px)`;
const menuLeft = (v, at) => `clamp(0px, calc(${Math.round((at - (railAt ?? v.home)) * v.pxPerMin)}px - 138px), calc(100% - 300px))`;
const rangeWords = (s, e) => `${clockAt(s)} to ${clockAt(e)}`;

// Everything of the chosen kind that a stretch of time touches. What's happening now can't be selected.
const idsIn = (lay, s, e) => dayFilter === 'brk'
  ? lay.stops.filter(b => b.item && b.s < e && b.e > s).map(b => b.item.id)
  : lay.blocks.filter(b => !b.item.front && b.pieces.some(x => x.s < e && x.e > s)).map(b => b.item.id);
const marquee = () => drag?.type === 'select' ? { s: Math.min(drag.from, drag.to), e: Math.max(drag.from, drag.to) } : null;

function blockState(item, kind, lay) {
  const box = marquee(), id = item?.id;
  const picked = box ? idsIn(lay, box.s, box.e).includes(id) : !!daySel?.ids?.includes(id);
  return [picked && 'picked', box && dayFilter !== kind && 'dim', drag?.item && drag.item.id === id && 'lifted'];
}

function pieceHTML(b, piece, i, v) {
  const t = b.task, px = (piece.e - piece.s) * v.pxPerMin, item = b.item;
  const cls = [item.live && 'live', piece.late && 'late', b.guess && !item.live && 'guess', i && 'cont', i < b.pieces.length - 1 && 'cut', ...blockState(item, 'task', v.lay)].filter(Boolean).join(' ');
  const when = i ? 'continued' : `${clockAt(b.start)} · ${fmtMin(b.min)}`;
  const words = px >= 24 ? `<b>${esc(t.title)}</b>${px >= 92 ? `<span>${esc(when)}</span>` : ''}` : '';
  return `<div class="tblock ${cls}"${item.front ? '' : ` data-drag="item" data-item="${item.id}"`} style="${spanStyle(v, piece.s, piece.e)}" title="${esc(t.title)}, ${esc(when)}">
    <button class="tb-open" data-act="day-pick" data-item="${item.id}" aria-label="${esc(t.title)}, ${rangeWords(b.start, b.end)}${piece.late ? ', past the end of your day' : ''}">${words}</button>
    ${item.front || i < b.pieces.length - 1 ? '' : `<button class="tb-edge" data-grow="${item.id}" title="Drag to change how long this takes" aria-label="Length of ${esc(t.title)}, ${fmtMin(b.min)}. Use the arrow keys to change it."></button>`}
  </div>`;
}

function breakBlockHTML(b, v) {
  const min = Math.round(b.e - b.s), px = (b.e - b.s) * v.pxPerMin, item = b.item;
  const cls = [b.live && 'live', ...blockState(item, 'brk', v.lay)].filter(Boolean).join(' ');
  const words = px >= 24 ? `<b>Break</b>${px >= 92 ? `<span>${clockAt(b.s)} · ${fmtMin(min)}</span>` : ''}` : '';
  const open = item ? `data-act="day-pick" data-item="${item.id}"` : 'data-act="focus-open"';
  return `<div class="tblock brk ${cls}"${item ? ` data-drag="item" data-item="${item.id}"` : ''} style="${spanStyle(v, b.s, b.e)}" title="Break, ${clockAt(b.s)}, ${fmtMin(min)}">
    <button class="tb-open" ${open} aria-label="Break, ${rangeWords(b.s, b.e)}">${words}</button>
  </div>`;
}

function eventBlockHTML(b, v) {
  const ev = b.ev, px = (b.e - b.s) * v.pxPerMin, picked = daySel?.kind === 'evt' && daySel.ids.includes(ev.id);
  const words = px >= 24 ? `<b>${esc(ev.title)}</b>${px >= 92 ? `<span>${rangeWords(b.s, b.e)}</span>` : ''}` : '';
  return `<div class="tblock evt${picked ? ' picked' : ''}${b.e <= v.now ? ' done' : ''}" style="${spanStyle(v, b.s, b.e)}" title="${esc(ev.title)}, ${rangeWords(b.s, b.e)}">
    <button class="tb-open" data-act="cal-pick" data-id="${esc(ev.id)}" aria-label="${esc(ev.title)}, ${rangeWords(b.s, b.e)}">${words}</button>
  </div>`;
}
function pickEvent(id) {
  daySel = daySel?.kind === 'evt' && daySel.ids[0] === id ? null : { kind: 'evt', ids: [id], range: null };
  renderDay('quiet');
}

// The line of numbers at the top of the panel, and on the closed button.
const dayWords = lay => lay.freeMin < 1 ? 'No free time left today' : `${fmtMin(lay.freeMin)} free${lay.planMin && lay.lateMin < 1 ? ` · ${fmtMin(lay.planMin)} planned` : ''}`;

function dayHTML() {
  const v = dayView(), { p, now, lay } = v, ticks = [], box = marquee();
  for (let h = Math.ceil(v.start / 60); h * 60 < v.end; h++) ticks.push(`<div class="tick" style="left:${atPct(v, h * 60)}%">${Math.abs(h * 60 - now) * v.pxPerMin < 44 ? '' : `<span>${hourName(h % 24)}</span>`}</div>`);
  const wins = p.windows.map((w, i) => `<div class="win" style="left:${atPct(v, w.s)}%;width:${((w.e - w.s) / (v.end - v.start) * 100).toFixed(2)}%">
    <button class="win-edge opens" data-edge="s" data-i="${i}" title="Drag to change when you start" aria-label="Start time, ${clockAt(w.s)}. Use the arrow keys to change it."></button>
    <button class="win-edge closes" data-edge="e" data-i="${i}" title="Drag to change when you stop" aria-label="End time, ${clockAt(w.e)}. Use the arrow keys to change it."></button>
  </div>`).join('');
  const first = p.windows.find(w => w.e > now), hintFrom = first ? Math.max(first.s, now) : now, hintTo = first ? first.e : now + 60;
  // Something doesn't fit only because blocks are waiting at the times you dropped them.
  const gaps = lay.lateMin >= 1 && lay.planMin <= lay.freeMin && lay.blocks.some(b => b.item.at != null);
  const fresh = !p.items.length && sameHours(p.windows, usualHours());
  const filterBtn = (id, label) => `<button class="${dayFilter === id ? 'on' : ''}" data-act="day-filter" data-v="${id}" aria-pressed="${dayFilter === id}" title="Drag across the timeline to select ${label.toLowerCase()}">${label}</button>`;
  return `<button class="day-grip" data-size="1" title="Drag to make the timeline taller or shorter" aria-label="Timeline height. Use the arrow keys to change it."></button>
    <div class="day-head">
      <h2>Today</h2>
      <p class="day-sum">${dayWords(lay)}${lay.lateMin >= 1 ? ` · <b>${fmtMin(lay.lateMin)} over</b>` : ''}</p>
      <div class="day-tools">
        ${gaps ? '<button class="link small" data-act="plan-tidy">Close the gaps</button>' : ''}
        <span class="day-filter" role="group" aria-label="What dragging across the timeline selects"><span>Select</span>${filterBtn('task', 'Tasks')}${filterBtn('brk', 'Breaks')}</span>
        <button class="btn ghost small" data-drag="brk" data-act="plan-break" title="Drag onto the timeline, or click to add one after your next task">${ICON.cup}Break</button>
        <button class="link small" id="day-now" data-act="day-now" title="Back to today’s hours"${railAt == null ? ' hidden' : ''}>Back</button>
        ${Google.available() ? `<button class="link small" data-act="cal-open" title="Show today’s events from Google Calendar">${calStale() ? 'Update calendar' : 'Calendar'}</button>` : ''}
        <button class="link small" data-act="open-hours">Hours</button>
        <button class="link small" data-act="plan-reset"${fresh ? ' disabled' : ''} title="Clear today’s timeline and go back to your usual hours">Reset</button>
      </div>
      <button class="icon-btn day-toggle" data-act="day-toggle" title="Close the timeline" aria-label="Close the timeline">${ICON.minus}</button>
    </div>
    <div class="rail-scroll"><div class="rail${dayFilter === 'brk' ? ' for-breaks' : ''}" id="rail" style="width:${Math.round((v.end - v.start) * v.pxPerMin)}px">
      ${ticks.join('')}${wins}
      <div class="spent" style="width:${atPct(v, now)}%"></div>
      ${v.past.map(b => `<div class="tblock ago" style="${spanStyle(v, b.s, b.e)}" title="${esc(b.title)}, done"><div class="tb-open">${(b.e - b.s) * v.pxPerMin >= 24 ? `<b>${esc(b.title)}</b>` : ''}</div></div>`).join('')}
      ${lay.blocks.flatMap(b => b.pieces.map((x, i) => pieceHTML(b, x, i, v))).join('')}
      ${lay.stops.map(b => b.ev ? eventBlockHTML(b, v) : breakBlockHTML(b, v)).join('')}
      ${lay.blocks.length ? '' : `<div class="rail-hint" style="${spanStyle(v, hintFrom, hintTo)}">Drag a task here</div>`}
      ${box ? `<div class="marquee" style="${spanStyle(v, box.s, box.e)}"></div>` : ''}
      <div class="now-line" style="left:${atPct(v, now)}%"><span>${clockAt(now).replace(/\s?[AP]M$/i, '')}</span></div>
    </div></div>
    ${extraPct() ? `<p class="day-foot">Sized for your real speed, about ${extraPct()}% over your guesses</p>` : ''}
    ${dayMenuHTML(v)}`;
}

/* ----- the menu for what's selected ----- */
const chipRow = (list, act, label, on) => `<div class="dm-row">${list.map(n => `<button class="dm-chip${n === on ? ' on' : ''}" data-act="${act}" data-min="${n}" aria-label="${esc(label(n))}">${n > 0 && act === 'sel-move' ? '+' : ''}${n}</button>`).join('')}</div>`;
const menuHead = title => `<div class="dm-head"><b>${esc(title)}</b><button class="icon-btn" data-act="day-close" aria-label="Close this menu">${ICON.x}</button></div>`;

function taskMenuHTML(b, lay) {
  const t = b.task, item = b.item, m = state.meta, late = b.pieces.some(x => x.late);
  const sub = `<p class="dm-sub">${rangeWords(b.start, b.end)} · ${fmtMin(b.min)}${late ? ' · past your hours' : ''}</p>`;
  const details = `<button class="btn ghost" data-act="sel-open" data-id="${t.id}">Details</button>`;
  if (item.front) return menuHead(t.title) + sub + `<div class="dm-row"><button class="btn primary" data-act="sel-show">Show timer</button>${details}</div>`;
  const others = activeTasks().filter(x => x.id !== t.id && onPlan(x) && !lay.blocks.some(y => y.item.front && y.task.id === x.id));
  const rows = others.map(x => {
    const on = lay.blocks.find(y => y.task.id === x.id);
    return `<li><button data-act="sel-swap" data-id="${x.id}"><span>${esc(x.title)}</span><small>${on ? `Swaps with ${clockAt(on.start)}` : fmtMin(taskRoom(x).min)}</small></button></li>`;
  }).join('');
  const busy = m.session?.active || m.brk;
  return menuHead(t.title) + sub + `<div class="dm-row">
      ${t.steps.length && !busy ? `<button class="btn primary" data-act="sel-start" data-id="${t.id}">${ICON.play}Start now</button>` : ''}
      ${details}
      <button class="btn danger" data-act="sel-delete">Take off today</button>
    </div>
    ${rows ? `<div class="dm-label">Change to</div><ul class="dm-list">${rows}</ul>` : ''}`;
}

function breakMenuHTML(stops) {
  const one = stops.length === 1, b = stops[0], len = stops.every(x => x.item.brk === b.item.brk) ? b.item.brk : null;
  const title = one ? 'Break' : `${stops.length} breaks`;
  const sub = one ? rangeWords(b.s, b.e) : `${rangeWords(stops[0].s, stops[stops.length - 1].e)}`;
  return menuHead(title) + `<p class="dm-sub">${sub}</p>
    <div class="dm-label">Length in minutes</div>${chipRow(LENGTHS, 'sel-len', n => `Make ${one ? 'it' : 'them'} ${n} minutes`, len)}
    <div class="dm-label">Move by minutes</div>${chipRow(NUDGES, 'sel-move', n => `Move ${one ? 'it' : 'them'} ${Math.abs(n)} minutes ${n < 0 ? 'earlier' : 'later'}`)}
    <div class="dm-row">
      ${one ? '<button class="btn ghost" data-act="sel-now">Take it now</button><button class="btn ghost" data-act="sel-copy">Copy an hour later</button>' : ''}
      <button class="btn danger" data-act="sel-delete">${one ? 'Delete' : `Delete ${stops.length}`}</button>
    </div>`;
}

// What you can do with the stretch you dragged across, whatever is in it.
function rangeRowHTML(r, p) {
  const inHours = p.windows.some(w => w.s < r.e && w.e > r.s), outside = !p.windows.some(w => w.s <= r.s && w.e >= r.e);
  return `<div class="dm-row">
      <button class="btn ghost" data-act="sel-break">Add a break here</button>
      ${inHours ? '<button class="btn ghost" data-act="sel-block">Block off this time</button>' : ''}
      ${outside ? '<button class="btn ghost" data-act="sel-hours">Add to my hours</button>' : ''}
    </div>`;
}

function dayMenuHTML(v) {
  if (!daySel || drag) return '';
  const { lay, p } = v, { kind, range } = daySel, ids = daySel.ids;
  let at, body = '';
  if (!ids.length) { if (range) { at = (range.s + range.e) / 2; body = menuHead(rangeWords(range.s, range.e)) + `<p class="dm-sub">${fmtMin(range.e - range.s)}, no ${kind === 'brk' ? 'breaks' : 'tasks'} here</p>${rangeRowHTML(range, p)}`; } }
  else if (kind === 'evt') {
    const b = lay.stops.find(x => x.ev?.id === ids[0]);
    if (b) {
      at = (b.s + b.e) / 2;
      body = menuHead(b.ev.title) + `<p class="dm-sub">${rangeWords(b.s, b.e)}, from your calendar</p>
        <div class="dm-row"><button class="btn ghost" data-act="sel-delete">Hide for today</button></div>`;
    }
  } else if (kind === 'brk') {
    const stops = lay.stops.filter(b => b.item && ids.includes(b.item.id));
    if (stops.length) { at = (stops[0].s + stops[stops.length - 1].e) / 2; body = breakMenuHTML(stops); }
  } else {
    const blocks = lay.blocks.filter(b => ids.includes(b.item.id));
    if (blocks.length === 1) { at = (blocks[0].start + blocks[0].end) / 2; body = taskMenuHTML(blocks[0], lay); }
    else if (blocks.length) {
      at = (blocks[0].start + blocks[blocks.length - 1].end) / 2;
      body = menuHead(`${blocks.length} tasks`) + `<p class="dm-sub">${esc(blocks.map(b => b.task.title).join(', '))}</p>
        <div class="dm-row"><button class="btn danger" data-act="sel-delete">Take ${blocks.length} off today</button></div>`;
    }
  }
  if (!body) { daySel = null; return ''; }
  if (range && ids.length && range.e - range.s <= STRETCH_MAX_MIN) body += `<div class="dm-label">The stretch you selected, ${rangeWords(range.s, range.e)}</div>${rangeRowHTML(range, p)}`;
  v.menuAt = at;
  return `<section class="day-menu" role="dialog" aria-label="Change what you selected" style="left:${menuLeft(v, at)}">${body}</section>`;
}

/* ----- the colored row on each task: when the timeline says it'll be finished ----- */
function slotInfo(t, lay) {
  const b = lay.blocks.find(x => x.task.id === t.id);
  if (!b) return null;
  const over = b.pieces.reduce((a, x) => a + (x.late ? x.e - x.s : 0), 0), end = clockAt(b.end);
  if (b.pieces[0].late) return { cls: 'late', text: b.item.at != null ? 'Outside your hours' : 'Doesn’t fit today', side: `Would finish ${end}` };
  if (over >= 1) return { cls: 'late', text: `Runs ${fmtMin(over)} past your hours`, side: `Would finish ${end}` };
  if (b.item.front) return { cls: 'live', text: `Finish by ${end}`, side: `${fmtMin(b.min)} left` };
  if (b.guess) return { cls: 'guess', text: `Finish by about ${end}`, side: 'Add minutes to be sure' };
  return { cls: '', text: `Finish by ${end}`, side: `Starts ${clockAt(b.start)}` };
}

const slotSeen = new Map();
// The rows follow a drag as it happens, and flash once when a change lands. The clock moving them doesn't count.
function renderSlots(lay, quiet) {
  document.querySelectorAll('[data-slot]').forEach(el => {
    const id = el.dataset.slot, t = state.tasks.get(id), info = t && slotInfo(t, lay), key = info ? info.text : '';
    el.hidden = !info;
    el.className = `task-slot ${info ? info.cls : ''}`;
    el.innerHTML = info ? `<b>${esc(info.text)}</b><span>${esc(info.side)}</span>` : '';
    if (drag) return;
    if (!quiet && info && slotSeen.has(id) && slotSeen.get(id) !== key) el.classList.add('moved');
    slotSeen.set(id, key);
  });
}

function renderDay(how) {
  const el = $('#day'), show = state.ready && Store.mode !== 'signin' && state.view === 'home' && !state.focusOpen && activeTasks().length > 0;
  document.body.classList.toggle('has-day', show);
  el.hidden = !show;
  if (!show) { daySel = null; document.documentElement.style.setProperty('--day-lift', '0px'); return; }
  el.classList.toggle('shut', !dayOpen);
  el.style.setProperty('--rail-h', `${railH}px`);
  const scroller = $('.rail-scroll');
  if (scroller) railScrolled(scroller); // the browser may not have told us about the latest scroll yet
  if (dayOpen) { el.innerHTML = dayHTML(); placeRail(railView); }
  else {
    const lay = layoutDay();
    el.innerHTML = `<button class="day-pill" data-act="day-toggle" title="Open the timeline" aria-label="Open the timeline">${ICON.plus}Today<span class="${lay.lateMin >= 1 ? 'over' : ''}">${lay.lateMin >= 1 ? `${fmtMin(lay.lateMin)} over` : dayWords(lay)}</span></button>`;
  }
  renderSlots(dayOpen ? railView.lay : layoutDay(), how === 'quiet');
  // Whatever floats over the bottom of the window stays clear of the panel.
  document.documentElement.style.setProperty('--day-lift', dayOpen ? `${el.offsetHeight + 8}px` : '0px');
}
window.addEventListener('resize', () => { if (!drag) renderDay('quiet'); });
document.addEventListener('scroll', e => { if (e.target.classList?.contains('rail-scroll')) railScrolled(e.target); }, true);
// A mouse wheel only goes up and down, so over the timeline that moves it through the day.
document.addEventListener('wheel', e => {
  const s = e.target.closest?.('.rail-scroll');
  if (!s || e.ctrlKey || Math.abs(e.deltaX) >= Math.abs(e.deltaY)) return;
  e.preventDefault();
  s.scrollLeft += e.deltaY * (e.deltaMode === 1 ? 16 : 1);
}, { passive: false });

/* ----- your hours ----- */
const hhmm = min => `${pad(Math.floor(min / 60))}:${pad(min % 60)}`;
const parseHHMM = v => { const m = /^(\d\d):(\d\d)$/.exec(v || ''); return m ? +m[1] * 60 + +m[2] : null; };

function hoursHTML(enter) {
  const p = dayPlan();
  const rows = p.windows.map((w, i) => `<div class="hours-row">
    <input type="time" class="text-input" data-hour="s" data-i="${i}" value="${hhmm(w.s)}" aria-label="Start of stretch ${i + 1}">
    <span class="muted">to</span>
    <input type="time" class="text-input" data-hour="e" data-i="${i}" value="${hhmm(w.e)}" aria-label="End of stretch ${i + 1}">
    <button class="icon-btn" data-act="hours-del" data-i="${i}" title="Remove" aria-label="Remove stretch ${i + 1}">${ICON.trash}</button>
  </div>`).join('');
  return `${sheetOpen(enter, 'Your hours today')}${sheetHead('Your hours today')}
    <p class="help" style="margin-top:8px">The times you can work today. On the timeline you can also drag either end of a green area, or drag across an empty stretch and choose Block off this time.</p>
    ${rows || '<p class="help">No time set aside today.</p>'}
    <button class="btn ghost small" data-act="hours-add">${ICON.plus}Add more time</button>
    <div class="sheet-foot">
      ${sameHours(p.windows, usualHours()) ? '<span></span>' : '<button class="link small" data-act="hours-usual">Use these hours every day</button>'}
      <button class="btn primary" data-act="close-layer">Done</button>
    </div>
  </section>`;
}

function taskHTML(t) {
  const total = t.steps.length, done = total - stepsLeft(t).length, left = minLeft(t);
  let meta;
  if (!total) meta = 'No steps yet';
  else if (!done) meta = `${total} ${total === 1 ? 'step' : 'steps'}${left ? ` · about ${fmtMin(left)}` : ''}`;
  else meta = `${done} of ${total} steps done${left ? ` · about ${fmtMin(left)} left` : ''}`;
  const live = state.meta.session?.active?.taskId === t.id;
  const action = !total
    ? `<button class="btn ghost small" data-act="add-steps" data-id="${t.id}">Add steps</button>`
    : `<button class="btn soft small start" data-act="focus-task" data-id="${t.id}" aria-label="${live ? 'Show the timer for' : 'Start working on'} “${esc(t.title)}”">${live ? 'Show' : ICON.play + 'Start'}</button>`;
  return `<li class="task can-plan" data-drag="task" data-id="${t.id}">
    <span class="grip" title="Drag onto the timeline">${ICON.grip}</span>
    <button class="check" data-act="complete-task" data-id="${t.id}" title="Mark the whole task as done" aria-label="Mark “${esc(t.title)}” as done"><span>${ICON.check}</span></button>
    <button class="task-body" data-act="open-task" data-id="${t.id}">
      <span class="task-title">${esc(t.title)}</span>
      <span class="task-meta">${meta}${t.due ? ' · ' + dueHTML(t) : ''}</span>
      ${live ? '<span class="badge"><span class="dot"></span>Working on this now</span>' : ''}
      ${total ? `<span class="bar" aria-hidden="true"><i style="width:${Math.round(done / total * 100)}%"></i></span>` : ''}
    </button>
    ${action}
    <div class="task-slot" data-slot="${t.id}" hidden></div>
  </li>`;
}

// Finds out which way of working gets you through steps fastest, once there's enough to go on. Picking one here starts using it.
const vsGuess = speed => speed === 100 ? 'as fast as you guessed' : `${Math.abs(speed - 100)}% ${speed > 100 ? 'faster' : 'slower'} than you guessed`;
function methodCardHTML() {
  const stats = methodStats(), ready = stats.filter(x => x.sessions >= 3 && x.steps >= 3);
  const best = ready.length >= 2 ? ready.reduce((a, b) => (b.speed > a.speed ? b : a)) : null;
  const current = methodById(state.meta.method);
  const intro = best
    ? `<p class="why"><b>${esc(best.name)} works best for you.</b> With it you finish ${vsGuess(best.speed)}.</p>`
    : '<p class="help">Pick one and use it 3 times, then try another. Paced will show you which one got you through your tasks fastest. Working until a break, or until you stop, counts as one time.</p>';
  const tally = x => x.sessions >= 3 && x.speed != null ? `You finish ${vsGuess(x.speed)}` : x.sessions ? `Used ${x.sessions} of 3 times` : 'Not tried yet';
  const opts = stats.map(x => `<button class="method-opt${x.id === current.id ? ' on' : ''}" data-act="method-pick" data-v="${x.id}" aria-pressed="${x.id === current.id}">
      <b>${esc(x.name)}</b><span>${esc(x.short)}</span>
      <span class="method-tally${best && x.id === best.id ? ' best' : ''}">${tally(x)}${x.id === current.id ? ' · Using this now' : ''}</span>
    </button>`).join('');
  return `<section class="panel method-card"><div class="eyebrow">Find your best way to work</div>${intro}<div class="methods">${opts}</div></section>`;
}

function archiveHTML() {
  const list = archivedTasks();
  return `<div class="brand-row"><button class="btn ghost small" data-act="show-home">${ICON.back}My tasks</button></div>
  <h1>Completed tasks</h1>
  <p class="sub">${list.length ? 'Tasks you’ve finished' : 'Nothing here yet'}</p>
  ${list.length ? `<ul class="tasks">${list.map(t => {
    const took = t.steps.reduce((a, s) => a + (s.actual || 0), 0);
    const meta = [t.completedAt ? `Finished ${fmtMonthDay(dateKey(new Date(t.completedAt)))}` : 'Finished'];
    if (t.steps.length) meta.push(`${t.steps.length} ${t.steps.length === 1 ? 'step' : 'steps'}`);
    if (took >= 60) meta.push(`${fmtDur(took)} of work`);
    return `<li class="task">
      <span class="check on" aria-hidden="true"><span>${ICON.check}</span></span>
      <div class="task-body"><span class="task-title">${esc(t.title)}</span><span class="task-meta">${meta.join(' · ')}</span></div>
      <div class="row-actions">
        <button class="btn ghost small" data-act="restore" data-id="${t.id}" title="Put this task back on your list">Restore</button>
        <button class="icon-btn" data-act="purge" data-id="${t.id}" title="Delete" aria-label="Delete “${esc(t.title)}” for good">${ICON.trash}</button>
      </div>
    </li>`;
  }).join('')}</ul>` : '<section class="empty"><p>When you finish every step of a task, it moves here automatically. You can restore it, or delete it for good.</p></section>'}`;
}

function renderMini() {
  const el = $('#mini'), m = state.meta, s = m.session;
  const show = state.ready && !state.focusOpen && (m.brk || s);
  document.body.classList.toggle('has-mini', !!show);
  if (!show) { el.hidden = true; el.innerHTML = ''; return; }
  el.hidden = false;
  const c = liveClock();
  el.classList.toggle('over', !!(c && c.over));
  const dot = `<span class="mini-dot${m.brk || (c && c.paused) ? ' still' : ''}"></span>`;
  const title = c ? esc(c.label) + (c.paused ? ' (paused)' : '') : 'Ready for your next step';
  const time = c ? `<span class="mini-time" data-tick="mini">${fmtClock(c.left)}</span>` : '';
  el.innerHTML = `<div class="mini-in">${dot}<span class="mini-title">${title}</span>${time}${popOutButton()}<button class="btn small" data-act="focus-open">Show</button></div>`;
}

// The one clock that matters right now, for the tab title and the bar at the bottom. A negative "left" is time past the end.
function liveClock(now = Date.now()) {
  const m = state.meta, s = m.session;
  if (m.brk) {
    const left = (m.brk.until - now) / 1000;
    return { label: left > 0 ? 'On a break' : 'Break’s over', left, over: left < 0 };
  }
  if (!s) return null;
  if (s.active) {
    const a = s.active, st = findStep(a.taskId, a.stepId), el = elapsedSec(a, now), target = targetSec(a, st);
    return { label: st ? st.title : 'Working', left: target == null ? el : target - el, over: target != null && el > target, paused: !!a.pausedAt && !a.autoStopped };
  }
  if (!s.gap) return null;
  const plan = gapPlan(s), left = (s.gap.until - now) / 1000;
  if (plan.type === 'none') return null;
  const label = left < 0 ? 'Nothing running' : plan.type === 'step' ? 'Next: ' + plan.next.title : plan.type === 'break' ? 'Break coming up' : 'Pick what’s next';
  return { label, left, over: left < 0 };
}

/* ---------- sheets ---------- */
function renderLayer(enter) {
  const el = $('#layer'), L = state.layer;
  const t = L && L.type === 'detail' ? state.tasks.get(L.id) : null;
  const rec = L && L.type === 'record' ? state.records.get(L.id) : null;
  if (!L || (L.type === 'detail' && !t) || (L.type === 'record' && !rec)) {
    state.layer = null; el.hidden = true; el.innerHTML = '';
    document.body.classList.toggle('locked', state.focusOpen);
    return;
  }
  el.hidden = false;
  document.body.classList.add('locked');
  el.innerHTML = '<button class="scrim" data-act="close-layer" aria-label="Close" tabindex="-1"></button>' + (L.type === 'hours' ? hoursHTML(enter) : L.type === 'import' ? importHTML(enter) : ['gtasks', 'gcal', 'paste'].includes(L.type) ? gtHTML(enter) : L.type === 'add' ? addHTML(enter) : L.type === 'look' ? lookHTML(enter) : L.type === 'record' ? recordHTML(rec, enter) : detailHTML(t, enter));
  autosizeAll(el);
}
const sheetOpen = (enter, label) => `<section class="sheet${enter ? ' enter' : ''}" role="dialog" aria-modal="true" aria-label="${esc(label)}">`;
const sheetHead = title => `<div class="sheet-head"><h2>${esc(title)}</h2><button class="icon-btn" data-act="close-layer" aria-label="Close">${ICON.x}</button></div>`;

/* ----- the due date picker, for a new task or the one that's open ----- */
// Paced draws this itself because a browser's date box reports half-typed dates, and its calendar closes when the sheet redraws.
const dueValue = () => state.layer?.type === 'add' ? state.draft?.due : state.tasks.get(state.layer?.id)?.due;
const monthKey = (month, n = 0) => { const d = keyDate(month + '-01'); d.setMonth(d.getMonth() + n); return dateKey(d).slice(0, 7); };

function calHTML(due) {
  const today = dateKey(), { month } = state.duePick, first = keyDate(month + '-01');
  const count = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
  const days = Array.from({ length: count }, (_, i) => `${month}-${pad(i + 1)}`);
  const tabStop = days.includes(due) ? due : days.includes(today) ? today : days[0]; // arrow keys move around the rest
  const quick = [['Today', today], ['Tomorrow', addDays(today, 1)], ['In a week', addDays(today, 7)]];
  return `<div class="cal">
    <div class="chips">${quick.map(([label, k]) => `<button type="button" class="chip" data-act="due-set" data-v="${k}">${label}</button>`).join('')}</div>
    <div class="cal-head">
      <button type="button" class="icon-btn" data-act="due-month" data-v="-1" aria-label="Previous month">${ICON.back}</button>
      <span aria-live="polite">${first.toLocaleDateString(undefined, { month: 'long', year: 'numeric' })}</span>
      <button type="button" class="icon-btn cal-next" data-act="due-month" data-v="1" aria-label="Next month">${ICON.back}</button>
    </div>
    <div class="cal-grid">
      ${Array.from({ length: 7 }, (_, i) => `<span class="cal-dow">${keyDate(addDays('2023-01-01', i)).toLocaleDateString(undefined, { weekday: 'narrow' })}</span>`).join('')}
      ${'<span></span>'.repeat(first.getDay())}
      ${days.map((k, i) => `<button type="button" class="cal-day${k === due ? ' on' : ''}${k === today ? ' today' : ''}${k < today ? ' past' : ''}" data-act="due-set" data-v="${k}" aria-label="${esc(fmtFullDay(k))}" aria-pressed="${k === due}" tabindex="${k === tabStop ? 0 : -1}">${i + 1}</button>`).join('')}
    </div>
  </div>`;
}

function dueFieldHTML() {
  const due = dueValue(), soon = due && dueInfo({ due })?.cls;

      <button type="button" id="due-toggle" class="text-input due-btn${due ? '' : ' none'}" data-act="due-toggle" aria-expanded="${!!state.duePick}">${ICON.calendar}${due ? esc(fmtFullDay(due)) : 'Pick a date'}</button>

// Only the picker redraws, so the sheet keeps its place and anything half-typed.
function renderDue(focus) {

}
function setDue(k) {

}
function moveDueFocus(k) {

}

// Step names wrap onto more lines instead of getting cut off.
function autosize(el) { el.style.height = 'auto'; el.style.height = (el.scrollHeight + 2) + 'px'; }
function autosizeAll(root) { root.querySelectorAll('textarea.step-title').forEach(autosize); }
window.addEventListener('resize', () => { autosizeAll($('#layer')); autosizeAll($('#focus')); });

/* ----- the summary at the end of a session ----- */
function recordTotals(rec) {
  const sum = type => rec.events.filter(e => e.type === type).reduce((a, e) => a + (e.took ?? (e.end - e.at) / 1000), 0);
  return { worked: sum('done') + sum('aside'), breaks: sum('break'), paused: sum('pause'), idle: sum('gap'), done: rec.events.filter(e => e.type === 'done').length, ticked: rec.events.filter(e => e.type === 'ticked').length };
}

function eventText(e) {
  const len = fmtDur((e.end - e.at) / 1000);
  switch (e.type) {
    case 'done': return `${e.title}${e.est ? `, planned ${fmtMin(e.est)}` : ''}, took ${fmtDur(e.took)}`;
    case 'aside': return `${{ skip: 'Skipped', switch: 'Switched away from' }[e.why] || 'Stopped'} ${e.title} after ${fmtDur(e.took)}`;
    case 'extend': return `Added ${fmtMin(e.min)} to ${e.title}`;
    case 'split': return `Split ${e.title}, leaving ${e.rest}`;
    case 'pause': return e.away ? `Away for ${len}` : e.stopped ? `Timer stopped for ${len}` : `Paused for ${len}${e.idle ? ' (idle)' : ''}`;
    case 'break': return `Break, ${len}`;
    case 'gap': return `Nothing running for ${len}`;
    case 'checkin': return 'Answered “Still working?”';
    case 'ticked': return `Ticked off ${e.title}, no time recorded`;
  }
  return '';
}

function recordHTML(rec, enter) {
  const sum = recordTotals(rec), day = dateKey(new Date(rec.startedAt));
  const totals = [`${fmtDur(sum.worked)} worked`, `${sum.done} ${sum.done === 1 ? 'step' : 'steps'} done`];
  if (sum.breaks >= 60) totals.push(`${fmtDur(sum.breaks)} break`);
  if (sum.paused >= 60) totals.push(`${fmtDur(sum.paused)} paused`);
  return `${sheetOpen(enter, 'Your session')}${sheetHead('Your session')}
    <p class="sub">${day === dateKey() ? '' : esc(fmtDayShort(day)) + ', '}${fmtTime(rec.startedAt)} to ${fmtTime(rec.endedAt)}</p>
    <p class="record-total">${esc(totals.join(' · '))}</p>
    <ol class="record">${rec.events.map(e => `<li><time>${fmtTime(e.at)}</time><span>${esc(eventText(e))}</span></li>`).join('')}</ol>
    <label class="label" for="record-note">Note <span class="muted">(optional)</span></label>
    <textarea id="record-note" class="text-input" rows="2" maxlength="500" placeholder="What got done, or what got in the way?">${esc(rec.note || '')}</textarea>
    <div class="sheet-foot"><span></span><button class="btn primary" data-act="close-layer">Done</button></div>
  </section>`;
}

/* ----- history: past sessions, and when you work best ----- */
const SPEED_MIN_STEPS = 4; // fewer steps than this in a group is too little to compare
const SPEED_CLEAR_GAP = 5; // points between two groups before one counts as faster

// Timed steps with a fair time to compare. Steps from before records began have no session to go with them.
function speedSamples() {
  const recs = [...state.records.values()], first = Math.min(Infinity, ...recs.map(r => r.startedAt)), out = [];
  for (const r of recs) {
    let rested = r.startedAt;
    for (const e of r.events) {
      if (e.type === 'break') rested = e.end;
      if (e.type === 'done' && e.est && !e.noSpeed && e.took >= 30) out.push({ at: e.at, est: e.est, took: e.took, sinceBreak: (e.at - rested) / 60e3 });
    }
  }
  for (const t of state.tasks.values())
    for (const st of t.steps)
      if (st.done && st.est && st.actual >= 30 && st.doneAt < first) out.push({ at: st.doneAt - st.actual * 1000, est: st.est, took: st.actual, sinceBreak: null });
  return out;
}
const samplePace = x => clamp(x.est * 60 / x.took, 0.25, 3);

function speedGroups(samples, labels, pick) {
  return labels.map((label, i) => {
    const paces = samples.filter(x => pick(x) === i).map(samplePace);
    return { label, steps: paces.length, speed: paces.length ? Math.round(median(paces) * 100) : null };
  }).filter(g => g.steps);
}
const dayPart = x => { const h = new Date(x.at).getHours(); return h >= 5 && h < 12 ? 0 : h >= 12 && h < 17 ? 1 : h >= 17 && h < 22 ? 2 : 3; };
const weekDay = x => (new Date(x.at).getDay() + 6) % 7;
const breakStretch = x => x.sinceBreak == null ? -1 : Math.min(3, Math.floor(x.sinceBreak / 30));
const WEEK_DAYS = [0, 1, 2, 3, 4, 5, 6].map(i => new Date(2024, 0, 1 + i).toLocaleDateString(undefined, { weekday: 'short' })); // Jan 1, 2024 was a Monday

// One labeled bar per group. The line in each bar marks 100%, exactly as planned.
function speedBarsHTML(title, noun, groups) {
  if (!groups.length) return '';
  const ready = groups.filter(g => g.steps >= SPEED_MIN_STEPS), ranked = [...ready].sort((a, b) => b.speed - a.speed);
  const best = ranked.length >= 2 && ranked[0].speed - ranked[1].speed >= SPEED_CLEAR_GAP ? ranked[0] : null;
  const say = best ? `${best.label} is your fastest ${noun}, at ${best.speed}% of your planned speed. ${ranked[1].label} is next at ${ranked[1].speed}%.`
    : ready.length >= 2 ? 'No clear difference yet.' : 'Not enough steps to compare yet.';
  const top = Math.max(100, ...ready.map(g => g.speed));
  const rows = groups.map(g => {
    const ok = g.steps >= SPEED_MIN_STEPS;
    return `<li class="bar-row${g === best ? ' best' : ''}"><span><span class="label-text">${esc(g.label)}</span><small>${g.steps} ${g.steps === 1 ? 'step' : 'steps'}</small></span>
      <span class="bar-track" aria-hidden="true">${ok ? `<i style="width:${(g.speed / top * 100).toFixed(1)}%"></i><em style="left:${(100 / top * 100).toFixed(1)}%"></em>` : ''}</span>
      <span class="value${ok ? '' : ' muted'}">${ok ? g.speed + '%' : 'Too few'}</span></li>`;
  }).join('');
  return `<section class="panel insight"><h3>${esc(title)}</h3><p class="why">${esc(say)}</p><ul class="bars">${rows}</ul></section>`;
}

function insightsHTML() {
  const now = Date.now(), inDays = (at, n) => at >= now - n * 864e5;
  const samples = speedSamples().filter(x => inDays(x.at, 60));
  const month = [...state.records.values()].filter(r => inDays(r.startedAt, 30)).map(recordTotals);
  const add = key => month.reduce((a, t) => a + t[key], 0), worked = add('worked'), lost = add('paused') + add('idle');
  const week = [...state.records.values()].filter(r => inDays(r.startedAt, 7)).reduce((a, r) => a + recordTotals(r).worked, 0);
  const stats = [[fmtDur(week), 'worked in the last 7 days']];
  if (worked) stats.push([`${Math.round(worked / (worked + lost) * 100)}%`, 'of session time on a step, last 30 days']);
  if (samples.length) stats.push([`${Math.round(samples.filter(x => x.took <= x.est * 60).length / samples.length * 100)}%`, 'of steps done within the plan']);
  if (samples.length >= SPEED_MIN_STEPS) stats.push([`${Math.round(median(samples.map(samplePace)) * 100)}%`, 'usual speed against your plan']);
  const parts = ['Morning', 'Afternoon', 'Evening', 'Night'], stretches = ['First 30 min', '30 to 60 min', '60 to 90 min', 'Over 90 min'];
  return `<div class="stat-grid">${stats.map(([v, l]) => `<div class="stat"><b>${esc(v)}</b><span>${esc(l)}</span></div>`).join('')}</div>
    ${samples.length < SPEED_MIN_STEPS ? `<p class="help" style="margin-top:12px">Finish ${SPEED_MIN_STEPS - samples.length} more timed ${SPEED_MIN_STEPS - samples.length === 1 ? 'step' : 'steps'} to start seeing when you work best.</p>` : `
    ${speedBarsHTML('Time of day', 'time of day', speedGroups(samples, parts, dayPart))}
    ${speedBarsHTML('Day of the week', 'day', speedGroups(samples, WEEK_DAYS, weekDay))}
    ${speedBarsHTML('After a break', 'stretch after a break', speedGroups(samples, stretches, breakStretch))}
    <p class="help" style="margin-top:12px">100% means steps take exactly as long as you planned, and higher is faster. This compares your time with your own guesses over the last 60 days, so easy work can make a time look better than it is.</p>`}`;
}

function sessionRowHTML(r) {
  const sum = recordTotals(r), parts = [];
  if (sum.worked >= 60) parts.push(`${fmtDur(sum.worked)} worked`);
  if (sum.done) parts.push(`${sum.done} ${sum.done === 1 ? 'step' : 'steps'} done`);
  if (sum.ticked) parts.push(`${sum.ticked} ticked off`);
  return `<li><button class="session" data-act="open-record" data-id="${esc(r.id)}"><b>${fmtTime(r.startedAt)} to ${fmtTime(r.endedAt)}</b>
    <span>${esc(parts.join(' · ') || 'Under a minute')}</span>${r.note ? `<span>${esc(r.note)}</span>` : ''}</button></li>`;
}

function historyPageHTML() {
  const list = [...state.records.values()].sort((a, b) => b.startedAt - a.startedAt);

  const days = new Map();
  for (const r of list) { const k = dateKey(new Date(r.startedAt)); days.set(k, [...(days.get(k) || []), r]); }
  return `${head}<p class="sub">${list.length ? 'When you work best, and what you’ve done' : 'Nothing here yet'}</p>
    ${insightsHTML()}
    <h2 class="section-head">Past sessions</h2>
    ${list.length ? [...days].map(([k, rs]) => `<h3 class="session-day">${esc(fmtDayShort(k))}</h3><ul class="sessions">${rs.map(sessionRowHTML).join('')}</ul>`).join('') : '<p class="help" style="margin-top:8px">Each session you finish will show up here.</p>'}
    ${savedLine()}`;
}

/* ----- new task ----- */
function draftStepsHTML() {
  const steps = state.draft.steps;
  if (!steps.length) return '';
  return `<ol class="steps">${steps.map((s, i) => `<li class="step">
    <span class="num">${i + 1}</span>

function draftTotal() {
