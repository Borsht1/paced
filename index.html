/* ----- task details ----- */
function detailSummary(t) {
  const total = t.steps.length, left = stepsLeft(t).length, min = minLeft(t);
  if (!total) return 'No steps yet';
  if (!left) return `All ${total} steps done`;
  return `${total - left} of ${total} steps done${min ? ` · about ${fmtMin(min)} left` : ''}`;
}
const missingMinutes = t => t.steps.some(s => !s.done && !s.est);

function planRowHTML(t) {
  const item = dayPlan().items.find(i => i.taskId === t.id), b = layoutDay().blocks.find(x => x.task.id === t.id);
  if (!item) return `<button class="btn ghost small" data-act="plan-on" data-id="${t.id}">Add to today</button>`;
  return `<span class="muted">${b && b.pieces[0].late ? 'Doesn’t fit today' : b ? `Planned for ${clockAt(b.start)}` : 'On today’s timeline'}</span>
    <button class="btn ghost small" data-act="plan-off" data-id="${item.id}">Take off today</button>`;
}

function detailHTML(t, enter) {
  const live = state.meta.session?.active;
  const rows = t.steps.map(s => {
    const isLive = live && live.stepId === s.id;
    let sub = '';
    if (s.done && s.actual) sub = `<span class="took">Took <label class="min-field"><input type="number" min="1" max="600" inputmode="numeric" data-field="actual" data-step="${s.id}" value="${Math.max(1, Math.round(s.actual / 60))}" aria-label="Minutes ${esc(s.title)} really took"><span>min</span></label>${s.est ? ` (planned ${fmtMin(s.est)})` : ''}</span>`;
    else if (isLive) sub = '<span class="took live">Timing now</span>';
    else if (s.spent) sub = `<span class="took">${fmtDur(s.spent)} done so far</span>`;
    const label = s.done ? 'Mark as not done' : 'Mark as done';
    return `<li class="step${s.done ? ' done' : ''}${isLive ? ' live' : ''}">
      <button class="check sm${s.done ? ' on' : ''}" data-act="toggle-step" data-id="${t.id}" data-step="${s.id}" aria-pressed="${s.done}" title="${label}" aria-label="${label}: ${esc(s.title)}"><span>${ICON.check}</span></button>
      <div class="step-main">
        <textarea class="step-title" rows="1" id="st-${s.id}" data-field="title" data-step="${s.id}" aria-label="Step name">${esc(s.title)}</textarea>
        ${sub}
      </div>
      <label class="min-field"><input type="number" id="sm-${s.id}" min="1" max="600" inputmode="numeric" data-field="est" data-step="${s.id}" value="${s.est ?? ''}" aria-label="Minutes for ${esc(s.title)}"><span>min</span></label>
      <button class="icon-btn" data-act="delete-step" data-id="${t.id}" data-step="${s.id}" title="Delete step" aria-label="Delete step: ${esc(s.title)}">${ICON.trash}</button>
    </li>`;
  }).join('');
  let primary = '';
  if (state.focusOpen) primary = '<button class="btn primary" data-act="close-layer">Done</button>';
  else if (stepsLeft(t).length) primary = `<button class="btn primary" data-act="focus-task" data-id="${t.id}">${ICON.play}Start working</button>`;
  return `${sheetOpen(enter, 'Task')}
    <div class="sheet-head">
      <label class="title-wrap" title="Rename task"><input id="detail-title" class="title-edit" value="${esc(t.title)}" aria-label="Task name"><span class="pencil">${ICON.edit}</span></label>
      <button class="icon-btn" data-act="close-layer" aria-label="Close">${ICON.x}</button>
    </div>
    <p class="sub" id="detail-sum">${detailSummary(t)}</p>
    <label class="label" for="due-toggle">Due date <span class="muted">(optional)</span></label>
    <div id="due-field">${dueFieldHTML()}</div>
    <h3 class="label">Today</h3>
    <div class="due-row">${planRowHTML(t)}</div>
    <h3 class="label">Steps</h3>
    <p class="help">${t.steps.length ? 'Tap a step’s name or minutes to change them. Check a step off when it’s finished.' : 'No steps yet. Add the first one below.'}</p>
    ${t.steps.length ? `<ol class="steps">${rows}</ol>` : ''}
    <form class="step-add" id="detail-add">
      <input id="detail-step" class="text-input" placeholder="New step name" autocomplete="off" aria-label="New step name">
      <label class="min-field"><input id="detail-min" type="number" min="1" max="600" inputmode="numeric" aria-label="Minutes for the new step"><span>min</span></label>
      <button type="submit" class="btn small">${ICON.plus}Add</button>
    </form>
    <p class="tip" id="detail-tip"${missingMinutes(t) ? '' : ' hidden'}>Tip: give every step a number of minutes. Paced uses them to tell when you’re slowing down.</p>
    <div class="sheet-foot">
      <button class="btn danger" data-act="delete-task" data-id="${t.id}">${ICON.trash}Delete task</button>
      ${primary}
    </div>
  </section>`;
}

/* ---------- working screen ---------- */
function renderFocus() {
  const el = $('#focus');
  if (!state.focusOpen || !state.ready) {
    el.hidden = true; el.innerHTML = '';
    document.body.classList.toggle('locked', !!state.layer);
    return;
  }
  const ae = document.activeElement;
  if (!el.hidden && ae && el.contains(ae) && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA')) return;
  el.hidden = false;
  document.body.classList.add('locked');
  el.innerHTML = `<div class="focus-in">${focusBody()}</div>`;
  autosizeAll(el);
}

const focusTaskId = () => { const s = state.meta.session; return s ? (s.active ? s.active.taskId : s.taskId) : null; };

function fbar(title, withStop) {
  return `<div class="fbar">
    <button class="btn ghost small" data-act="focus-min">${ICON.back}Back</button>
    <span class="fbar-title">${esc(title || '')}</span>
    <span class="fbar-end">${popOutButton('ghost')}${withStop ? '<button class="btn ghost small" data-act="end-session">Stop working</button>' : ''}</span>
  </div>`;
}

function focusBody() {
  const m = state.meta, s = m.session;
  if (m.brk) return fbar('', false) + breakHTML();
  if (state.ask?.type === 'history') return fbar(state.tasks.get(state.ask.taskId)?.title, false) + historyHTML();
  if (!s) return fbar('', false) + pickHTML(null, true);
  const title = state.tasks.get(focusTaskId())?.title;
  if (state.ask?.type === 'estimate') return fbar(title, true) + estimateHTML();
  const pick = state.ask?.type === 'method' ? methodPickHTML(s) : '';
  if (s.active) return fbar(title, true) + pick + runningHTML();
  return fbar(title, true) + pick + betweenHTML();
}

function methodPickHTML(s) {
  const cur = methodOf(s).id;
  return `<section class="ask-card">
    <div class="eyebrow">How do you want to work?</div>
    <h2>Pick a method</h2>
    <p>Try each one for a few sessions. Paced compares how fast you work with each, so you can see what suits you.</p>
    <div class="methods">${METHODS.map(x => `<button class="method-opt${x.id === cur ? ' on' : ''}" data-act="method-pick" data-v="${x.id}" aria-pressed="${x.id === cur}"><b>${esc(x.name)}</b><span>${esc(x.short)}</span></button>`).join('')}</div>
    <div class="row"><button class="btn ghost" data-act="method-cancel">Keep the one I’m using</button></div>
  </section>`;
}

function historyHTML() {
  return `<section class="ask-card">
    <div class="eyebrow">Before you start</div>
    <h2>Have you already been working for a while?</h2>
    <p>This helps Paced know how fresh you are.</p>
    <div class="chips">
      <button class="chip" data-act="history" data-min="0">No, I’m just starting</button>
      <button class="chip" data-act="history" data-min="30">Yes, about 30 minutes</button>
      <button class="chip" data-act="history" data-min="60">Yes, an hour or more</button>
    </div>
  </section>`;
}

function estimateHTML() {
  const t = state.tasks.get(state.ask.taskId), st = findStep(state.ask.taskId, state.ask.stepId);
  if (!t || !st) { state.ask = null; return betweenHTML(); }
  return `<section class="ask-card">
    <div class="eyebrow">Step ${t.steps.indexOf(st) + 1} of ${t.steps.length}</div>
    <h2>How many minutes do you think “${esc(st.title)}” will take?</h2>
    <p>A guess is fine. Paced compares it with the real time to see if you’re slowing down.${extraPct() ? ` Heads up: your steps usually take about ${extraPct()}% longer than you guess.` : ''}</p>
    <div class="chips">${[5, 10, 15, 20, 30, 45, 60].map(n => `<button class="chip" data-act="est-pick" data-min="${n}">${fmtMin(n)}</button>`).join('')}</div>
    <form class="est-custom" id="est-form">
      <span class="muted">Or type a number:</span>
      <label class="min-field"><input id="est-input" type="number" min="1" max="600" inputmode="numeric" aria-label="Minutes"><span>min</span></label>
      <button class="btn small" type="submit">${ICON.play}Start</button>
    </form>
  </section>`;
}

function planLine(el, target, paused) {
  if (target == null) return 'No time planned for this step';
  if (el > target) return `${fmtMin(Math.max(1, Math.floor((el - target) / 60)))} over the ${fmtMin(target / 60)} you planned`;
  return `Planned: ${fmtMin(target / 60)}${paused ? '' : ` · done by ${fmtTime(Date.now() + (target - el) * 1000)}`}`;
}

// What to suggest once a break is due. When Paced picks the moment: a normal break, or, when a deadline is close, switching
// to the urgent task (or a short break if you're already on it). With a timed method: its break or switch.
function breakPlan(as, s, ignoreSnooze) {
  if (!ignoreSnooze && Date.now() < (s.snoozeUntil || 0)) return null;
  const planned = dueBreak();
  if (planned) return { type: 'break', min: planned.brk, planned: true };
  if (plannedBreakSoon()) return null; // the break you planned comes before any Paced would suggest
  const method = methodOf(s);
  if (method.work) {
    if (sinceMark(as, s) < method.work) return null;
    if (method.id === 'rotate') {
      const other = switchTarget(focusTaskId());
      return other && as.workMin < 90 ? { type: 'switch', other, rotate: true } : { type: 'break', min: 5 };
    }
    return { type: 'break', min: method.id === 'pomodoro' ? pomodoroBreakMin() : method.brk };
  }
  if (as.kind !== 'now') return null;
  const tight = tightTask();
  if (!tight) return { type: 'break' };
  return tight.id === focusTaskId() ? { type: 'short', tight } : { type: 'switch', tight, other: tight };
}

function statusHTML(as, s) {
  const method = methodOf(s), bp = breakPlan(as, s);
  let kind = as.kind, title = as.title, why = as.why, buttons = '';
  if (!bp && breakPlan(as, s, true)) {
    kind = 'soon'; title = 'Break pushed back';
    why = `Paced will remind you in ${fmtMin(Math.ceil((s.snoozeUntil - Date.now()) / 60e3))}.`;
  } else if (method.work && !bp) {
    const left = Math.max(1, Math.ceil(method.work - sinceMark(as, s)));
    kind = as.kind === 'learning' ? 'learning' : 'go'; title = 'Keep going';
    why = `${method.id === 'rotate' ? 'Switch tasks' : `${method.name}: break`} in ${fmtMin(left)}.${as.from === 'pace' ? ` You’re at ${as.eff}% of your starting speed.` : ''}`;
  }
  if (bp && bp.type === 'switch') {
    kind = 'switch'; title = 'Switch tasks for a bit';
    if (bp.rotate) why = `You’ve done ${fmtMin(method.work)} on this. Time to switch to “${bp.other.title}”, then come back.`;
    else why += ` ${bp.tight.title} ${dueWords(bp.tight)}, so instead of a full break, switch over to it for a change of pace.`;
    buttons = `<button class="btn primary" data-act="switch-task" data-id="${bp.other.id}">${ICON.swap}Switch to ${esc(bp.other.title)}</button>
      <button class="btn ghost" data-act="take-break" data-min="5" data-force="1">5-minute break instead</button>`;
  } else if (bp && bp.type === 'short') {
    why += ` ${bp.tight.title} ${dueWords(bp.tight)}, so keep the break short.`;
    buttons = `<button class="btn primary" data-act="take-break" data-min="5" data-force="1">${ICON.cup}Start a 5-minute break</button>`;
  } else if (bp) {
    const min = bp.min || as.breakMin;
    kind = 'now';
    if (bp.planned) { title = 'Break time'; why = `You planned a ${min}-minute break for now.`; }
    else if (method.work) { title = 'Break time'; why = `You’ve done ${fmtMin(method.work)} of focused work. Time for a ${min}-minute break.`; }
    else why += ' A short rest will help you get back up to speed.';
    buttons = `<button class="btn primary" data-act="take-break" data-min="${min}" data-force="1">${ICON.cup}Start a ${min}-minute break</button>`;
  }
  if (bp) buttons += '<button class="btn ghost" data-act="keep-going">Not now</button>';
  return `<section class="panel status ${kind}">
    <div class="eyebrow">How you’re doing</div>
    <div class="status-head">
      <h3><span class="dot" aria-hidden="true"></span>${title}</h3>
      ${as.from === 'pace' ? `<span class="pct">${as.eff}%<small>efficiency</small></span>` : ''}
    </div>
    <p class="why">${esc(why)}</p>
    ${buttons ? `<div class="row">${buttons}</div>` : ''}
    <p class="worked">Worked since your last break: <b>${fmtMin(as.workMin)}</b></p>
    <p class="worked">Method: <b>${esc(method.name)}</b> · <button class="link small" data-act="method-open">Change</button></p>
    <details class="how"${state.howOpen ? ' open' : ''}>
      <summary>How does Paced decide?</summary>
      <p>Paced compares how long each step really takes with the minutes you planned. Your first two steps after a break set your starting speed. With “Break when you slow down”, if you drop below 90% of that speed, or work for 90 minutes straight, Paced suggests a break of about a fifth of the time you’ve worked (5 to 20 minutes). When something is due today or tomorrow, it suggests switching to that task instead, since a change of task can refresh you without losing time. If you’re already on it, it suggests a short break. The other methods use fixed times instead.</p>
    </details>
  </section>`;
}

// The "Take a break" button, or the push-back when you ask for a break you don't need yet.
function breakArea(as, s) {
  if (state.ask?.type === 'breakcheck') {
    const tight = tightTask();
    const facts = [`You’ve worked ${fmtMin(as.workMin)}`];
    if (as.from === 'pace') facts.push(`you’re at ${as.eff}% of your starting speed`);
    return `<section class="ask-card warn">
      <div class="eyebrow">Are you sure?</div>
      <h2>You don’t need a break yet</h2>
      <p>${esc(facts.join(' and '))}. Stopping now usually costs more focus than it gives back${tight ? `, and ${esc(tight.title)} ${dueWords(tight)}` : ''}. ${methodOf(s).work ? `Your next break comes in ${fmtMin(Math.max(1, Math.ceil(methodOf(s).work - sinceMark(as, s))))}.` : s.active ? 'Try finishing this step first.' : 'Try one more step first.'}</p>
      <div class="row"><button class="btn primary big" data-act="break-no">Keep going</button></div>
      <button class="link small" data-act="break-yes" data-min="${state.ask.min}">Take the break anyway</button>
    </section>`;
  }
  if (breakPlan(as, s)) return '';
  return `<div class="row"><button class="btn ghost" data-act="take-break" data-min="${as.breakMin}">${ICON.cup}Take a break</button></div>`;
}

// Every step of the task: switch to any of them, or edit them right here.
function stepsPanelHTML(t, s) {
  const a = s.active, editing = state.fEdit, skipped = new Set(s.skipped || []);
  const rows = t.steps.map((st, i) => {
    const isNow = !!a && a.stepId === st.id;
    if (editing) return `<li class="fstep editing${isNow ? ' now' : ''}">
      <span class="num">${i + 1}</span>
      <div class="fstep-edit">
        <textarea class="step-title" rows="1" data-fedit="title" data-step="${st.id}" aria-label="Step ${i + 1} name">${esc(st.title)}</textarea>
        <div class="fstep-tools">
          <label class="min-field"><input type="number" min="1" max="600" inputmode="numeric" data-fedit="est" data-step="${st.id}" value="${st.est ?? ''}" aria-label="Minutes for step ${i + 1}"><span>min</span></label>
          <span class="row-actions">
            <button class="icon-btn" data-act="fstep-move" data-step="${st.id}" data-v="-1" aria-label="Move step ${i + 1} up"${i === 0 ? ' disabled' : ''}>${ICON.up}</button>
            <button class="icon-btn" data-act="fstep-move" data-step="${st.id}" data-v="1" aria-label="Move step ${i + 1} down"${i === t.steps.length - 1 ? ' disabled' : ''}>${ICON.down}</button>
            <button class="icon-btn" data-act="fstep-del" data-step="${st.id}" aria-label="Delete step ${i + 1}">${ICON.trash}</button>
          </span>
        </div>
      </div>
    </li>`;
    let sub;
    if (st.done) sub = st.actual ? `Took ${fmtDur(st.actual)}` : 'Done';
    else if (isNow) sub = '<span class="now-tag">Working on this now</span>';
    else sub = esc([st.est ? fmtMin(st.est) : 'No time set', st.spent ? `${fmtDur(st.spent)} done so far` : '', skipped.has(st.id) ? 'Skipped for now' : ''].filter(Boolean).join(' · '));
    const action = !st.done && !isNow ? `<button class="btn ghost small" data-act="switch-step" data-step="${st.id}">${a ? 'Switch to this' : 'Start'}</button>` : '';
    return `<li class="fstep${st.done ? ' done' : ''}${isNow ? ' now' : ''}"><span class="num">${st.done ? ICON.check : i + 1}</span>
      <div class="fstep-main"><b>${esc(st.title)}</b><span class="muted">${sub}</span></div>${action}</li>`;
  }).join('');
  return `<section class="panel steps-panel">
    <div class="panel-head"><h3>Steps</h3><button class="link small" data-act="fedit-toggle">${editing ? 'Done editing' : ICON.edit + 'Edit steps'}</button></div>
    <ol class="fsteps">${rows}</ol>
    ${editing ? `<form class="step-add" id="fstep-add">
      <input id="fstep-name" class="text-input" placeholder="New step name" autocomplete="off" aria-label="New step name">
      <label class="min-field"><input id="fstep-min" type="number" min="1" max="600" inputmode="numeric" aria-label="Minutes for the new step"><span>min</span></label>
      <button type="submit" class="btn small">${ICON.plus}Add</button>
    </form>` : ''}
  </section>`;
}

function splitHTML(st, el) {
  const ask = state.ask;
  const name = ask.name ?? `${st.title} (rest)`;
  const min = ask.min ?? (st.est ? Math.max(5, st.est - Math.round(el / 60)) : 15);
  return `<section class="ask-card">
    <div class="eyebrow">Split this step</div>
    <h2>Save what’s left as a new step</h2>
    <p>What you’ve done so far (${fmtMin(el / 60)}) counts as finished, and the rest becomes the next step.</p>
    <form class="split-form" id="split-form">
      <label class="label" for="split-name">What’s left to do?</label>
      <input id="split-name" class="text-input" value="${esc(name)}" autocomplete="off">
      <div class="row">
        <label class="min-field"><input id="split-min" type="number" min="1" max="600" inputmode="numeric" value="${min}" aria-label="Minutes for what’s left"><span>min</span></label>
        <button type="submit" class="btn primary">Split it</button>
        <button type="button" class="btn ghost" data-act="split-cancel">Cancel</button>
      </div>
    </form>
  </section>`;
}

// What more time on this step costs the rest of today.
function planCostHTML() {
  const lay = layoutDay(), next = lay.blocks.find(b => !b.item.front);
  if (!next) return '';
  const spare = Math.max(0, Math.floor(lay.freeMin - lay.planMin));
  const room = lay.lateMin >= 1 ? `Today’s plan is ${fmtMin(lay.lateMin)} over your hours.` : `You have ${spare ? fmtMin(spare) : 'no time'} to spare today.`;
  return `<p>Next up is “${esc(next.task.title)}” at ${clockAt(next.start)}. ${room}</p>`;
}

// The stop at the planned end of a step: you decide what happens next instead of drifting on.
function timeUpHTML(s, st, canSkip, target) {
  const a = s.active, as = assess(state.meta);
  if (state.ask.view === 'stuck') return `<section class="ask-card warn">
      <div class="eyebrow">Stuck</div>
      <h2>What would help?</h2>
      <div class="chips">
        <button class="chip" data-act="take-break" data-min="${as.breakMin}" data-force="1">Take a ${as.breakMin}-minute break</button>
        ${canSkip ? '<button class="chip" data-act="skip-step">Skip it for now</button>' : ''}
        <button class="chip" data-act="split-open">Split this step</button>
      </div>
      <div class="ask-links"><button class="link small" data-act="timeup-back">Back</button></div>
    </section>`;
  const why = a.autoStopped ? `You didn’t answer for ${AUTO_STOP_MIN} minutes, so the timer stopped there.`
    : a.extended ? 'Your extra time is up.' : `You planned ${fmtMin(target / 60)} for this step.`;
  const more = a.extended
    ? `<p>You’ve already added time once. Save what’s left as a new step so your plan stays real.</p>
      <div class="chips"><button class="chip" data-act="split-open">Split this step</button></div>`
    : `<div class="chips">${[5, 10, 15].map(n => `<button class="chip" data-act="extend" data-min="${n}">${n} more min</button>`).join('')}</div>`;
  return `<section class="ask-card warn">
      <div class="eyebrow">Time’s up</div>
      <h2>${a.autoStopped ? 'Paced stopped your timer' : 'Did you finish?'}</h2>
      <p>${esc(why)}</p>
      ${planCostHTML()}
      <div class="row"><button class="btn primary" data-act="step-done">${ICON.check}Yes, it’s done</button></div>
      <h3 class="label">Not yet?</h3>
      ${more}
      <div class="ask-links">
        <button class="link small" data-act="timeup-stuck">I’m stuck</button>
        <button class="link small" data-act="timeup-forgot">I forgot the timer</button>
      </div>
    </section>`;
}

function forgotHTML(target) {
  const min = state.ask.min ?? Math.max(1, Math.round(target / 60));
  return `<section class="ask-card warn">
      <div class="eyebrow">Fix the time</div>
      <h2>How long did you really work on this?</h2>
      <p>Paced will use this number instead of the timer, and this step won’t count toward your speed.</p>
      <form class="split-form" id="forgot-form">
        <div class="row">
          <label class="min-field"><input id="forgot-min" type="number" min="1" max="600" inputmode="numeric" value="${min}" aria-label="Minutes you really worked"><span>min</span></label>
          <button type="submit" class="btn primary">Save, it’s done</button>
          <button type="button" class="btn ghost" data-act="forgot-go">Save, keep going</button>
        </div>
      </form>
      <div class="ask-links"><button class="link small" data-act="timeup-back">Back</button></div>
    </section>`;
}

function awayHTML(st) {
  return `<section class="ask-card warn">
      <div class="eyebrow">Welcome back</div>
      <h2>You were away for ${fmtDur(state.ask.sec)}</h2>
      <p>Paced stopped the timer when you left, so this time isn’t counted. Were you working on “${esc(st.title)}” that whole time?</p>
      <div class="chips">
        <button class="chip" data-act="away-keep">Yes, add it back</button>
        <button class="chip" data-act="away-drop">No, leave it off</button>
      </div>
    </section>`;
}

function runningHTML() {
  const m = state.meta, s = m.session, a = s.active;
  const t = state.tasks.get(a.taskId), st = findStep(a.taskId, a.stepId);
  if (!t || !st) return betweenHTML();
  const idx = t.steps.indexOf(st) + 1, el = elapsedSec(a), paused = !!a.pausedAt;
  const as = assess(m);
  const target = targetSec(a, st);
  const pct = target ? Math.min(100, el / target * 100) : 0;
  const over = target != null && el > target;
  const canSkip = !!nextStep(t, s, st.id);
  const hero = `<div class="eyebrow">Step ${idx} of ${t.steps.length}${paused ? (a.idlePaused ? ' · Paused while you’re idle' : ' · Paused') : ''}</div>
    <h2 class="step-name">${esc(st.title)}</h2>
    <div class="timer${paused ? ' paused' : ''}${over ? ' over' : ''}" data-tick="timer" role="timer" aria-label="Time left on this step">${clockHTML(target == null ? el : target - el)}</div>
    <div class="est-line" data-tick="estline">${planLine(el, target, paused)}</div>
    ${target ? `<span class="bar" aria-hidden="true"><i data-tick="prog" class="${over ? 'over' : ''}" style="width:${pct.toFixed(1)}%"></i></span>` : ''}`;
  const type = state.ask?.type;
  if (type === 'timeup') return `<div class="hero">${hero}</div>${timeUpHTML(s, st, canSkip, target)}`;
  if (type === 'forgot') return `<div class="hero">${hero}</div>${forgotHTML(target)}`;
  if (type === 'away') return `<div class="hero">${hero}</div>${awayHTML(st)}`;
  return `<div class="hero">${hero}
    <div class="actions">
      <button class="btn primary big" data-act="step-done">${ICON.check}Done with this step</button>
      <button class="btn ghost big" data-act="step-pause">${paused ? ICON.play + 'Resume' : ICON.pause + 'Pause'}</button>
    </div>
    ${type === 'split' ? '' : `<div class="hero-more">
      ${canSkip ? `<button class="link" data-act="skip-step">${ICON.skip}Skip for now</button>` : ''}
      <button class="link" data-act="split-open">${ICON.split}Split this step</button>
    </div>`}
  </div>
  ${type === 'split' ? splitHTML(st, el) : ''}
  ${statusHTML(as, s)}
  ${stepsPanelHTML(t, s)}
  ${breakArea(as, s)}`;
}

const gapText = (plan, left) => left < 0 ? 'Nothing is running' : { step: 'Next step starts in', break: 'Your break starts in', hold: 'Pick what’s next in' }[plan.type];

// The clock between steps, so finishing a step never leaves you with nothing running.
function gapHTML(s) {
  if (!s.gap) return '';
  const plan = gapPlan(s), left = (s.gap.until - Date.now()) / 1000;
  if (plan.type === 'none') return '';
  const wait = left >= 0 && plan.type !== 'hold' ? '<button class="link small" data-act="gap-wait">Wait 5 more minutes</button>' : '';
  return `<section class="gap-clock${left < 0 ? ' over' : ''}" data-tick="gapbox">
    <div><span class="gap-text">${gapText(plan, left)}</span>${wait}</div>
    <span class="gap-time">${fmtClock(left)}</span>
  </section>`;
}

function betweenHTML() {
  const m = state.meta, s = m.session, t = state.tasks.get(s.taskId);
  const last = s.log[s.log.length - 1];
  const as = assess(m);
  const bp = breakPlan(as, s);
  let html = '';
  if (last) html += `<div class="result"><span class="check on" aria-hidden="true"><span>${ICON.check}</span></span><div><b>You finished “${esc(last.title)}”</b><span class="muted">Took ${fmtDur(last.actual)}${last.est ? ` (planned ${fmtMin(last.est)})` : ''}</span></div></div>`;
  if (state.ask?.type === 'feel') html += `<section class="ask-card">
      <div class="eyebrow">Quick question</div>
      <h2>How did that step go?</h2>
      <p>Your answer helps Paced until it has timed a couple of steps.</p>
      <div class="chips">
        <button class="chip" data-act="feel" data-v="focused">Easy</button>
        <button class="chip" data-act="feel" data-v="okay">Okay</button>
        <button class="chip" data-act="feel" data-v="struggling">Hard</button>
      </div>
    </section>`;
  html += gapHTML(s);
  if (bp) html += statusHTML(as, s);
  const next = t && !t.archived ? nextStep(t, s) : null;
  if (next) {
    html += `<section class="panel">
      <div class="eyebrow">Next step · ${t.steps.indexOf(next) + 1} of ${t.steps.length}</div>
      <h2 class="step-name">${esc(next.title)}</h2>
      <p class="muted" style="margin:0">${next.est ? `Planned: ${fmtMin(next.est)}` : 'No time planned yet. You’ll pick one when you start.'}</p>
      ${next.spent ? `<p class="muted" style="margin:0">You already spent ${fmtDur(next.spent)} on this earlier.</p>` : ''}
      <div class="row" style="margin-top:6px"><button class="btn ${bp ? 'ghost' : 'primary'} big" data-act="start-step" data-id="${t.id}" data-step="${next.id}">${ICON.play}${last ? 'Start next step' : 'Start'}</button></div>
    </section>`;
  } else {
    const plan = gapPlan(s);
    if (plan.type === 'step') html += `<section class="panel">
      <div class="eyebrow">Up next on your timeline</div>
      <h2 class="step-name">${esc(plan.t.title)}</h2>
      <p class="muted" style="margin:0">First step: ${esc(plan.next.title)} · ${fmtMin(plan.next.est)}</p>
      <div class="row" style="margin-top:6px"><button class="btn ${bp ? 'ghost' : 'primary'} big" data-act="start-step" data-id="${plan.t.id}" data-step="${plan.next.id}">${ICON.play}Start now</button></div>
    </section>`;
    const later = plan.type === 'none' && layoutDay().blocks.find(b => stepsLeft(b.task).length);
    if (later) html += `<p class="muted" style="margin:0;text-align:center">“${esc(later.task.title)}” is on your timeline for ${clockAt(later.start)}. Until then, the time is yours.</p>`;
    html += pickHTML(t, false);
  }
  if (!bp) html += statusHTML(as, s);
  if (t && !t.archived) html += stepsPanelHTML(t, s);
  html += breakArea(as, s);
  return html;
}

function pickHTML(t, noSession) {
  const planned = layoutDay().blocks.map(b => b.task);
  const others = [...planned, ...activeTasks().filter(x => !planned.includes(x))].filter(x => x.steps.some(s => !s.done));
  const head = t && t.archived
    ? `<div class="eyebrow">Task complete</div><h2 class="step-name">You finished “${esc(t.title)}”!</h2><p class="muted" style="margin:0">It’s been moved to Completed tasks.</p>`
    : '';
  const body = others.length
    ? `<h3 class="pick-q">What do you want to work on next?</h3><ul class="picklist">${others.map(x => {
        const n = x.steps.find(s => !s.done);
        return `<li><button class="pick" data-act="pick-task" data-id="${x.id}"><span><b>${esc(x.title)}</b><span class="muted">Next step: ${esc(n.title)}${n.est ? ` · ${fmtMin(n.est)}` : ''}${x.due ? ` · ${esc(dueInfo(x).text)}` : ''}</span></span><span class="pick-go">${ICON.play}Start</span></button></li>`;
      }).join('')}</ul>`
    : `<p class="muted" style="margin:0">That was everything on your list. Nice work!</p><div class="row"><button class="btn primary" data-act="${noSession ? 'focus-min' : 'end-session'}">${ICON.back}Back to my tasks</button></div>`;
  return `<section class="panel">${head}${body}</section>`;
}

function breakHTML() {
  const b = state.meta.brk, left = (b.until - Date.now()) / 1000, over = left <= 0;
  const t = b.taskId && state.tasks.get(b.taskId), next = t && !t.archived ? nextStep(t, null) : null;
  return `<div class="breakscreen">
    <div class="eyebrow">${over ? 'Break’s over' : 'Break time'}</div>
    <div class="timer${left < 0 ? ' over' : ''}" data-tick="break" role="timer" aria-label="Break time left">${clockHTML(left)}</div>
    <p class="muted">${over ? 'Time to get back. Paced will measure your speed fresh from here.' : `Stand up, stretch, and get some water. Back at ${fmtTime(b.until)}.`}</p>
    ${next ? `<p>Up next: <b>${esc(next.title)}</b>${next.est ? ` · ${fmtMin(next.est)}` : ''}</p>` : ''}
    <button class="btn ${over ? 'primary' : 'ghost'} big" data-act="end-break">${over ? ICON.play + 'Back to work' : 'I’m ready, start now'}</button>
  </div>`;
}

/* ---------- toast ---------- */
let toastTimer = null, toastAction = null;
function toast(msg, actLabel, fn) {
  const el = $('#toast');
  el.innerHTML = `<span>${esc(msg)}</span>${actLabel ? `<button class="toast-act">${esc(actLabel)}</button>` : ''}`;
  el.hidden = false;
  toastAction = fn || null;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, fn ? 7000 : 3800);
}
function hideToast() { $('#toast').hidden = true; toastAction = null; }

/* ---------- alerts: reaching you when you're not looking at Paced ---------- */
const Alert = {
  audio: null,

  // Browsers only allow sound after a tap, so this runs on every tap.
  unlock() {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!this.audio && AC) this.audio = new AC();
      if (this.audio && this.audio.state === 'suspended') this.audio.resume();
    } catch (e) {}
  },

  notifyState() {
    if (!('Notification' in window)) return 'none';
    return { granted: 'on', denied: 'blocked' }[Notification.permission] || 'ask';
  },

  askPermission() {
    if (this.notifyState() !== 'ask') return;
    try { return Notification.requestPermission(); } catch (e) {}
  },

  chime() {
    const ctx = this.audio;
    if (!ctx || ctx.state !== 'running') return;
    [[660, 0], [880, .18]].forEach(([freq, delay]) => {
      const osc = ctx.createOscillator(), gain = ctx.createGain(), t = ctx.currentTime + delay;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(.0001, t);
      gain.gain.exponentialRampToValueAtTime(.2, t + .02);
      gain.gain.exponentialRampToValueAtTime(.0001, t + .5);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t); osc.stop(t + .5);
    });
  },

  // A question you answer by clicking the notification, without leaving what you're doing.
  ask(title, body, onAnswer) {
    if (this.notifyState() !== 'on') return null;
    try {
      const n = new Notification(title, { body, tag: 'paced-check', renotify: true, requireInteraction: true });
      n.onclick = e => { e.preventDefault(); n.close(); onAnswer(); };
      if (state.meta.sound !== false) this.chime();
      return n;
    } catch (e) { return null; }
  },

  send(title, body) {
    if (state.meta.sound !== false) this.chime();
    try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {}
    if (document.visibilityState === 'visible' && document.hasFocus()) return;
    if (this.notifyState() !== 'on') return;
    try {
      const n = new Notification(title, { body, tag: 'paced', renotify: true });
      n.onclick = () => { window.focus(); n.close(); state.focusOpen = true; render(); };
    } catch (e) {} // some phones only allow notifications from an installed app
  }
};

// What alerts have gone out only matters on this device. It never goes to your account, because a tab
// holding old data would overwrite newer work on the way.
const saveAlerts = () => { if (Store.mode !== 'cloud') saveMeta(); };

// True once each time another threshold (minutes past the end) is crossed, however many were passed at once.
function dueAlert(holder, minutesOver, steps) {
  const before = holder.alerts || 0;
  let n = before;
  while (n < steps.length && minutesOver >= steps[n]) n++;
  holder.alerts = n;
  return n > before;
}

/* ---------- the mini timer: a small window that stays on top of your other apps ---------- */
// Browsers only open it from a click, and it closes with this tab. It can't open inside another page, as on claude.ai.
const canPopOut = () => 'documentPictureInPicture' in window && window.top === window;
const popOutButton = (style = '') => canPopOut() && !pip ? `<button class="btn small ${style}" data-act="pop-out">Pop out</button>` : '';
let pip = null, pipActs = null;

async function popOut() {
  if (pip || !canPopOut()) return;
  try { pip = await documentPictureInPicture.requestWindow({ width: 300, height: 104 }); }
  catch (e) { toast('Paced couldn’t open the mini timer.'); return; }
  const d = pip.document;
  if (document.documentElement.dataset.theme) d.documentElement.dataset.theme = document.documentElement.dataset.theme;
  document.querySelectorAll('style, link[rel="stylesheet"]').forEach(n => d.head.appendChild(n.cloneNode(true)));
  d.title = 'Paced';
  d.body.className = 'pip';
  d.body.innerHTML = '<div class="pip-top"><span class="mini-dot"></span><span class="mini-title"></span></div><div class="pip-row"><span class="pip-time"></span><span class="pip-acts"></span></div>';
  d.addEventListener('click', e => {
    const act = e.target.closest('[data-pip]')?.dataset.pip;
    if (act === 'done') finishStep();
    else if (act === 'pause') togglePause();
    else if (act === 'back') endBreak();
    else if (act === 'show') { state.focusOpen = !!(state.meta.session || state.meta.brk); render(); window.focus(); }
  });
  pip.addEventListener('pagehide', () => { pip = null; pipActs = null; render(); });
  pip.setInterval(tick, 1000); // browsers slow down a hidden tab's timers, but this window stays visible
  render();
}

function showPip() {
  if (!pip) return;
  const m = state.meta, a = m.session?.active, c = liveClock(), d = pip.document;
  d.body.classList.toggle('over', !!(c && c.over));
  d.querySelector('.mini-dot').classList.toggle('still', !c || !!m.brk || !!c.paused);
  d.querySelector('.mini-title').textContent = !c ? 'Nothing running' : c.label + (c.paused ? ' (paused)' : '');
  d.querySelector('.pip-time').textContent = c ? fmtClock(c.left) : '';
  const btn = (act, label) => `<button class="btn small" data-pip="${act}">${label}</button>`;
  const acts = a ? btn('done', 'Done') + (a.autoStopped ? '' : btn('pause', a.pausedAt ? 'Resume' : 'Pause'))
    : m.brk && c.over ? btn('back', 'Back to work') : btn('show', 'Open Paced');
  if (acts !== pipActs) { pipActs = acts; d.querySelector('.pip-acts').innerHTML = acts; } // only when they change, or a click can land on a replaced button
}

/* ---------- the browser extension: keeps the clock on the toolbar, and alerts you after this tab closes ---------- */
// Fixed times rather than a countdown, so the extension can carry on by itself.
function clockForExtension() {
  const m = state.meta, s = m.session, c = liveClock();
  if (!c) return null;
  const pageNotifies = Alert.notifyState() === 'on';
  const repeat = (end, steps, title, body) => steps.map(min => ({ at: end + min * 60e3, title, body }));
  if (m.brk) {
    const b = m.brk, t = b.taskId && state.tasks.get(b.taskId), next = t && !t.archived ? nextStep(t, null) : null;
    return { kind: 'break', label: c.label, endsAt: b.until, stopAt: b.until + BREAK_GIVE_UP_MIN * 60e3, pageNotifies,
      alerts: repeat(b.until, BREAK_ALERTS, 'Break’s over', next ? `Up next: ${next.title}` : 'Time to get back to work.') };
  }
  if (s.active) {
    const a = s.active, st = findStep(a.taskId, a.stepId), target = targetSec(a, st);
    if (a.pausedAt) return { kind: 'step', label: c.label, paused: !a.autoStopped, stopped: !!a.autoStopped, left: c.left, pageNotifies, alerts: [] };
    if (target == null) return { kind: 'step', label: c.label, endsAt: null, pageNotifies, alerts: [] };
    const endsAt = a.startedAt + (a.pausedMs || 0) + (target - (a.carry || 0)) * 1000;
    const stopAt = endsAt + (Math.max(target, a.okSec || 0) - target + AUTO_STOP_MIN * 60) * 1000;
    return { kind: 'step', label: c.label, endsAt, stopAt, pageNotifies, alerts: [
      ...repeat(endsAt, OVER_ALERTS, a.extended ? 'Your extra time is up' : 'Time’s up', `Did you finish “${c.label}”?`),
      { at: stopAt, title: 'Paced stopped your timer', body: `“${c.label}” ran ${AUTO_STOP_MIN} minutes over.` }
    ] };
  }
  const plan = gapPlan(s), idle = 'Start your next step, or take a break.';
  return { kind: 'gap', label: c.label, endsAt: s.gap.until, stopAt: (s.lastAt || s.gap.until) + 30 * 60e3, pageNotifies, alerts: [
    { at: s.gap.until, title: plan.type === 'break' ? 'Time for a break' : plan.type === 'step' ? `Up next: ${plan.next.title}` : 'Nothing is running', body: 'It starts by itself while Paced is open.' },
    ...repeat(s.gap.until, OVER_ALERTS.slice(1), 'Nothing is running', idle)
  ] };
}

let sharedClock = null;
function shareClock() {
  const clock = clockForExtension();
  if (clock) clock.idleMin = idleMin();
  const key = JSON.stringify(clock);
  if (key === sharedClock) return;
  sharedClock = key;
  window.postMessage({ from: 'paced-page', clock }, '*'); // to this window only, where the extension listens
}

window.addEventListener('message', e => {
  if (e.source !== window || !e.data || e.data.from !== 'paced-ext') return;
  if (e.data.hello) { sharedClock = null; extIdle = !!e.data.idle; } // the extension just arrived: send it the clock on the next tick
  else if (e.data.act === 'idle') {
    if (e.data.state === 'active') backFromIdle();
    else goIdle(e.data.state === 'locked' ? Date.now() : Date.now() - idleMin() * 60e3);
  }
  else if (e.data.act === 'done') finishStep();
  else if (e.data.act === 'pause') togglePause();
  else if (e.data.act === 'back') endBreak();
  else if (e.data.act === 'show') { state.focusOpen = true; render(); }
});

/* ---------- idle: a step stops counting when you stop using the computer, and carries on when you're back ---------- */
let extIdle = false; // the extension watches every app. Without it, Paced only sees its own window.
let lastInput = Date.now(), backWaiting = false;
let checkIn = null; // the "Still working?" notification that's waiting for you
const idleMin = () => state.meta.idleMin ?? IDLE_MIN; // 0 means off
const checkMin = () => state.meta.checkMin ?? CHECK_MIN; // 0 means off
// A phone can sit untouched beside you while you work, so only a mouse and keyboard count here.
const seesOwnInput = window.matchMedia('(pointer: fine)').matches;

// "at" is when you stopped, so the idle minutes come off the step too.
function goIdle(at) {
  const a = state.meta.session?.active;
  if (!idleMin() || !a || a.pausedAt || Date.now() < syncUntil || state.ask?.type === 'forgot') return;
  a.pausedAt = clamp(at, a.startedAt + (a.pausedMs || 0), Date.now());
  a.idlePaused = true;
  a.alerts = 0; a.okSec = 0;
  saveMeta(); render(); shareClock();
}

function backFromIdle() {
  const a = state.meta.session?.active;
  if (!a || !a.idlePaused) return;
  if (Date.now() < syncUntil) { backWaiting = true; return; } // this tab may be out of date until your account catches up
  const sec = (Date.now() - a.pausedAt) / 1000, stepId = a.stepId, from = a.pausedAt;
  if (sec > IDLE_RESUME_MIN * 60) a.idlePaused = false;
  else resumeStep(a);
  saveMeta(); render(); shareClock();
  if (a.pausedAt || sec < 60) return;
  // A thought or a phone call can look idle, so you can put the time back.
  const addBack = () => {
    const now = state.meta.session?.active;
    if (!now || now.stepId !== stepId) return;
    now.pausedMs -= sec * 1000;
    if (state.meta.run) state.meta.run.events = state.meta.run.events.filter(e => !(e.type === 'pause' && e.at === from));
    saveMeta(); render();
  };
  const say = () => toast(`Paused for ${fmtDur(sec)} while you were idle.`, 'I was working', addBack);
  if (document.visibilityState === 'visible') say();
  else document.addEventListener('visibilitychange', say, { once: true });
}

function noteInput() {
  lastInput = Date.now();
  endCheckIn();
  if (state.meta.session?.active?.idlePaused) backFromIdle();
}
['pointermove', 'pointerdown', 'keydown', 'wheel', 'focus'].forEach(n => window.addEventListener(n, noteInput, { passive: true }));
// Leaving the window means you're there. Locking the screen also blurs it, but then the extension is the one to ask.
window.addEventListener('blur', () => { if (!extIdle) noteInput(); });

function watchIdle() {
  const min = idleMin();
  if (min && !extIdle && seesOwnInput && document.hasFocus() && Date.now() - lastInput >= min * 60e3) goIdle(lastInput);
}

function endCheckIn() {
  if (!checkIn) return;
  checkIn.note.close();
  checkIn = null;
}

// In another app Paced can't see you, so it asks. Nobody answering is the only sign you've gone.
function watchCheckIn() {
  const a = state.meta.session?.active, now = Date.now();
  if (checkIn && (!a || a.stepId !== checkIn.stepId || !!a.pausedAt !== !!checkIn.paused)) endCheckIn();
  if (!a || a.pausedAt || extIdle || !idleMin() || !checkMin() || document.hasFocus()) return;
  const st = findStep(a.taskId, a.stepId), stepId = a.stepId;
  if (checkIn) {
    if (now - checkIn.at < CHECK_WAIT_MIN * 60e3) return;
    goIdle(checkIn.at);
    if (!a.idlePaused) return;
    endCheckIn();
    const note = Alert.ask(`Paused “${st.title}”`, 'No answer, so Paced paused your step. Click to carry on.', backFromIdle);
    if (note) checkIn = { note, stepId, paused: true };
    return;
  }
  const target = targetSec(a, st);
  if (target != null && target - elapsedSec(a) <= CHECK_WAIT_MIN * 60) return; // "Time's up" is about to ask anyway
  if (now - Math.max(lastInput, a.startedAt) < checkMin() * 60e3) return;
  const note = Alert.ask('Still working?', `Click to keep the timer going on “${st.title}”.`, () => { logEvent('checkin'); saveMeta(); noteInput(); });
  if (note) checkIn = { note, stepId, at: now };
}

/* ---------- actions: tasks ---------- */
function openAdd() {
  state.draft = { title: '', due: null, steps: [] };
  state.duePick = null;
  state.layer = { type: 'add' };
  renderLayer(true);
  $('#new-title').focus();
}
function openDetail(id, focusAdd) {
  state.duePick = null;
  state.layer = { type: 'detail', id };
  renderLayer(true);
  if (focusAdd) $('#detail-step').focus();
}
function closeLayer() { state.layer = null; renderLayer(); render(); }

function addDraftStep() {
  const ti = $('#draft-step'), mi = $('#draft-min');
  const title = ti.value.trim();
  if (!title) { ti.focus(); return false; }
  state.draft.steps.push({ title, est: parseMin(mi.value) });
  ti.value = ''; mi.value = '';
  renderDraftSteps();
  ti.focus();
  return true;
}

function saveNew() {
  if ($('#draft-step').value.trim()) addDraftStep();
  const title = state.draft.title.trim();
  if (!title) { $('#new-err').hidden = false; $('#new-title').focus(); return; }
  const t = {
    id: newId('t'), title, due: isKey(state.draft.due) ? state.draft.due : null, createdAt: Date.now(), archived: false, completedAt: null,
    steps: state.draft.steps.filter(s => s.title.trim()).map(s => ({ id: newId('s'), title: s.title.trim(), est: s.est || null, done: false, actual: null, doneAt: null }))
  };
  saveTask(t);
  state.layer = null; renderLayer();
  render();
  toast(`Saved “${t.title}”`);
}

function archiveToast(t, before) {
  toast(`Nice! “${t.title}” is done and moved to Completed tasks.`, 'Undo', () => { saveTask(before); render(); if (state.layer) renderLayer(); });
}
function maybeArchive(t, before) {
  if (t.archived || !t.steps.length || !t.steps.every(s => s.done)) return false;
  t.archived = true; t.completedAt = Date.now();
  archiveToast(t, before);
  return true;
}

function toggleStep(id, sid) {
  const t = state.tasks.get(id), st = t && t.steps.find(s => s.id === sid);
  if (!st) return;
  // Checking off the step you're timing is the same as pressing Done, so its time counts.
  if (state.meta.session?.active?.stepId === sid) {
    finishStep();
    if (t.archived) state.layer = null;
    renderLayer();
    return;
  }
  const before = clone(t);
  st.done = !st.done;
  st.doneAt = st.done ? Date.now() : null;
  if (!st.done) st.actual = null;
  clearActiveIf(a => a.stepId === sid);
  if (st.done) logEvent('ticked', { task: t.title, title: st.title, stepId: sid });
  else if (state.meta.run) state.meta.run.events = state.meta.run.events.filter(e => e.stepId !== sid);
  saveMeta();
  if (maybeArchive(t, before)) state.layer = null;
  saveTask(t);
  renderLayer(); render();
}

function deleteStep(id, sid) {
  const t = state.tasks.get(id); if (!t) return;
  const before = clone(t);
  t.steps = t.steps.filter(s => s.id !== sid);
  clearActiveIf(a => a.stepId === sid);
  saveTask(t);
  renderLayer(); render();
  toast('Step deleted', 'Undo', () => { saveTask(before); renderLayer(); render(); });
}

function deleteTask(id) {
  const t = state.tasks.get(id); if (!t) return;
  const before = clone(t);
  clearActiveIf(a => a.taskId === id);
  removeTask(id);
  state.layer = null; renderLayer(); render();
  toast('Task deleted', 'Undo', () => { saveTask(before); render(); });
}

function completeTask(id) {
  const t = state.tasks.get(id); if (!t) return;
  const before = clone(t);
  if (state.meta.session?.active?.taskId === id) finishStep(); // the running step keeps its time
  if (t.archived) return;
  t.steps.forEach(s => { if (!s.done) { s.done = true; s.doneAt = Date.now(); logEvent('ticked', { task: t.title, title: s.title, stepId: s.id }); } });
  saveMeta();
  t.archived = true; t.completedAt = Date.now();
  archiveToast(t, before);
  saveTask(t); render();
}

/* ---------- actions: working ---------- */
function beginSession(taskId, priorMin) {
  state.meta.session = { id: newId('ss'), startedAt: Date.now(), lastAt: Date.now(), priorMin, taskId, log: [], active: null, gap: null, snoozeUntil: 0, skipped: [], partialSec: 0, method: methodById(state.meta.method).id, markAt: 0 };
  saveMeta();
}

// Time that slipped past the plan, kept so Paced can show it back to you.
function logSlip(kind, sec) {
  if (sec < 30) return;
  const m = state.meta;
  m.slips = [...(m.slips || []), { kind, sec: Math.round(sec), at: Date.now() }].slice(-200);
}

/* ---------- the record of a session: what you did from your first step until you stop, breaks included ---------- */
const RECORDS_KEPT = 200;
// An internal session ends at every break, so the record runs alongside it in m.run.
function logEvent(type, data) {
  const m = state.meta, at = Date.now();
  if (!m.run) m.run = { id: newId('r'), startedAt: at, events: [] };
  m.run.events = [...m.run.events, { type, at, ...data }].slice(-400);
}
const logStepTime = (type, a, st, t, took, data) => logEvent(type, { at: a.startedAt, end: Date.now(), task: t.title, title: st.title, est: st.est, took: Math.round(took), ...data });
function logPause(a) {
  if (!a.pausedAt || Date.now() - a.pausedAt < 30e3) return;
  logEvent('pause', { at: a.pausedAt, end: Date.now(), idle: !!a.idlePaused, stopped: !!a.autoStopped });
}
const runEnd = events => Math.max(...events.map(e => e.end || e.at));

function saveRecord(r) {
  state.records.set(r.id, r);
  Store.write(r.id, r);
  [...state.records.values()].sort((a, b) => b.startedAt - a.startedAt).slice(RECORDS_KEPT).forEach(x => { state.records.delete(x.id); Store.write(x.id, null); });
}

function endRun() {
  const m = state.meta, run = m.run;
  if (!run) return;
  m.run = null;
  const events = [...run.events].sort((a, b) => a.at - b.at);
  while (events.length && events[events.length - 1].type === 'gap') events.pop(); // waiting after your last step isn't part of it
  if (!events.length) return;
  const rec = { id: run.id, startedAt: events[0].at, endedAt: runEnd(events), events };
  saveRecord(rec);
  if (recordTotals(rec).worked >= 60) m.recordToShow = rec.id;
}

// Sessions often end while you're gone, so the summary waits until you're back.
function showRecord() {
  const m = state.meta;
  if (!m.recordToShow || m.session || m.brk || state.layer || state.focusOpen || !state.records.has(m.recordToShow)) return;
  state.layer = { type: 'record', id: m.recordToShow };
  m.recordToShow = null;
  saveMeta();
  renderLayer(true);
}

function openGap(s, from = Date.now()) { s.gap = { until: from + GAP_SEC * 1000, alerts: 0 }; }
function closeGap(s, at = Date.now()) {
  if (s.gap) {
    logSlip('gap', (at - s.gap.until) / 1000);
    if (at - s.gap.until >= 60e3) logEvent('gap', { at: s.gap.until, end: at });
  }
  s.gap = null;
}
// What happens when the clock between steps runs out: the next step or a due break starts by itself, or it waits for you.
function gapPlan(s) {
  const t = state.tasks.get(s.taskId), as = assess(state.meta), bp = breakPlan(as, s);
  const next = t && !t.archived ? nextStep(t, s) : null;
  const after = next ? null : nextPlanned(s.taskId);
  if (!next && !switchTarget(null)) return { type: 'none' };
  if (bp && bp.type !== 'switch') return { type: 'break', min: bp.type === 'short' ? 5 : bp.min || as.breakMin };
  if (bp) return { type: 'hold' };
  // Done with this task: the timeline says what's next. Time before something you placed later is yours.
  if (after?.waits) return { type: 'none' };
  if (after) { const n = nextStep(after.task, s); return n && n.est ? { type: 'step', t: after.task, next: n } : { type: 'hold' }; }
  if (!next || !next.est) return { type: 'hold' };
  return { type: 'step', t, next };
}

function startFocus(taskId) {
  const t = state.tasks.get(taskId); if (!t) return;
  expireIdleSession(true);
  const m = state.meta, s = m.session;
  if (s && s.active) {
    state.layer = null; renderLayer();
    state.focusOpen = true; render();
    if (s.active.taskId !== taskId) toast('Finish or skip the step you’re on first.');
    return;
  }
  const next = nextStep(t, s);
  if (!next) { openDetail(taskId, true); toast(t.steps.length ? 'All steps are done. Add another step, or mark the task as done.' : 'Add a step first.'); return; }
  state.layer = null; renderLayer();
  state.focusOpen = true;
  if (m.brk) { render(); return; }
  if (!s) {
    // Ask "been working a while?" only at your first session of the day. After that Paced can tell:
    // you either only just stopped (carry on where you left off) or you've had a rest (start fresh).
    const now = Date.now(), today = dateKey();
    const sameDay = ts => !!ts && dateKey(new Date(ts)) === today;
    const stop = m.lastStop && sameDay(m.lastStop.at) ? m.lastStop : null;
    const brokeAt = sameDay(m.lastBreakEnd) ? m.lastBreakEnd : 0;
    if (stop && now - stop.at < 15 * 60e3 && brokeAt < stop.at) { beginSession(taskId, stop.workMin || 0); startStep(taskId, next.id); }
    else if (stop || brokeAt) { beginSession(taskId, 0); startStep(taskId, next.id); }
    else { state.ask = { type: 'history', taskId, stepId: next.id }; render(); }
    return;
  }
  startStep(taskId, next.id);
}

function startStep(taskId, stepId) {
  const s = state.meta.session, st = findStep(taskId, stepId);
  if (!s || !st) return;
  s.taskId = taskId;
  s.skipped = (s.skipped || []).filter(x => x !== stepId);
  if (!st.est) { state.ask = { type: 'estimate', taskId, stepId }; saveMeta(); render(); return; }
  state.ask = null;
  closeGap(s);
  const carry = st.spent || 0;
  // Time already spent comes off the plan. A step that's already past its plan gets 10 more minutes.
  s.active = { taskId, stepId, startedAt: Date.now(), pausedMs: 0, pausedAt: null, carry, target: carry >= st.est * 60 ? carry + 600 : null, alerts: 0, estLow: false };
  s.lastAt = Date.now();
  saveMeta(); render();
}

function resumeStep(a) {
  logPause(a);
  if (a.pausedAt) { a.pausedMs += Date.now() - a.pausedAt; a.pausedAt = null; }
  a.autoStopped = false; a.idlePaused = false;
}

function togglePause() {
  const a = state.meta.session?.active; if (!a) return;
  if (a.pausedAt) resumeStep(a);
  else a.pausedAt = Date.now();
  if (state.ask?.type === 'away') state.ask = null; // the extension can get here while Paced is asking
  saveMeta(); render();
}

// "Need more time" at the planned end: a new end, counted from now.
function extendStep(min) {
  const a = state.meta.session?.active; if (!a) return;
  resumeStep(a);
  a.target = elapsedSec(a) + min * 60;
  a.extended = (a.extended || 0) + 1;
  a.alerts = 0;
  a.estLow = true; // the plan changed mid-step, so this one doesn't count toward your speed
  state.ask = null;
  logEvent('extend', { title: findStep(a.taskId, a.stepId)?.title, min });
  saveMeta(); render();
  toast(`Okay, ${fmtMin(min)} more. This step won’t count against your speed.`);
}

// Take time off the running step, as if the timer had been paused for it. Returns the new time.
function shortenStep(a, sec) {
  const before = elapsedSec(a), to = clamp(sec, a.carry || 0, before);
  a.pausedMs += (before - to) * 1000;
  a.alerts = 0; a.okSec = 0;
  a.estLow = true; // the time is a best guess now, so this one doesn't count toward your speed
  a.timeGuess = true;
  logSlip('away', before - to);
  if (before - to >= 30) logEvent('pause', { at: Date.now() - (before - to) * 1000, end: Date.now(), away: true });
  return to;
}

// "I forgot the timer": use the time you say you worked.
function correctTime(min, keepGoing) {
  const a = state.meta.session?.active; if (!a || !min) return;
  const st = findStep(a.taskId, a.stepId), sec = shortenStep(a, min * 60);
  state.ask = null;
  if (document.activeElement) document.activeElement.blur();
  if (!keepGoing) { finishStep(); return; }
  resumeStep(a);
  if (sec >= targetSec(a, st)) a.target = sec + 600;
  saveMeta(); render();
}

function finishStep() {
  const m = state.meta, s = m.session, a = s && s.active;
  if (!a) return;
  const t = state.tasks.get(a.taskId), st = findStep(a.taskId, a.stepId);
  if (!st) { s.active = null; saveMeta(); render(); return; }
  const before = clone(t);
  const sec = Math.max(1, Math.round(elapsedSec(a)));
  const worked = Math.max(0, sec - (a.carry || 0));
  st.done = true; st.actual = sec; st.doneAt = Date.now(); delete st.spent;
  const counts = !!st.est && !a.estLow && !a.carry;
  const pace = st.est ? clamp(st.est * 60 / Math.max(sec, 20), 0.25, 3) : null;
  s.log.push({ taskId: t.id, stepId: st.id, title: st.title, est: st.est, actual: sec, worked, pace, excluded: !counts, feel: null });
  logPause(a);
  logStepTime('done', a, st, t, worked, a.carry || a.timeGuess || a.autoStopped || a.splitUp ? { noSpeed: true } : null);
  s.active = null; s.taskId = t.id; s.lastAt = Date.now();
  openGap(s);
  const countedN = s.log.filter(l => l.pace != null && !l.excluded).length;
  if (counts && (s.priorMin || 0) < 30 && countedN <= 2) m.fresh = [...(m.fresh || []), pace].slice(-12);
  state.ask = assess(m).paceReady ? null : { type: 'feel' };
  maybeArchive(t, before);
  saveTask(t); saveMeta(); render();
}

// Put the running step aside, keeping the time spent on it, so you can come back to it later.
function setAside(s, why) {
  const a = s.active; if (!a) return;
  const t = state.tasks.get(a.taskId), st = findStep(a.taskId, a.stepId);
  const el = elapsedSec(a);
  logPause(a);
  if (st) { st.spent = Math.round(el); saveTask(t); logStepTime('aside', a, st, t, el - (a.carry || 0), { why }); }
  s.partialSec = (s.partialSec || 0) + Math.max(0, el - (a.carry || 0));
  s.active = null; s.lastAt = Date.now();
}

function switchStep(stepId) {
  const s = state.meta.session, tid = focusTaskId();
  if (!s || !tid) return;
  if (s.active && s.active.stepId === stepId) return;
  if (s.active) setAside(s, 'switch');
  startStep(tid, stepId);
}

function skipStep() {
  const s = state.meta.session, a = s && s.active; if (!a) return;
  const t = state.tasks.get(a.taskId), st = findStep(a.taskId, a.stepId);
  const next = nextStep(t, { skipped: [...(s.skipped || []), a.stepId] }, a.stepId);
  if (!next) { toast('That’s the last step left in this task.'); return; }
  setAside(s, 'skip');
  s.skipped = [...new Set([...(s.skipped || []), st.id])];
  startStep(t.id, next.id);
  toast(`Skipped “${st.title}” for now. It’s still in your steps.`);
}

// Count what's done so far as finished, and save the rest of the step as a new step right after it.
function splitStep(name, min) {
  const s = state.meta.session, a = s && s.active; if (!a) return;
  const t = state.tasks.get(a.taskId), st = findStep(a.taskId, a.stepId);
  if (!st) return;
  const rest = { id: newId('s'), title: name || `${st.title} (rest)`, est: min || null, done: false, actual: null, doneAt: null };
  t.steps.splice(t.steps.indexOf(st) + 1, 0, rest);
  a.estLow = true; // the plan changed mid-step, so this one doesn't count toward your speed
  state.ask = null;
  if (document.activeElement) document.activeElement.blur();
  logEvent('split', { title: st.title, rest: rest.title });
  a.splitUp = true;
  finishStep();
  toast(`Split it. “${rest.title}” is up next.`);
}

// Instead of a full break when a deadline is close: set this step aside and work on another task.
function switchTask(taskId) {
  const s = state.meta.session, t = state.tasks.get(taskId); if (!s || !t) return;
  const n = nextStep(t, s); if (!n) return;
  if (s.active) setAside(s, 'switch');
  s.snoozeUntil = Date.now() + 15 * 60e3; s.markAt = assess(state.meta).workMin;
  startStep(taskId, n.id);
  toast(`Switched to “${t.title}”. Switch back after a step or two.`);
}

function stashActive(s, why) {
  const a = s.active; if (!a) return;
  const t = state.tasks.get(a.taskId), st = findStep(a.taskId, a.stepId);
  logPause(a);
  if (st) { st.spent = Math.round(elapsedSec(a)); saveTask(t); logStepTime('aside', a, st, t, elapsedSec(a) - (a.carry || 0), { why }); }
  s.active = null;
}

// Breaks you don't need yet get pushed back on, so they can't be spammed.
function requestBreak(min, force) {
  const m = state.meta, s = m.session;
  if (!s || force) return takeBreak(min);
  const as = assess(m), bp = breakPlan(as, s, true); // a break you pushed back is still a break you need
  if (bp || (!methodOf(s).work && as.kind === 'soon')) return takeBreak(bp && bp.min ? bp.min : min);
  state.ask = { type: 'breakcheck', min };
  renderFocus();
}

function takeBreak(min) {
  const m = state.meta, s = m.session;
  if (s && s.method === 'pomodoro') { const p = m.pomo && m.pomo.date === dateKey() ? m.pomo : { date: dateKey(), n: 0 }; m.pomo = { date: p.date, n: p.n + 1 }; }
  if (s) recordSession(s);
  if (s) { closeGap(s); stashActive(s, 'break'); }
  min = usePlannedBreak(min);
  m.brk = { startedAt: Date.now(), until: Date.now() + min * 60e3, min, taskId: s ? s.taskId : null, alerts: 0 };
  m.session = null; state.ask = null; state.focusOpen = true;
  saveMeta(); render();
}

// One tap back: the next step starts right away.
function endBreak() {
  const m = state.meta, b = m.brk; if (!b) return;
  const over = (Date.now() - b.until) / 1000;
  logSlip('break', over);
  logEvent('break', { at: b.startedAt, end: Date.now(), min: b.min });
  m.brk = null; m.lastBreakEnd = Date.now();
  const t = b.taskId && state.tasks.get(b.taskId), task = t && !t.archived ? t : null;
  beginSession(task ? task.id : null, 0);
  state.focusOpen = true;
  const next = task ? nextStep(task, m.session) : null;
  if (next) startStep(task.id, next.id);
  else { openGap(m.session); saveMeta(); render(); }
  if (over >= 60) toast(`Your break ran ${fmtDur(over)} over.`);
}

function endSession() {
  const m = state.meta, s = m.session;
  const worked = s ? assess(m).workMin - (s.priorMin || 0) : 0;
  if (s) m.lastStop = { at: Date.now(), workMin: Math.round(assess(m).workMin) };
  if (s) recordSession(s);
  if (s) { closeGap(s); stashActive(s, 'end'); }
  m.session = null; state.ask = null; state.focusOpen = false; state.fEdit = false;
  if (!m.brk) endRun();
  saveMeta(); render();
  if (m.recordToShow) showRecord();
  else if (worked >= 1) toast(`Nice work! You worked for ${fmtMin(worked)}.`);
}

function minimizeFocus() {
  const m = state.meta, a = m.session && m.session.active;
  if (!m.session) state.ask = null;
  state.focusOpen = false;
  render();
  if (a && !a.pausedAt) toast('Your timer is still running. Tap Show at the bottom to get back to it.');
  else if (m.brk) toast('Your break is still going. Tap Show at the bottom to see the timer.');
}

function setEstimateAndStart(n) {
  if (!state.ask || state.ask.type !== 'estimate' || !n) return;
  const { taskId, stepId } = state.ask;
  const t = state.tasks.get(taskId), st = findStep(taskId, stepId);
  if (!st) return;
  st.est = clamp(n, 1, 600); saveTask(t);
  state.ask = null;
  if (document.activeElement) document.activeElement.blur();
  startStep(taskId, stepId);
}

/* ----- editing steps on the working screen ----- */
function moveStep(sid, dir) {
  const t = state.tasks.get(focusTaskId()); if (!t) return;
  const i = t.steps.findIndex(s => s.id === sid), j = i + dir;
  if (i < 0 || j < 0 || j >= t.steps.length) return;
  [t.steps[i], t.steps[j]] = [t.steps[j], t.steps[i]];
  saveTask(t); renderFocus();
}

function deleteFocusStep(sid) {
  const t = state.tasks.get(focusTaskId()); if (!t) return;
  const before = clone(t), st = t.steps.find(s => s.id === sid);
  t.steps = t.steps.filter(s => s.id !== sid);
  clearActiveIf(a => a.stepId === sid);
  saveTask(t); render();
  toast(`Deleted “${st ? st.title : 'step'}”`, 'Undo', () => { saveTask(before); render(); });
}

/* ---------- actions: the timeline ---------- */
// A change to the plan you can take back.
function changePlan(msg, next) {
  const before = clone(dayPlan());
  savePlan(next);
  renderLayer(); render();
  toast(msg, 'Undo', () => { savePlan(before); renderLayer(); render(); });
}

    }
    case 'alert-sound': state.meta.sound = v === 'on'; saveMeta(); renderLayer(); if (state.meta.sound) Alert.chime(); break;
    case 'idle-min': state.meta.idleMin = +v; saveMeta(); renderLayer(); break;
    case 'check-min': state.meta.checkMin = +v; saveMeta(); renderLayer(); break;
    case 'alert-notify': Promise.resolve(Alert.askPermission()).then(() => renderLayer()); break;
  }
});

document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'auth-form') submitAuth();
  else if (f.id === 'draft-add') addDraftStep();
  else if (f.id === 'est-form') setEstimateAndStart(parseMin($('#est-input').value));
  else if (f.id === 'split-form') splitStep($('#split-name').value.trim(), parseMin($('#split-min').value));
  else if (f.id === 'forgot-form') correctTime(parseMin($('#forgot-min').value), false);
  else if (f.id === 'detail-add' || f.id === 'fstep-add') {
    const inFocus = f.id === 'fstep-add';
    const t = state.tasks.get(inFocus ? focusTaskId() : state.layer && state.layer.id); if (!t) return;
    const nameEl = $(inFocus ? '#fstep-name' : '#detail-step'), minEl = $(inFocus ? '#fstep-min' : '#detail-min');
    const title = nameEl.value.trim();
    if (!title) { nameEl.focus(); return; }
    t.steps.push({ id: newId('s'), title, est: parseMin(minEl.value), done: false, actual: null, doneAt: null });
    saveTask(t);
    if (inFocus) { nameEl.blur(); renderFocus(); $('#fstep-name').focus(); }
    else { renderLayer(); render(); $('#detail-step').focus(); }
  }
});

document.addEventListener('input', e => {
  if (e.target.id === 'record-note') {
    const r = state.records.get(state.layer?.id);
    if (r) { r.note = e.target.value; saveRecord(r); }
    return;
  }
  const el = e.target;
  if (el.matches('textarea.step-title')) {
    if (el.value.includes('\n')) el.value = el.value.replace(/\s*\n+\s*/g, ' ');
    autosize(el);
  }
  if (el.id === 'auth-email') state.auth.email = el.value;
  else if (el.id === 'paste-text') state.gt.text = el.value;
  else if (el.id === 'new-title') { state.draft.title = el.value; if (el.value.trim()) $('#new-err').hidden = true; }
  else if (el.id === 'split-name' && state.ask) state.ask.name = el.value;
  else if ((el.id === 'split-min' || el.id === 'forgot-min') && state.ask) state.ask.min = parseMin(el.value);
  else if (el.dataset.draft) {
    const d = state.draft.steps[+el.dataset.i]; if (!d) return;
    if (el.dataset.draft === 'title') d.title = el.value; else d.est = parseMin(el.value);
    $('#draft-total').textContent = draftTotal();
  }
});

document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.hour) {
    const p = dayPlan(), list = clone(p.windows), w = list[+el.dataset.i], v = parseHHMM(el.value);
    if (w && v != null) w[el.dataset.hour] = v;
    savePlan({ ...p, windows: w && w.e > w.s ? cleanWindows(list) : p.windows });
    renderLayer(); render();
    return;
  }
  // Steps edited on the working screen
  if (el.dataset.fedit) {
    const t = state.tasks.get(focusTaskId()), st = t && t.steps.find(s => s.id === el.dataset.step);
    if (!st) return;
    if (el.dataset.fedit === 'title') { const v = el.value.trim(); if (v) st.title = v; else el.value = st.title; }
    else {
      const n = parseMin(el.value), a = state.meta.session && state.meta.session.active;
      if (n !== st.est && a && a.stepId === st.id) { a.estLow = true; saveMeta(); } // the plan changed mid-step
      st.est = n; el.value = n ?? '';
    }
    saveTask(t);
    return;
  }
  const t = state.layer && state.layer.type === 'detail' && state.tasks.get(state.layer.id);
  if (!t) return;
  if (el.id === 'detail-title') {
    const v = el.value.trim();
    if (v) { t.title = v; saveTask(t); render(); } else el.value = t.title;
    return;
  }
  const st = el.dataset.field && t.steps.find(s => s.id === el.dataset.step);
  if (!st) return;
  if (el.dataset.field === 'title') {
    const v = el.value.trim();
    if (v) st.title = v; else el.value = st.title;
  } else if (el.dataset.field === 'actual') {
    const n = parseMin(el.value);
    if (n) st.actual = n * 60;
    el.value = Math.max(1, Math.round(st.actual / 60));
  } else {
    st.est = parseMin(el.value);
    el.value = st.est ?? '';
  }
  saveTask(t);
  $('#detail-sum').innerHTML = detailSummary(t);
  $('#detail-tip').hidden = !missingMinutes(t);
  render();
});

document.addEventListener('toggle', e => {
  if (e.target.classList && e.target.classList.contains('how')) state.howOpen = e.target.open;
}, true);

document.addEventListener('keydown', e => {
  const el = e.target;
  if (e.key === 'Enter') {
    if (el.id === 'new-title') { e.preventDefault(); $('#draft-step').focus(); return; }
    if ((el.id === 'draft-step' || el.id === 'detail-step' || el.id === 'fstep-name') && el.value.trim()) {
      e.preventDefault();
      $({ 'draft-step': '#draft-min', 'detail-step': '#detail-min', 'fstep-name': '#fstep-min' }[el.id]).focus();
      return;
    }
    if (el.dataset && el.dataset.draft) { e.preventDefault(); $('#draft-step').focus(); return; }
    if (el.dataset && (el.dataset.field || el.dataset.fedit)) { e.preventDefault(); el.blur(); return; }
  }
  const calStep = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -7, ArrowDown: 7 }[e.key];
  if (calStep && el.matches?.('.cal-day')) { e.preventDefault(); moveDueFocus(addDays(el.dataset.v, calStep)); return; }
  if (el.dataset?.size && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
    e.preventDefault();
    setRailH(railH + (e.key === 'ArrowUp' ? RAIL_STEP : -RAIL_STEP));
    saveRailH();
    $('.day-grip')?.focus();
    return;
  }
  if (el.dataset?.grow && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
    e.preventDefault();
    const id = el.dataset.grow, b = layoutDay().blocks.find(y => y.item.id === id);
    if (b) { savePlan(sizedPlan(dayPlan(), id, Math.max(PLAN_SNAP, b.min + (e.key === 'ArrowLeft' ? -PLAN_SNAP : PLAN_SNAP)))); render(); }
    $(`[data-grow="${id}"]`)?.focus();
    return;
  }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    const dir = e.key === 'ArrowLeft' ? -1 : 1, edge = el.closest?.('[data-edge]'), block = el.closest?.('.tblock[data-item]');
    if (edge) {
      e.preventDefault();
      const p = dayPlan(), list = clone(p.windows), w = list[+edge.dataset.i];
      w[edge.dataset.edge] = clamp(w[edge.dataset.edge] + dir * HOURS_SNAP, 0, 1440);
      savePlan({ ...p, windows: cleanWindows(list) });
      render();
      $(`[data-edge="${edge.dataset.edge}"][data-i="${edge.dataset.i}"]`)?.focus();
    } else if (block) {
      e.preventDefault();
      movePlanItem(block.dataset.item, dir);
      $(`.tblock[data-item="${block.dataset.item}"] .tb-open`)?.focus();
    }
  }
  // Whatever the menu for the selection can delete. What's running has no delete button there, so it's safe.
  if ((e.key === 'Backspace' || e.key === 'Delete') && !state.layer && !state.focusOpen && !el.closest?.('input, textarea, select, [contenteditable]')) {
    const del = $('.day-menu [data-act="sel-delete"]');
    if (del) { e.preventDefault(); del.click(); return; }
  }
  if (e.key === 'Escape') {
    if (drag) { endDrag(true); return; }
    if (daySel) { daySel = null; renderDay('quiet'); return; }
    if (state.layer && state.duePick) { state.duePick = null; renderDue('#due-toggle'); return; }
    if (state.layer) closeLayer();
    else if (state.focusOpen) minimizeFocus();
  }
});

/* ---------- clock ---------- */
let lastMinute = -1, breakWasOver = null, lastSeen = null, seenSaved = 0;
const BASE_TITLE = document.title, SEEN_KEY = 'paced:seen';

// Nothing runs while Paced is closed or the device sleeps, so the auto-stop can't either.
// On the way back the step stops at the moment you left, and that time only counts if you say so.
function checkAway(now = Date.now()) {
  if (lastSeen === null) { try { lastSeen = +localStorage.getItem(SEEN_KEY) || now; } catch (e) { lastSeen = now; } }
  const a = state.meta.session?.active, gone = now - Math.max(lastSeen, a ? a.startedAt : 0);
  lastSeen = now;
  if (now - seenSaved > 15e3) { seenSaved = now; try { localStorage.setItem(SEEN_KEY, now); } catch (e) {} }
  if (!a || a.pausedAt || gone < AWAY_MIN * 60e3) return;
  a.pausedAt = clamp(now - gone, a.startedAt + (a.pausedMs || 0), now);
  state.ask = { type: 'away', sec: gone / 1000 };
  state.focusOpen = true;
  saveMeta(); render();
}

function tickStep(s) {
  const a = s.active, st = findStep(a.taskId, a.stepId), target = targetSec(a, st);
  if (target == null) return;
  let el = elapsedSec(a);
  // Nobody answered: stop the timer so a forgotten step can't run for hours.
  const stopAt = Math.max(target, a.okSec || 0) + AUTO_STOP_MIN * 60;
  if (!a.pausedAt && el > stopAt) {
    a.pausedAt = Date.now() - (el - stopAt) * 1000;
    a.autoStopped = true;
    a.alerts = OVER_ALERTS.length;
    el = stopAt;
    saveAlerts();
    Alert.send('Paced stopped your timer', `“${st.title}” ran ${AUTO_STOP_MIN} minutes over.`);
  }
  const up = el >= target && (!a.pausedAt || a.autoStopped);
  if (!up) {
    if (state.ask?.type === 'timeup') { state.ask = null; renderFocus(); }
    return;
  }
  if (dueAlert(a, (el - target) / 60, OVER_ALERTS)) {
    saveAlerts();
    Alert.send(a.extended ? 'Your extra time is up' : 'Time’s up', `Did you finish “${st.title}”?`);
  }
  if (!state.ask) {
    state.ask = { type: 'timeup' };
    state.focusOpen = true;
    render();
  }
}

function tickGap(s) {
  const plan = gapPlan(s), past = (Date.now() - s.gap.until) / 1000;
  if (plan.type === 'none' || past < 0) return;
  const ae = document.activeElement, typing = $('#focus').contains(ae) && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA');
  const free = !state.layer && !state.fEdit && !typing && (!state.ask || state.ask.type === 'feel');
  // A little late is fine in a background tab. Much later means nobody was here, so don't start without you.
  if (plan.type !== 'hold' && past < 90) {
    if (!free) return;
    if (plan.type === 'break') { Alert.send('Break time', `Your ${plan.min}-minute break is starting.`); takeBreak(plan.min); }
    else { Alert.send(`Starting: ${plan.next.title}`, `${fmtMin(plan.next.est)} planned.`); startStep(plan.t.id, plan.next.id); }
    return;
  }
  if (dueAlert(s.gap, past / 60, OVER_ALERTS)) {
    saveAlerts();
    Alert.send('Nothing is running', 'Start your next step, or take a break.');
    renderFocus(); renderMini();
  }
}

function tickBreak(m) {
  const b = m.brk, left = (b.until - Date.now()) / 1000, over = left <= 0;
  if (dueAlert(b, -left / 60, BREAK_ALERTS)) {
    saveAlerts();
    const t = b.taskId && state.tasks.get(b.taskId), next = t && !t.archived ? nextStep(t, null) : null;
    Alert.send('Break’s over', next ? `Up next: ${next.title}` : 'Time to get back to work.');
  }
  if (breakWasOver === false && over) { renderFocus(); renderMini(); }
  breakWasOver = over;
}

// Break-time reminders, for when the working screen isn't what you're looking at.
function checkBreakDue(s) {
  const bp = breakPlan(assess(state.meta), s);
  if (!bp) { s.dueAlerted = false; return; }
  if (s.dueAlerted) return;
  s.dueAlerted = true;
  saveAlerts();
  Alert.send(bp.type === 'switch' ? 'Time to switch tasks' : 'Time for a break', 'Open Paced to start it.');
}

function showClocks() {
  const m = state.meta, s = m.session, a = s && s.active, c = liveClock();
  if (c) document.querySelectorAll('[data-tick="mini"]').forEach(n => { n.textContent = fmtClock(c.left); });
  $('#mini').classList.toggle('over', !!(c && c.over));
  const title = !c ? BASE_TITLE : c.paused ? `Paused · ${c.label}` : `${fmtClock(c.left)} ${c.label}`;
  if (document.title !== title) document.title = title;
  if (a) {
    const st = findStep(a.taskId, a.stepId), el = elapsedSec(a), target = targetSec(a, st);
    document.querySelectorAll('[data-tick="timer"]').forEach(n => {
      n.innerHTML = clockHTML(target == null ? el : target - el);
      n.classList.toggle('over', target != null && el > target);
    });
    const line = $('[data-tick="estline"]');
    if (line) line.textContent = planLine(el, target, !!a.pausedAt);
    const bar = $('[data-tick="prog"]');
    if (bar && target) { bar.style.width = Math.min(100, el / target * 100).toFixed(1) + '%'; bar.classList.toggle('over', el > target); }
  }
  if (m.brk) {
    const left = (m.brk.until - Date.now()) / 1000;
    document.querySelectorAll('[data-tick="break"]').forEach(n => { n.innerHTML = clockHTML(left); n.classList.toggle('over', left < 0); });
  }
  const box = $('[data-tick="gapbox"]');
  if (box && s && s.gap) {
    const left = (s.gap.until - Date.now()) / 1000;
    box.classList.toggle('over', left < 0);
    box.querySelector('.gap-text').textContent = gapText(gapPlan(s), left);
    box.querySelector('.gap-time').textContent = fmtClock(left);
  }
  showPip();
}

// With nothing running there's no clock to run out, so the timeline is what gets you started.
let planAlerted = null;
function tickPlan(m) {
  if (m.session?.active || m.brk) return;
  const p = dayPlan(), first = layoutDay().blocks[0], now = minuteNow();
  if (!first || !first.task.steps.length || planAlerted === first.item.id) return;
  const due = Math.max(first.item.at ?? 0, p.windows[0]?.s ?? 0);
  if (now < due || now >= due + PLAN_ALERT_MIN) return;
  planAlerted = first.item.id;
  Alert.send(`Time to start: ${first.task.title}`, `${fmtMin(first.min)} on your timeline.`);
}

let lastTick = 0, syncUntil = 0;
function tick() {
  if (!state.ready) return;
  // Just woke up: let your account deliver the latest news before alerting about what this tab remembers.
  const now = Date.now();
  if (Store.mode === 'cloud' && lastTick && now - lastTick > 90e3) syncUntil = now + 5000;
  lastTick = now;
  if (now < syncUntil) { showClocks(); return; }
  dropFinishedStep();
  checkAway();
  tickCalendar();
  if (backWaiting) { backWaiting = false; backFromIdle(); }
  watchIdle();
  watchCheckIn();
  if (document.visibilityState === 'visible') showRecord();
  const m = state.meta;
  if (m.session && !m.session.active && !m.session.gap) { openGap(m.session, m.session.lastAt); saveAlerts(); render(); }
  if (m.session?.active) tickStep(m.session);
  else if (m.session?.gap) tickGap(m.session);
  if (m.brk) tickBreak(m);
  else breakWasOver = null;
  showClocks();
  shareClock();
  // Once a minute: idle sessions close, and the working screen's numbers catch up.
  const minute = Math.floor(Date.now() / 60000);
  if (minute !== lastMinute) {
    lastMinute = minute;
    if (expireIdleSession()) { render(); return; }
    if (m.session?.active && !m.session.active.pausedAt) checkBreakDue(m.session);
    tickPlan(m);
    if (!drag && !daySel) renderDay('quiet'); // an open menu keeps its place until you're done with it
    if (state.focusOpen && (m.session || m.brk)) renderFocus();
  }
}
setInterval(tick, 1000);

/* ---------- boot ---------- */
render();
Store.init().then(() => {
  clearStale();
  state.ready = true;
  render();
});
</script>
</body></html>
