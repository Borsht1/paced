<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;500;600&family=Figtree:wght@400;500;600;700&family=Schibsted+Grotesk:wght@600;700;800&display=swap">
<style>
/* Layout: one centered 600px column for the task list; sheets rise from the bottom on phones and float centered on wide screens; the working screen takes the whole screen */
:root {
  --bg: #F2F3EF;
  --surface: #FFFFFF;
  --surface-2: #E8EAE5;
  --ink: #191C1F;
  --muted: #5D645F;
  --line: #D9DDD6;
  --accent: #2E43C2;
  --accent-ink: #FFFFFF;
  --accent-soft: #E3E7FA;
  --zone: #1D7650;
  --zone-soft: #D8EFE3;
  --warn: #935700;
  --warn-soft: #FAEDD5;
  --stop: #B53A27;
  --stop-soft: #F8E1DB;
  --scrim: rgba(20, 24, 28, .4);
  --shadow: 0 1px 2px rgba(20, 24, 28, .06), 0 6px 20px rgba(20, 24, 28, .07);
  --font-display: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Azeret Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111315; --surface: #1A1D20; --surface-2: #25292D; --ink: #E8EBE9; --muted: #9BA29D; --line: #30353A;
    --accent: #8E9DFF; --accent-ink: #0E1333; --accent-soft: #222949;
    --zone: #5DCB98; --zone-soft: #163126; --warn: #E9AC4F; --warn-soft: #382A13; --stop: #F18A75; --stop-soft: #3B1E19;
    --scrim: rgba(0, 0, 0, .55); --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111315; --surface: #1A1D20; --surface-2: #25292D; --ink: #E8EBE9; --muted: #9BA29D; --line: #30353A;
  --accent: #8E9DFF; --accent-ink: #0E1333; --accent-soft: #222949;
  --zone: #5DCB98; --zone-soft: #163126; --warn: #E9AC4F; --warn-soft: #382A13; --stop: #F18A75; --stop-soft: #3B1E19;
  --scrim: rgba(0, 0, 0, .55); --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink);
  font: 400 16px/1.45 var(--font-body);
  -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body.locked { overflow: hidden; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .45; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); }

.app { max-width: 600px; margin: 0 auto; padding-block: 22px 150px; }
.brand-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 40px; }
.brand { display: flex; align-items: center; gap: 7px; font: 700 13px/1 var(--font-display); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
h1 { font: 800 clamp(32px, 8vw, 42px)/1.05 var(--font-display); letter-spacing: -.02em; margin: 18px 0 6px; text-wrap: balance; }
.sub { margin: 0 0 22px; color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; }
.saved { text-align: center; color: var(--muted); font-size: 12px; margin-top: 28px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid transparent; border-radius: 999px; padding: 10px 18px; font-weight: 600; font-size: 15px; background: var(--surface-2); color: var(--ink); white-space: nowrap; }
.btn:hover:not(:disabled) { box-shadow: inset 0 0 0 999px rgba(127, 127, 127, .1); }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.soft { background: var(--accent-soft); color: var(--accent); }
.btn.ghost { background: transparent; border-color: var(--line); }
.btn.danger { background: transparent; border-color: var(--line); color: var(--stop); }
.btn.big { padding: 15px 26px; font-size: 17px; }
.btn.small { padding: 8px 14px; font-size: 14px; }
.count { font: 600 12px/1 var(--font-mono); background: var(--surface-2); border-radius: 999px; padding: 4px 7px; }
.icon-btn { width: 40px; height: 40px; flex: none; border-radius: 50%; display: grid; place-items: center; border: none; background: transparent; color: var(--muted); padding: 0; }
.icon-btn:hover:not(:disabled) { background: var(--surface-2); color: var(--ink); }
.link { background: none; border: none; color: var(--accent); font-weight: 600; padding: 4px 0; text-align: left; }
.link.small { font-size: 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row-actions { display: flex; align-items: center; gap: 2px; }
.due { font-weight: 600; }
.due.soon { color: var(--warn); }
.due.late { color: var(--stop); }

/* Task list */
.tasks { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.task { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 4px; background: var(--surface); border-radius: var(--r); padding: 6px 12px 6px 6px; box-shadow: var(--shadow); }
.check { width: 42px; height: 42px; flex: none; border: none; background: transparent; padding: 0; display: grid; place-items: center; color: transparent; }
.check > span { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; transition: border-color .15s, background .15s; }
button.check:hover > span { border-color: var(--zone); color: var(--zone); }
.check.on { color: var(--surface); }
.check.on > span { background: var(--zone); border-color: var(--zone); }
.check.sm { width: 38px; height: 38px; }
.check.sm > span { width: 22px; height: 22px; }
.task-body { min-width: 0; text-align: left; background: none; border: none; padding: 12px 6px; display: grid; gap: 4px; }
.task-title { font-weight: 600; font-size: 17px; line-height: 1.3; overflow-wrap: anywhere; }
.task-meta { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.badge { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; color: var(--accent); }
.badge .dot, .mini-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; animation: pulse 1.6s ease-in-out infinite; }
.bar { display: block; height: 4px; background: var(--surface-2); border-radius: 2px; overflow: hidden; margin-top: 4px; }
.bar i { display: block; height: 100%; background: var(--zone); border-radius: 2px; transition: width .3s; }
.bar i.over { background: var(--warn); }
.start { padding-left: 12px; }
.empty { background: var(--surface); border-radius: var(--r); padding: 26px 24px; box-shadow: var(--shadow); display: grid; gap: 12px; justify-items: start; }
.empty h2 { font: 700 22px/1.2 var(--font-display); margin: 0; }
.empty p { margin: 0; color: var(--muted); max-width: 52ch; }
.how-list { margin: 0 0 6px; padding-left: 22px; display: grid; gap: 6px; max-width: 52ch; }
.how-list li::marker { font-weight: 700; color: var(--accent); }
.loading { display: flex; align-items: center; gap: 10px; color: var(--muted); padding: 48px 0; }
.pulse { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); animation: pulse 1.2s ease-in-out infinite; flex: none; }
@keyframes pulse { 50% { opacity: .3; transform: scale(.7); } }

.fab {
  position: fixed; z-index: 20;
  right: max(calc(16px + env(safe-area-inset-right, 0px)), calc(50vw - 300px));
  bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  height: 56px; padding: 0 24px 0 18px; border-radius: 999px; border: none;
  background: var(--accent); color: var(--accent-ink);
  font-weight: 700; font-size: 16px;
  box-shadow: 0 8px 24px color-mix(in srgb, var(--accent) 35%, transparent);
  display: flex; align-items: center; gap: 8px; transition: transform .15s;
}
.fab:hover { transform: scale(1.04); }
body.has-mini .fab { bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }

/* Bar at the bottom while you're working or on a break */
.mini { position: fixed; left: 0; right: 0; bottom: 0; z-index: 19; padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.mini-in { max-width: 600px; margin: 0 auto; display: flex; align-items: center; gap: 12px; background: var(--ink); color: var(--bg); border-radius: 18px; padding: 10px 10px 10px 16px; box-shadow: 0 8px 28px rgba(0, 0, 0, .25); }
.mini-dot { color: var(--zone); }
.mini-dot.still { animation: none; color: var(--warn); }
.mini-title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; font-size: 14px; }
.mini-time { font: 500 14px var(--font-mono); font-variant-numeric: tabular-nums; }
.mini .btn { background: var(--bg); color: var(--ink); }
.mini.over .mini-in { background: var(--stop); color: var(--surface); }
.mini.over .mini-dot { color: var(--surface); }

/* Sheets */
.layer { position: fixed; inset: 0; z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.scrim { position: absolute; inset: 0; background: var(--scrim); border: 0; padding: 0; cursor: default; }
.sheet {
  position: relative; width: 100%; max-width: 600px; max-height: 92%; overflow-y: auto;
  background: var(--surface); border-radius: 22px 22px 0 0;
  padding: 20px max(18px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
}
.sheet.enter { animation: rise .22s ease-out; }
@keyframes rise { from { transform: translateY(28px); opacity: 0; } }
@media (min-width: 700px) {
  .layer { align-items: center; padding: 24px; }
  .sheet { border-radius: 22px; max-height: 88vh; padding: 24px 26px; }
}
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sheet h2 { font: 700 24px/1.2 var(--font-display); margin: 0; text-wrap: balance; }
.sheet .sub { margin: 6px 0 0; }
.label { display: block; font: 700 15px/1.3 var(--font-body); color: var(--ink); margin: 22px 0 6px; }
.help { margin: 0 0 10px; color: var(--muted); font-size: 14px; max-width: 56ch; }
.text-input { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 11px 12px; font-size: 15px; min-width: 0; }
.text-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.text-input.big { font-size: 18px; font-weight: 600; padding: 13px 14px; }
.text-input.date { width: auto; }
.title-wrap { flex: 1; min-width: 0; display: flex; align-items: center; gap: 2px; color: var(--muted); cursor: text; }
.title-edit { flex: 1; min-width: 0; font: 700 24px/1.2 var(--font-display); letter-spacing: -.01em; border: 1px solid transparent; background: transparent; border-radius: 10px; padding: 4px 8px; margin-left: -8px; }
.title-edit:hover { border-color: var(--line); }
.title-edit:focus { outline: none; border-color: var(--accent); background: var(--bg); }
.pencil { flex: none; width: 28px; height: 28px; display: grid; place-items: center; }
.err { color: var(--stop); font-size: 14px; margin: 8px 0 0; }
.sheet-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 24px; flex-wrap: wrap; }
.tip { margin: 14px 0; padding: 12px 14px; border-radius: 12px; background: var(--accent-soft); font-size: 14px; }
.total { margin: 10px 0 0; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.due-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

.steps { list-style: none; margin: 4px 0 0; padding: 0; }
.step { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; align-items: center; gap: 6px; padding: 4px 0; border-bottom: 1px solid var(--line); }
.step-main { min-width: 0; display: grid; }
.step-title { display: block; width: 100%; min-width: 0; border: 1px solid transparent; background: transparent; border-radius: 8px; padding: 8px; font: inherit; font-size: 15px; line-height: 1.35; resize: none; overflow: hidden; }
.step-title:hover { border-color: var(--line); }
.step-title:focus { outline: none; border-color: var(--accent); background: var(--bg); }
.step.done .step-title { color: var(--muted); text-decoration: line-through; }
.step.live { background: var(--accent-soft); border-radius: 10px; }
.took { font-size: 13px; color: var(--muted); padding: 0 9px 4px; font-variant-numeric: tabular-nums; }
.took.live { color: var(--accent); font-weight: 600; }
.took .min-field { vertical-align: middle; }
.took .min-field input { width: 3em; padding: 3px 2px 3px 6px; font-size: 13px; }
.num { font: 500 13px var(--font-mono); color: var(--muted); width: 26px; text-align: center; }
.min-field { display: inline-flex; align-items: center; gap: 2px; border: 1px solid var(--line); border-radius: 8px; padding: 0 9px 0 0; background: var(--surface); color: var(--muted); font-size: 14px; cursor: text; }
.min-field input { width: 3.2em; border: none; background: transparent; padding: 8px 2px 8px 6px; text-align: right; font: 500 15px var(--font-mono); color: var(--ink); -moz-appearance: textfield; appearance: textfield; }
.min-field input::-webkit-outer-spin-button, .min-field input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.min-field input:focus { outline: none; }
.min-field:focus-within { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.step-add { display: flex; gap: 8px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
.step-add > .text-input { flex: 1 1 130px; width: auto; }

/* Working screen */
.focus { position: fixed; inset: 0; z-index: 30; background: var(--bg); overflow-y: auto; padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(16px, env(safe-area-inset-left, 0px)); animation: fade .2s ease-out; }
@keyframes fade { from { opacity: 0; } }
.focus-in { max-width: 560px; margin: 0 auto; padding-block: 14px 56px; display: grid; gap: 18px; }
.fbar { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px; min-height: 40px; }
.fbar-title { text-align: center; font-weight: 600; color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.step-name { font: 700 clamp(24px, 6.5vw, 32px)/1.15 var(--font-display); letter-spacing: -.01em; margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.hero { display: grid; justify-items: center; text-align: center; gap: 6px; padding-block: 14px 4px; }
.timer { font: 500 clamp(64px, 19vw, 100px)/1 var(--font-mono); letter-spacing: -.04em; font-variant-numeric: tabular-nums; margin-top: 14px; }
.timer .colon { display: inline-block; margin: 0 -.16em; transform: translateY(-.05em); }
.timer.paused { color: var(--muted); }
.timer.over { color: var(--stop); }
.est-line { color: var(--muted); font-size: 15px; }
.hero .bar { width: 100%; max-width: 360px; height: 6px; margin-top: 10px; }
.actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }
.hero-more { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; margin-top: 4px; }
.hero-more .link { display: inline-flex; align-items: center; gap: 6px; }
.panel { background: var(--surface); border-radius: var(--r); padding: 20px; box-shadow: var(--shadow); display: grid; gap: 10px; }
.status { gap: 8px; }
.status-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.status h3 { margin: 0; font: 700 21px/1.2 var(--font-display); display: flex; align-items: center; gap: 10px; }
.status .dot { width: 10px; height: 10px; border-radius: 50%; background: currentColor; flex: none; }
.pct { display: grid; justify-items: end; font: 600 28px/1 var(--font-mono); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.pct small { font: 700 11px/1.6 var(--font-body); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.status.go h3, .status.go .pct { color: var(--zone); }
.status.soon h3, .status.soon .pct { color: var(--warn); }
.status.now h3, .status.now .pct { color: var(--stop); }
.status.switch h3, .status.switch .pct { color: var(--accent); }
.status.learning h3 { color: var(--accent); }
.status.now { background: var(--stop-soft); box-shadow: none; }
.status.switch { background: var(--accent-soft); box-shadow: none; }
.why { margin: 0; font-size: 16px; }
.worked { margin: 4px 0 0; font-size: 14px; color: var(--muted); }
.worked b { color: var(--ink); font-weight: 600; }
.how summary { cursor: pointer; color: var(--accent); font-weight: 600; font-size: 14px; width: fit-content; }
.how p { margin: 8px 0 0; font-size: 14px; color: var(--muted); max-width: 60ch; }
.ask-card { background: var(--accent-soft); border-radius: var(--r); padding: 20px; display: grid; gap: 10px; }
.ask-card.warn { background: var(--warn-soft); }
.ask-card h2 { font: 700 21px/1.25 var(--font-display); margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.ask-card p { margin: 0; color: var(--muted); }
.ask-card .label { margin: 4px 0 0; }
.ask-links { display: flex; flex-wrap: wrap; gap: 18px; }
.gap-clock { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--accent-soft); border-radius: var(--r); padding: 14px 18px; }
.gap-clock > div { display: grid; justify-items: start; min-width: 0; }
.gap-text { font-weight: 600; }
.gap-time { font: 600 26px/1 var(--font-mono); font-variant-numeric: tabular-nums; }
.gap-clock.over { background: var(--stop-soft); }
.gap-clock.over .gap-text, .gap-clock.over .gap-time { color: var(--stop); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 10px 16px; font-weight: 600; font-size: 15px; }
.chip:hover { border-color: var(--accent); color: var(--accent); }
.est-custom { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14px; }
.result { display: flex; gap: 10px; align-items: center; }
.result > div { display: grid; min-width: 0; }
.result b { overflow-wrap: anywhere; }
.result .muted { font-size: 14px; }
.pick-q { margin: 4px 0 0; font: 700 16px/1.3 var(--font-body); }
.picklist { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.pick { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 12px 16px; }
.pick:hover { border-color: var(--accent); }
.pick > span:first-child { display: grid; min-width: 0; }
.pick .muted { font-size: 13px; }
.pick-go { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; color: var(--accent); flex: none; }
.breakscreen { display: grid; justify-items: center; text-align: center; gap: 14px; padding-top: 10vh; }
.breakscreen p { max-width: 36ch; margin: 0; }

/* Steps on the working screen */
.steps-panel { gap: 6px; }
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.panel-head h3 { margin: 0; font: 700 18px/1.2 var(--font-display); }
.panel-head .link { display: inline-flex; align-items: center; gap: 6px; }
.fsteps { list-style: none; margin: 0; padding: 0; display: grid; }
.record-total { margin: 12px 0 0; font-weight: 600; }
.record { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 8px; font-size: 14px; }
.record li { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 10px; overflow-wrap: anywhere; }
.record time { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.fstep { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.fstep:last-child { border-bottom: none; }
.fstep-main { display: grid; gap: 2px; min-width: 0; }
.fstep-main b { font-weight: 600; overflow-wrap: anywhere; }
.fstep-main .muted { font-size: 13px; font-variant-numeric: tabular-nums; }
.fstep.done .fstep-main b { color: var(--muted); text-decoration: line-through; }
.fstep.now { background: var(--accent-soft); border-radius: 10px; padding-inline: 6px; border-bottom-color: transparent; }
.now-tag { font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--accent); }
.fstep.editing { grid-template-columns: 26px minmax(0, 1fr); align-items: start; }
.fstep-edit { display: grid; gap: 6px; min-width: 0; }
.fstep-edit .step-title { border-color: var(--line); background: var(--bg); }
.fstep-tools { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; }
.fstep-tools .row-actions .icon-btn { width: 36px; height: 36px; }
.split-form { display: grid; gap: 8px; }

/* Work methods and the look-and-feel sheet */
.methods { display: grid; gap: 8px; }
.method-opt { text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 14px; display: grid; gap: 2px; }
.method-opt span { font-size: 13px; color: var(--muted); }
.method-opt.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.method-card { margin-top: 24px; }
.method-card h2 { font: 700 20px/1.2 var(--font-display); margin: 0; }
.method-rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.method-rows li { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 14px; flex-wrap: wrap; }
.method-rows li b { font-weight: 600; }
.method-rows .best { color: var(--zone); font-weight: 700; }
.seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.seg.two { grid-template-columns: repeat(2, minmax(0, 1fr)); margin-bottom: 10px; }
.seg.four { grid-template-columns: repeat(4, minmax(0, 1fr)); margin-bottom: 10px; }
.seg-btn { border: 1.5px solid var(--line); border-radius: 12px; padding: 10px; background: var(--surface); font-weight: 600; }
.seg-btn.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.swatches { display: flex; flex-wrap: wrap; gap: 14px; }
.swatch { width: 56px; display: grid; justify-items: center; gap: 6px; background: none; border: none; padding: 0; font-size: 12px; color: var(--muted); }
.swatch i { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: #fff; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .1); }
.swatch.on { color: var(--ink); font-weight: 700; }
.swatch.on i { outline: 3px solid var(--ink); outline-offset: 2px; }

/* Sign-in */
.auth-form { gap: 6px; }
.auth-form .label { margin: 8px 0 2px; }
.auth-form .btn.big { margin-top: 12px; width: 100%; }
.auth-forgot { justify-self: center; }
.ok-note { color: var(--zone); font-size: 14px; margin: 8px 0 0; }
.auth-foot { display: grid; justify-items: center; gap: 8px; margin-top: 18px; text-align: center; }
.auth-foot p { margin: 0; }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 60;
  bottom: calc(100px + env(safe-area-inset-bottom, 0px));
  width: max-content; max-width: min(520px, calc(100vw - 32px));
  display: flex; align-items: center; gap: 12px;
  background: var(--ink); color: var(--bg); border-radius: 12px;
  padding: 10px 10px 10px 16px; font-size: 14px; box-shadow: 0 8px 28px rgba(0, 0, 0, .25);
  animation: rise .2s ease-out;
}
body.has-mini .toast { bottom: calc(172px + env(safe-area-inset-bottom, 0px)); }

  applyDocs(docs) {
    const tasks = new Map(), events = new Map(), records = new Map(); let meta = null;
    for (const [id, d] of docs) {
      if (id === 'meta') meta = d;
      else if (id.startsWith('t_')) tasks.set(id, normTask(id, d));
      else if (id.startsWith('e_')) events.set(id, clone(d));
      else if (id.startsWith('r_')) records.set(id, clone(d));
    }
    this.hadMeta = !!meta;
    // Docs with a write still on its way keep their local version.
    for (const id of this.queue.keys()) {
      if (id === 'meta') { meta = state.meta; continue; }
      if (id.startsWith('r_')) { const r = state.records.get(id); if (r) records.set(id, r); else records.delete(id); continue; }
      const loc = state.tasks.get(id);
      if (loc) tasks.set(id, loc); else tasks.delete(id);
    }
    state.tasks = tasks;
    state.events = events;
    state.records = records;
    state.meta = normMeta(meta);
    speedCache = null;
  },

  write(id, data) {
    if (this.mode !== 'cloud') { clearTimeout(this.localTimer); this.localTimer = setTimeout(() => this.saveLocal(), 60); return; }
    let q = this.queue.get(id);
    if (!q) { q = { busy: false, next: null }; this.queue.set(id, q); }
    q.next = data === null ? { del: true } : { data: clone(data) };
    if (!q.busy) this.flush(id, q);
  },

  async flush(id, q) {
    q.busy = true;
    while (q.next && this.mode === 'cloud') {
      const job = q.next; q.next = null;
      try {
        const ref = this.col.doc(id);
        if (job.del) await ref.delete(); else await ref.set(job.data);
      } catch (e) {
        const code = e && e.code;
        if (code === 'unavailable' && !job.retried) { job.retried = true; await sleep(400 + Math.random() * 600); if (!q.next) q.next = job; continue; }
        if (code === 'quota_exceeded') toast('Your storage is full. Empty some tasks from the Trash to make room.');
        else if (['invalid_argument', 'not_granted', 'revoked', 'capability_disabled', 'capability_removed', 'transform_error'].includes(code)) { this.toLocal('Couldn’t save to your account, so changes are saved in this browser for now.'); break; }
        else toast('Couldn’t save that change. Check your connection and try again.');
      }
    }
    q.busy = false;
    if (this.queue.get(id) === q && !q.next) this.queue.delete(id);
  },

  toLocal(msg, quiet) {
    if (this.mode === 'local') return;
    this.mode = 'local';
    try { this.unsub && this.unsub(); } catch (e) {}
    this.queue.clear();
    if (state.ready && !this.connecting) this.saveLocal(); else this.loadLocal();
    if (msg) setTimeout(() => toast(msg), quiet ? 400 : 0);
    if (state.ready) render();
  },

  loadLocal() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return;
      const d = JSON.parse(raw);
      state.tasks = new Map((d.tasks || []).filter(t => t && t.id).map(t => [t.id, normTask(t.id, t)]));
      state.events = new Map((d.events || []).filter(e => e && e.id).map(e => [e.id, e]));
      state.records = new Map((d.records || []).filter(r => r && r.id).map(r => [r.id, r]));
      state.meta = normMeta(d.meta);
      speedCache = null;
    } catch (e) {}
  },

  saveLocal() {
    if (this.mode !== 'local') return;
    try { localStorage.setItem(KEY, JSON.stringify({ tasks: [...state.tasks.values()], events: [...state.events.values()], records: [...state.records.values()], meta: state.meta })); } catch (e) {}
  }
};
window.addEventListener('pagehide', () => { if (Store.mode === 'local') Store.saveLocal(); });

/* ---------- accounts (website only): sign-in and saving through Firebase ----------
   Firebase keeps you signed in on each browser until you sign out. */
const FIREBASE_SDK = 'https://www.gstatic.com/firebasejs/10.14.1';
const GUEST_KEY = 'paced:guest';
const Account = {
  fb: null, auth: null, db: null, user: null,

  async init() {
    try {
      const [app, auth, fs] = await Promise.all(['app', 'auth', 'firestore'].map(n => import(`${FIREBASE_SDK}/firebase-${n}.js`)));
      const fbApp = app.initializeApp(window.PACED_FIREBASE_CONFIG);
      this.fb = { ...auth, ...fs };
      this.auth = auth.getAuth(fbApp);
      this.db = fs.getFirestore(fbApp);
    } catch (e) { this.fb = null; return false; } // can't reach Firebase: fall back to this browser
    const user = await new Promise(resolve => { const off = this.fb.onAuthStateChanged(this.auth, u => { off(); resolve(u); }); });
    if (user) { await this.enter(user); return true; }
    let guest = false;
    try { guest = !!localStorage.getItem(GUEST_KEY); } catch (e) {}
    if (guest) { Store.mode = 'local'; Store.loadLocal(); } else Store.mode = 'signin';
    return true;
  },

  // Each person's tasks live at users/<their id>/docs, which the privacy rules keep to them alone.
  async enter(user) {
    this.user = user;
    const { collection, doc, setDoc, deleteDoc, onSnapshot } = this.fb;
    const col = collection(this.db, 'users', user.uid, 'docs');
    Store.col = {
      doc: id => ({ set: d => setDoc(doc(col, id), d), delete: () => deleteDoc(doc(col, id)) }),
      onSnapshot: (next, err) => onSnapshot(col, snap => {
        if (snap.empty && snap.metadata.fromCache) return; // offline: an empty list here isn't the real answer
        next({ docs: snap.docs.map(d => ({ id: d.id, exists: true, data: () => d.data() })) });
      }, err)
    };
    await Store.connect();
    if (Store.mode === 'cloud') this.moveLocalTasks();
  },

  // Tasks made in this browser before signing in move into the account, so nothing is left behind.
  moveLocalTasks() {
    let d = null;
    try { d = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
    if (!d) return;
    let moved = 0;
    for (const t of d.tasks || []) if (t && t.id && !state.tasks.has(t.id)) { saveTask(normTask(t.id, t)); moved++; }
    for (const e of d.events || []) if (e && e.id && !state.events.has(e.id)) { state.events.set(e.id, e); Store.write(e.id, e); }
    for (const r of d.records || []) if (r && r.id && !state.records.has(r.id)) saveRecord(r);
    if (d.meta && !Store.hadMeta) { state.meta = normMeta(d.meta); saveMeta(); }
    try { localStorage.removeItem(KEY); localStorage.removeItem(GUEST_KEY); } catch (e) {}
    if (moved) setTimeout(() => toast(`Moved ${moved} ${moved === 1 ? 'task' : 'tasks'} from this browser into your account.`), 400);
  },

  async submit(mode, email, password) {
    const f = this.fb, go = mode === 'signup' ? f.createUserWithEmailAndPassword : f.signInWithEmailAndPassword;
    const cred = await go(this.auth, email, password);
    await this.enter(cred.user);
  },

  resetPassword(email) { return this.fb.sendPasswordResetEmail(this.auth, email); },

  clearScreen() {
    state.tasks = new Map(); state.events = new Map(); state.records = new Map(); state.meta = defaultMeta(); speedCache = null;
    state.view = 'home'; state.layer = null; state.focusOpen = false; state.ask = null; state.fEdit = false;
  },

  async signOut() {
    for (let i = 0; i < 30 && Store.queue.size; i++) await sleep(100); // let saves finish first
    try { Store.unsub && Store.unsub(); } catch (e) {}
    await this.fb.signOut(this.auth);
    this.user = null; Store.col = null; Store.unsub = null; Store.queue.clear();
    Store.mode = 'signin';
    state.auth = { mode: 'signin', email: '' };
    this.clearScreen();
  },

  continueAsGuest() {
    try { localStorage.setItem(GUEST_KEY, '1'); } catch (e) {}
    Store.mode = 'local';
    Store.loadLocal();
  },

  showSignIn() {
    Store.saveLocal();
    Store.mode = 'signin';
    this.clearScreen();
  }
};

function authError(e) {
  return {
    'auth/invalid-credential': 'That email or password isn’t right.',
    'auth/wrong-password': 'That email or password isn’t right.',
    'auth/user-not-found': 'That email or password isn’t right.',
    'auth/email-already-in-use': 'There’s already an account with that email. Try signing in instead.',
    'auth/weak-password': 'Use a password with at least 6 characters.',
    'auth/invalid-email': 'That doesn’t look like an email address.',
    'auth/too-many-requests': 'Too many tries. Wait a few minutes, then try again.',
    'auth/network-request-failed': 'Couldn’t reach the sign-in service. Check your connection and try again.',
    'auth/operation-not-allowed': 'Email sign-in isn’t turned on yet.'
  }[e && e.code] || 'Something went wrong. Please try again.';
}

function saveTask(t) { state.tasks.set(t.id, t); speedCache = null; Store.write(t.id, t); }
function removeTask(id) { state.tasks.delete(id); speedCache = null; Store.write(id, null); }
function saveMeta() { Store.write('meta', state.meta); }

function clearStale() {
  dropFinishedStep();
  expireIdleSession();
}
// A step can be finished in another tab or on another device while this one still thinks it's running.
function dropFinishedStep() {
  const s = state.meta.session, a = s && s.active;
  if (!a) return;
  const t = state.tasks.get(a.taskId), st = findStep(a.taskId, a.stepId);
  if (st && !st.done && !t.archived) return;
  s.active = null; state.ask = null;
  saveMeta(); render();
}
// A session with no step running and nothing done for 30 minutes counts as stopped, so yesterday's
// hours don't carry into today. Left alone while you're looking at the working screen, unless forced.
// A break nobody came back from closes the same way.
function expireIdleSession(force) {
  const m = state.meta, s = m.session, now = Date.now();
  if (m.brk && now - m.brk.until >= BREAK_GIVE_UP_MIN * 60e3) {
    logSlip('break', BREAK_GIVE_UP_MIN * 60);
    logEvent('break', { at: m.brk.startedAt, end: m.brk.until, min: m.brk.min });
    m.lastBreakEnd = m.brk.until + BREAK_GIVE_UP_MIN * 60e3;
    m.brk = null;
    endRun();
    saveMeta();
    return true;
  }
  // Steps ticked off with no timer running make a record too, once they've stopped coming.
  if (m.run && !s && !m.brk && now - runEnd(m.run.events) >= 30 * 60e3) { endRun(); saveMeta(); return true; }
  if (!s || s.active || m.brk || (state.focusOpen && !force)) return false;
  const last = s.lastAt || s.startedAt || 0;
  if (now - last < 30 * 60e3) return false;
  closeGap(s, last + 30 * 60e3);
  m.lastStop = { at: last, workMin: Math.round(assess(m, last).workMin) };
  recordSession(s, last);
  m.session = null;
  endRun();
  if (state.ask && state.ask.type !== 'history') state.ask = null;
  saveMeta();
  return true;
}
function clearActiveIf(pred) {
  const s = state.meta.session;
  if (s && s.active && pred(s.active)) { s.active = null; state.ask = null; openGap(s); saveMeta(); }
}

/* ---------- speed model ----------
   pace = planned minutes / real minutes for a step (1.0 = exactly as planned).
   Starting speed = average pace of the first two steps after a break,
   or the median of past fresh starts when you began already tired.
   Efficiency = average pace of your last two steps / starting speed. Under 90% means it's break time. */
function assess(meta, now = Date.now()) {
  const s = meta.session || { log: [], priorMin: 0 };
  const counted = s.log.filter(l => l.pace != null && !l.excluded);
  const fresh = meta.fresh || [];
  let base = null;
  if (counted.length >= 2 && !(s.priorMin >= 30 && fresh.length >= 2)) base = (counted[0].pace + counted[1].pace) / 2;
  else if (fresh.length >= 2) base = median(fresh);
  let eff = null, from = null;
  if (base && counted.length) {
    const recent = counted.slice(-2);
    eff = recent.reduce((x, l) => x + l.pace, 0) / recent.length / base * 100;
    from = 'pace';
  }
  const paceReady = from === 'pace';
  const last = s.log[s.log.length - 1];
  const hard = !!(last && last.feel === 'struggling');
  if (hard) { eff = eff == null ? 82 : Math.min(eff, 85); from = from || 'feel'; }
  else if (eff == null && last && last.feel) { eff = last.feel === 'focused' ? 100 : 94; from = 'feel'; }
  if (eff != null) eff = Math.round(clamp(eff, 40, 130));

  const workSec = (s.priorMin || 0) * 60 + (s.partialSec || 0)
    + s.log.reduce((x, l) => x + (l.worked ?? l.actual ?? 0), 0)
    + (s.active ? elapsedSec(s.active, now) - (s.active.carry || 0) : 0);
  const workMin = workSec / 60;
  const slipping = counted.length >= 3 && counted[counted.length - 1].pace < counted[counted.length - 2].pace;
  const breakMin = clamp(Math.round(workMin * 0.2 / 5) * 5, 5, 20);

  let kind, why;
  if (eff != null && eff < 90 && (counted.length >= 2 || hard))
    [kind, why] = ['now', from === 'pace' ? `You’ve slowed down to ${eff}% of your starting speed.` : 'You said that step was hard.'];
  else if (workMin >= 90) [kind, why] = ['now', `You’ve been working for ${fmtMin(workMin)} without a break.`];
  else if (eff != null && eff < 95 && slipping) [kind, why] = ['soon', `You’re starting to slow down (${eff}% of your starting speed).`];
  else if (workMin >= 60) [kind, why] = ['soon', `You’ve been working for ${fmtMin(workMin)}.`];
  else if (eff == null) [kind, why] = ['learning', counted.length ? 'Finish one more step and Paced will start tracking how fast you’re going.' : 'Finish two steps and Paced will start tracking how fast you’re going.'];
  else if (from === 'feel') [kind, why] = ['go', 'Based on how you said that step went.'];
  else if (eff > 100) [kind, why] = ['go', `You’re working faster than when you started (${eff}%).`];
  else [kind, why] = ['go', `You’re working at ${eff}% of your starting speed. That’s right where you want to be.`];
  const title = { now: 'Time for a break', soon: 'Take a break soon', learning: 'Getting to know your speed', go: 'Keep going' }[kind];

  return { eff, from, paceReady, counted, workMin, breakMin, kind, title, why, steps: s.log.length };
}

/* ---------- main screen ---------- */
function render() {
  applyLook();
  renderMain();
  renderMini();
  renderFocus();
  const fab = $('#fab');
  fab.hidden = !state.ready || Store.mode === 'signin' || state.view !== 'home' || !activeTasks().length;
  fab.innerHTML = ICON.plus + 'New task';
}

function renderMain() {
  const main = $('#main');
  if (!state.ready) { main.innerHTML = '<div class="loading"><span class="pulse"></span>Loading your tasks…</div>'; return; }
  if (Store.mode === 'signin') { main.innerHTML = authHTML(); return; }
  main.innerHTML = state.view === 'archive' ? archiveHTML() : homeHTML();
}

function authHTML() {
  const a = state.auth, up = a.mode === 'signup';
  return `<div class="brand-row"><div class="brand">${ICON.mark}Paced</div></div>
  <h1>${up ? 'Create your account' : 'Sign in'}</h1>
  <p class="sub">See your tasks on any computer or phone.</p>
  <form class="panel auth-form" id="auth-form">
    <label class="label" for="auth-email">Email</label>
    <input id="auth-email" class="text-input" type="email" autocomplete="username" required value="${esc(a.email)}">
    <label class="label" for="auth-password">Password</label>
    <input id="auth-password" class="text-input" type="password" autocomplete="${up ? 'new-password' : 'current-password'}" required>
    ${up ? '<p class="help" style="margin:4px 0 0">Use at least 6 characters.</p>' : ''}
    <p class="err" id="auth-err" hidden></p>
    <p class="ok-note" id="auth-note" hidden></p>
    <button type="submit" class="btn primary big" id="auth-go">${up ? 'Create account' : 'Sign in'}</button>
    ${up ? '' : '<button type="button" class="link small auth-forgot" data-act="auth-forgot">Forgot password?</button>'}
  </form>
  <div class="auth-foot">
    <p>${up ? 'Already have an account?' : 'New to Paced?'} <button class="link" data-act="auth-switch">${up ? 'Sign in' : 'Create an account'}</button></p>
    <p class="muted">You’ll stay signed in on this device until you sign out.</p>
    <button class="link small" data-act="auth-guest">Continue without an account</button>
  </div>`;
}
function authStatus(err, note) {
  const e = $('#auth-err'), n = $('#auth-note');
  if (e) { e.textContent = err || ''; e.hidden = !err; }
  if (n) { n.textContent = note || ''; n.hidden = !note; }
}
async function submitAuth() {
  const a = state.auth, btn = $('#auth-go');
  a.email = $('#auth-email').value.trim();
  const password = $('#auth-password').value;
  authStatus();
  btn.disabled = true; btn.textContent = a.mode === 'signup' ? 'Creating your account…' : 'Signing in…';
  try {
    await Account.submit(a.mode, a.email, password);
    clearStale(); render();
  } catch (e) {
    authStatus(authError(e));
    btn.disabled = false; btn.textContent = a.mode === 'signup' ? 'Create account' : 'Sign in';
  }
}

const savedLine = () => `<p class="saved">${Store.mode === 'cloud' ? 'Saved to your account' : 'Saved in this browser'}${Account.fb && !Account.user ? ' · <button class="link small" data-act="auth-show">Sign in to use it on other devices</button>' : ''}</p>`;

function homeHTML() {
  const list = activeTasks();
  const archived = archivedTasks().length;
  const left = list.reduce((a, t) => a + minLeft(t), 0);
  return `<div class="brand-row"><div class="brand">${ICON.mark}Paced</div>
    <div class="row-actions"><button class="icon-btn" data-act="open-look" title="Settings" aria-label="Settings">${ICON.gear}</button>
    <button class="btn ghost small" data-act="show-archive">${ICON.trash}Trash${archived ? `<span class="count">${archived}</span>` : ''}</button></div></div>
  <h1>My tasks</h1>
  ${list.length ? `<p class="sub">${list.length} ${list.length === 1 ? 'task' : 'tasks'}${left ? ` · about ${fmtMin(left)} of work` : ''}</p>
  <ul class="tasks">${list.map(taskHTML).join('')}</ul>
  ${methodCardHTML()}` : `
  <p class="sub">Nothing to do yet</p>
  <section class="empty">
    <h2>Here’s how Paced works</h2>
    <ol class="how-list">
      <li>Add a task and split it into small steps.</li>
      <li>Guess how many minutes each step will take.</li>
      <li>Press <b>Start</b>. Paced times each step and tells you when it’s time for a break.</li>
    </ol>
    <button class="btn primary" data-act="open-add">${ICON.plus}Add your first task</button>
  </section>`}
  ${savedLine()}`;
}

function taskHTML(t) {
  const total = t.steps.length, done = total - stepsLeft(t).length, left = minLeft(t);
  let meta;
  if (!total) meta = 'No steps yet';
  else if (!done) meta = `${total} ${total === 1 ? 'step' : 'steps'}${left ? ` · about ${fmtMin(left)}` : ''}`;
  else meta = `${done} of ${total} steps done${left ? ` · about ${fmtMin(left)} left` : ''}`;
  const live = state.meta.session?.active?.taskId === t.id;
  const action = !total
    ? `<button class="btn ghost small" data-act="add-steps" data-id="${t.id}">Add steps</button>`
    : `<button class="btn soft small start" data-act="focus-task" data-id="${t.id}" aria-label="${live ? 'Show the timer for' : 'Start working on'} “${esc(t.title)}”">${live ? 'Show' : ICON.play + 'Start'}</button>`;
  return `<li class="task">
    <button class="check" data-act="complete-task" data-id="${t.id}" title="Mark the whole task as done" aria-label="Mark “${esc(t.title)}” as done"><span>${ICON.check}</span></button>
    <button class="task-body" data-act="open-task" data-id="${t.id}">
      <span class="task-title">${esc(t.title)}</span>
      <span class="task-meta">${meta}${t.due ? ' · ' + dueHTML(t) : ''}</span>
      ${live ? '<span class="badge"><span class="dot"></span>Working on this now</span>' : ''}
      ${total ? `<span class="bar" aria-hidden="true"><i style="width:${Math.round(done / total * 100)}%"></i></span>` : ''}
    </button>
    ${action}
  </li>`;
}

// "What works for you": compares your speed with each way of working once there's enough to go on.
function methodCardHTML() {
  const stats = methodStats(), ready = stats.filter(x => x.sessions >= 3 && x.steps >= 3);
  const best = ready.length >= 2 ? ready.reduce((a, b) => (b.speed > a.speed ? b : a)) : null;
  const current = methodById(state.meta.method);
  const intro = best
    ? `<p class="why"><b>You work fastest with ${esc(best.name)}.</b> You get through steps at ${best.speed}% of the speed you planned, compared with ${ready.filter(x => x !== best).map(x => `${x.speed}% with ${esc(x.name)}`).join(' and ')}.</p>`
    : '<p class="help" style="margin:0">Try a few ways of working and Paced will compare how fast you go with each. Change the method from the working screen. After 3 sessions with at least two methods, you’ll see which suits you.</p>';
  const rows = stats.map(x => `<li><span><b>${esc(x.name)}</b>${x.id === current.id ? ' <span class="muted">(using now)</span>' : ''}</span>
    <span class="${best && x.id === best.id ? 'best' : 'muted'}">${x.sessions >= 3 && x.speed != null ? `${x.speed}% speed · ${x.sessions} sessions` : `${Math.min(x.sessions, 3)} of 3 sessions`}</span></li>`).join('');
  return `<section class="panel method-card"><div class="eyebrow">What works for you</div>${intro}<ul class="method-rows">${rows}</ul>
    <p class="help" style="margin:0">100% means steps take exactly as long as you guessed. Higher is faster.</p></section>`;
}

function archiveHTML() {
  const list = archivedTasks();
  return `<div class="brand-row"><button class="btn ghost small" data-act="show-home">${ICON.back}My tasks</button></div>
  <h1>Trash</h1>
  <p class="sub">${list.length ? 'Tasks you’ve finished' : 'Nothing here yet'}</p>
  ${list.length ? `<ul class="tasks">${list.map(t => {
    const took = t.steps.reduce((a, s) => a + (s.actual || 0), 0);
    const meta = [t.completedAt ? `Finished ${fmtMonthDay(dateKey(new Date(t.completedAt)))}` : 'Finished'];
    if (t.steps.length) meta.push(`${t.steps.length} ${t.steps.length === 1 ? 'step' : 'steps'}`);
    if (took >= 60) meta.push(`${fmtDur(took)} of work`);
    return `<li class="task">
      <span class="check on" aria-hidden="true"><span>${ICON.check}</span></span>
      <div class="task-body"><span class="task-title">${esc(t.title)}</span><span class="task-meta">${meta.join(' · ')}</span></div>
      <div class="row-actions">
        <button class="btn ghost small" data-act="restore" data-id="${t.id}" title="Put this task back on your list">Restore</button>
        <button class="icon-btn" data-act="purge" data-id="${t.id}" title="Delete" aria-label="Delete “${esc(t.title)}” for good">${ICON.trash}</button>
      </div>
    </li>`;
  }).join('')}</ul>` : '<section class="empty"><p>When you finish every step of a task, it moves here automatically. You can restore it, or delete it for good.</p></section>'}`;
}

function renderMini() {
  const el = $('#mini'), m = state.meta, s = m.session;
  const show = state.ready && !state.focusOpen && (m.brk || s);
  document.body.classList.toggle('has-mini', !!show);
  if (!show) { el.hidden = true; el.innerHTML = ''; return; }
  el.hidden = false;
  const c = liveClock();
  el.classList.toggle('over', !!(c && c.over));
  const dot = `<span class="mini-dot${m.brk || (c && c.paused) ? ' still' : ''}"></span>`;
  const title = c ? esc(c.label) + (c.paused ? ' (paused)' : '') : 'Ready for your next step';
  const time = c ? `<span class="mini-time" data-tick="mini">${fmtClock(c.left)}</span>` : '';
  el.innerHTML = `<div class="mini-in">${dot}<span class="mini-title">${title}</span>${time}<button class="btn small" data-act="focus-open">Show</button></div>`;
}

// The one clock that matters right now, for the tab title and the bar at the bottom. A negative "left" is time past the end.
function liveClock(now = Date.now()) {
  const m = state.meta, s = m.session;
  if (m.brk) {
    const left = (m.brk.until - now) / 1000;
    return { label: left > 0 ? 'On a break' : 'Break’s over', left, over: left < 0 };
  }
  if (!s) return null;
  if (s.active) {
    const a = s.active, st = findStep(a.taskId, a.stepId), el = elapsedSec(a, now), target = targetSec(a, st);
    return { label: st ? st.title : 'Working', left: target == null ? el : target - el, over: target != null && el > target, paused: !!a.pausedAt && !a.autoStopped };
  }
  if (!s.gap) return null;
  const plan = gapPlan(s), left = (s.gap.until - now) / 1000;
  if (plan.type === 'none') return null;
  const label = left < 0 ? 'Nothing running' : plan.type === 'step' ? 'Next: ' + plan.next.title : plan.type === 'break' ? 'Break coming up' : 'Pick what’s next';
  return { label, left, over: left < 0 };
}

/* ---------- sheets ---------- */
function renderLayer(enter) {
  const el = $('#layer'), L = state.layer;
  const t = L && L.type === 'detail' ? state.tasks.get(L.id) : null;
  const rec = L && L.type === 'record' ? state.records.get(L.id) : null;
  if (!L || (L.type === 'detail' && !t) || (L.type === 'record' && !rec)) {
    state.layer = null; el.hidden = true; el.innerHTML = '';
    document.body.classList.toggle('locked', state.focusOpen);
    return;
  }
  el.hidden = false;
  document.body.classList.add('locked');
  el.innerHTML = '<button class="scrim" data-act="close-layer" aria-label="Close" tabindex="-1"></button>' + (L.type === 'add' ? addHTML(enter) : L.type === 'look' ? lookHTML(enter) : L.type === 'record' ? recordHTML(rec, enter) : detailHTML(t, enter));
  autosizeAll(el);
}
const sheetOpen = (enter, label) => `<section class="sheet${enter ? ' enter' : ''}" role="dialog" aria-modal="true" aria-label="${esc(label)}">`;
const sheetHead = title => `<div class="sheet-head"><h2>${esc(title)}</h2><button class="icon-btn" data-act="close-layer" aria-label="Close">${ICON.x}</button></div>`;

// Step names wrap onto more lines instead of getting cut off.
function autosize(el) { el.style.height = 'auto'; el.style.height = (el.scrollHeight + 2) + 'px'; }
function autosizeAll(root) { root.querySelectorAll('textarea.step-title').forEach(autosize); }
window.addEventListener('resize', () => { autosizeAll($('#layer')); autosizeAll($('#focus')); });

/* ----- the summary at the end of a session ----- */
function recordTotals(rec) {
  const sum = type => rec.events.filter(e => e.type === type).reduce((a, e) => a + (e.took ?? (e.end - e.at) / 1000), 0);
  return { worked: sum('done') + sum('aside'), breaks: sum('break'), paused: sum('pause'), done: rec.events.filter(e => e.type === 'done').length };
}

function eventText(e) {
  const len = fmtDur((e.end - e.at) / 1000);
  switch (e.type) {
    case 'done': return `${e.title}${e.est ? `, planned ${fmtMin(e.est)}` : ''}, took ${fmtDur(e.took)}`;
    case 'aside': return `${{ skip: 'Skipped', switch: 'Switched away from' }[e.why] || 'Stopped'} ${e.title} after ${fmtDur(e.took)}`;
    case 'extend': return `Added ${fmtMin(e.min)} to ${e.title}`;
    case 'split': return `Split ${e.title}, leaving ${e.rest}`;
    case 'pause': return e.away ? `Away for ${len}` : e.stopped ? `Timer stopped for ${len}` : `Paused for ${len}${e.idle ? ' (idle)' : ''}`;
    case 'break': return `Break, ${len}`;
    case 'gap': return `Nothing running for ${len}`;
    case 'checkin': return 'Answered “Still working?”';
    case 'ticked': return `Ticked off ${e.title}, no time recorded`;
  }
  return '';
}

function recordHTML(rec, enter) {
  const sum = recordTotals(rec), day = dateKey(new Date(rec.startedAt));
  const totals = [`${fmtDur(sum.worked)} worked`, `${sum.done} ${sum.done === 1 ? 'step' : 'steps'} done`];
  if (sum.breaks >= 60) totals.push(`${fmtDur(sum.breaks)} break`);
  if (sum.paused >= 60) totals.push(`${fmtDur(sum.paused)} paused`);
  return `${sheetOpen(enter, 'Your session')}${sheetHead('Your session')}
    <p class="sub">${day === dateKey() ? '' : esc(fmtDayShort(day)) + ', '}${fmtTime(rec.startedAt)} to ${fmtTime(rec.endedAt)}</p>
    <p class="record-total">${esc(totals.join(' · '))}</p>
    <ol class="record">${rec.events.map(e => `<li><time>${fmtTime(e.at)}</time><span>${esc(eventText(e))}</span></li>`).join('')}</ol>
    <label class="label" for="record-note">Note <span class="muted">(optional)</span></label>
    <textarea id="record-note" class="text-input" rows="2" maxlength="500" placeholder="What got done, or what got in the way?">${esc(rec.note || '')}</textarea>
    <div class="sheet-foot"><span></span><button class="btn primary" data-act="close-layer">Done</button></div>
  </section>`;
}
